        hero.castTimer = 0.65; // cast pose (staff forward) for the whole beam
        startHeroAnim('brace', 0.65, 2, hero.facing);
        tipFlash(0.45);
        Sound.beam();
        kickCamera(Math.cos(aimAng), 0); // At most one tiny 1-px kick at start
        activeBeam = {
          id: ++beamSeq,
          baseAngle: aimAng,
          sweepAngle: -Math.PI / 2,           // sin() runs -1 -> 1: one even pass across the aim
          sweepSpeed: Math.PI / 0.65,
          length: beamLen,
          width: stats.width * hero.areaMult,
          dmg: stats.dmg * hero.damageMult * (overcharge ? 2 : 1),
          twin: w.evo === 'A', // Twin Lightning: a second beam behind you
          timer: 0.65,
          frameCounter: 0,
          segments: null,
          segments2: null,
          tipX: hero.x,
          tipY: hero.y
        };
      } else if (w.id === 'meteor') {
        if (startHeroAnim('meteor', 0.32, 3)) hero.castTimer = 0.32;
        tipFlash(0.5);
        const isComet = w.evo === 'B'; // Comet: one giant meteor, x4 damage, huge explosion
        const perTarget = w.evo === 'A' ? 3 : 1; // Meteor Shower: each meteor becomes a shower of 3
        const casts = isComet ? 1 : stats.count;
        for (let i = 0; i < casts; i++) {
          const target = findRandomEnemyCluster();
          const tx = target ? target.x : hero.x + (Math.random() - 0.5) * 500;
          const ty = target ? target.y : hero.y + (Math.random() - 0.5) * 500;
          for (let k = 0; k < perTarget; k++) {
            const off = k === 0 ? 0 : 70;
            const oAng = Math.random() * Math.PI * 2;
            spawnParticle({
              type: 'meteor_telegraph',
              x: tx + Math.cos(oAng) * off,
              y: ty + Math.sin(oAng) * off * 0.65,
              radius: stats.rad * hero.areaMult * (isComet ? 1.9 : 1),
              dmg: stats.dmg * hero.damageMult * (isComet ? 4 : 1),
              isComet,
              timer: 0.75 + k * 0.18,
              totalTimer: 0.75 + k * 0.18
            });
          }
        }
      } else if (w.id === 'orbs') {
        const isVoid = w.evo === 'B'; // Void Orb: one huge orb, x4 damage, pierces 6
        const count = isVoid ? 1 : stats.projs * (w.evo === 'A' ? 2 : 1);
        const targets = enemies
          .filter(e => Math.abs(e.x - hero.x) < 700 && Math.abs(e.y - hero.y) < 700)
          .sort((a, b) => Math.hypot(a.x - hero.x, a.y - hero.y) - Math.hypot(b.x - hero.x, b.y - hero.y))
          .slice(0, 3);
        if (!targets.length) return;
        hero.castTimer = 0.15;
        startHeroAnim('swirl', 0.2, 1);
        tipFlash();
        Sound.zap();
        const oTip = staffTip();
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + Math.random() * 0.4;
          spawnParticle({
            type: 'arcane_orb',
            x: oTip.x, y: oTip.y,
            vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260,
            target: targets[i % targets.length],
            dmg: stats.dmg * hero.damageMult * (isVoid ? 4 : 1),
            pierce: isVoid ? 6 : 1,
            size: (isVoid ? 2.2 : 1) * hero.areaMult,
            hitSet: new Set(),
            life: 3.0, maxLife: 3.0
          });
        }
      } else if (w.id === 'totem') {
        const spots = w.evo === 'A'
          ? [0, 1, 2].map(k => ({ x: hero.x + Math.cos(k * 2.094) * 120, y: hero.y + Math.sin(k * 2.094) * 80 }))
          : [{ x: hero.x + hero.facing * 34, y: hero.y + 38 }]; // planted in front of her so it reads
        startHeroAnim('plant', 0.22, 2);
        tipFlash();
        Sound.zap();
        spots.forEach(s => {
          playVFX('poof', s.x, s.y - 10, { scale: 0.75, fps: 18 });
          addShake(4);
          spawnParticle({
            type: 'hex_totem', x: s.x, y: s.y,
            dmg: stats.dmg * hero.damageMult, rad: stats.rad * hero.areaMult, rate: stats.rate,
            chain: w.evo === 'B' ? 3 : 0, zapTimer: 0.3, life: 6.0, maxLife: 6.0
          });
        });
      } else if (w.id === 'blades') {
        const storm = w.evo === 'A', reaper = w.evo === 'B';
        if (storm) { w.timer *= 0.75; w.cdMax = w.timer; } // Blade Storm: a constant ring of blades
        const range = stats.range * hero.areaMult * (reaper ? 1.15 : 1);
        const target = findNearestEnemy(hero.x, hero.y, range * 1.4);
        if (!target && !storm) return;
        const tp = staffTip();
        const aim = target ? Math.atan2(target.y - 15 - tp.y, target.x - tp.x) : (hero.facing > 0 ? 0 : Math.PI);
        if (target && !hero.isMoving && !hero.isDashing && !activeBeam) hero.facing = target.x >= hero.x ? 1 : -1;
        hero.castTimer = 0.15;
        startHeroAnim('flick', 0.18, 1, Math.cos(aim), Math.sin(aim));
        tipFlash(0.4);
        Sound.dash();
        const count = storm ? 8 : (reaper ? 1 : stats.blades);
        for (let i = 0; i < count; i++) {
          const ang = storm ? aim + (i / count) * Math.PI * 2 : aim + (i - (count - 1) / 2) * 0.32;
          spawnParticle({
            type: 'spectral_blade', x: tp.x, y: tp.y, ang,
            vx: Math.cos(ang) * stats.speed, vy: Math.sin(ang) * stats.speed,
            speed: stats.speed, range, travelled: 0, back: false, backT: 0,
            curve: (i % 2 ? 1 : -1) * 1.3, // alternate blades arc left/right
            spin: Math.random() * 6.28,
            dmg: stats.dmg * hero.damageMult * (reaper ? 3 : 1),
            size: reaper ? 2.3 : 1, execute: reaper,
            hitSet: new Set(), trail: [], trailT: 0,
            life: 3.0, maxLife: 3.0
          });
        }
      } else if (w.id === 'vortex') {
        if (startHeroAnim('swirl', 0.24, 2)) hero.castTimer = 0.2;
        tipFlash(0.45);
        const sing = w.evo === 'B'; // Singularity: bigger pull, x2.5 damage
        const wells = w.evo === 'A' ? 2 : 1;
        for (let k = 0; k < wells; k++) {
          const target = findRandomEnemyCluster();
          if (!target) return;
          Sound.zap();
          spawnParticle({
            type: 'gravity_well', x: target.x, y: target.y,
            rad: stats.rad * hero.areaMult * (sing ? 1.6 : 1),
            dmg: stats.dmg * hero.damageMult * (sing ? 2.5 : 1),
            pull: sing ? 390 : 260, sing, life: 1.4, maxLife: 1.4
          });
        }
      }
    }

    // --- NEW-WEAPON PARTICLES (update side; drawn in drawProjectilesAndEffects) ---
    function updateArcaneOrb(pt, dt) {
      if (!pt.target || pt.target.hp <= 0) pt.target = findNearestEnemy(pt.x, pt.y, 600);
      if (pt.target) {
        const a = Math.atan2(pt.target.y - 15 - pt.y, pt.target.x - pt.x);
        const steer = Math.min(1, dt * 7); // ponytail: linear velocity blend, real turn-rate if orbs feel floaty
        pt.vx += (Math.cos(a) * 520 - pt.vx) * steer;
        pt.vy += (Math.sin(a) * 520 - pt.vy) * steer;
      }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      const near = getNearbyEnemies(pt.x, pt.y, 40 * pt.size);
      for (let j = 0; j < near.length && pt.pierce > 0; j++) {
        const e = near[j];
        if (e.hp <= 0 || pt.hitSet.has(e) || Math.hypot(e.x - pt.x, e.y - 15 - pt.y) > e.radius + 10 * pt.size) continue;
        pt.hitSet.add(e);
        damageEnemy(e, pt.dmg, pt.vx >= 0 ? 1 : -1, false);
        playVFX('spark', pt.x, pt.y, { scale: 0.35 * pt.size, fps: 30, tint: 'pink', rot: Math.random() * 6.28 });
        pt.pierce--;
        pt.target = null;
      }
      if (pt.pierce <= 0) pt.life = 0;
    }

    // Spectral Blades: decelerate outward along a curving arc, then home back to the hero (hits again on the way back)
    const BLADE_CATCH_R = 26;
    const BLADE_EXECUTE_PCT = 0.10;
    function updateSpectralBlade(pt, dt) {
      pt.life -= dt;
      pt.spin += dt * 16;
      pt.trailT -= dt;
      if (pt.trailT <= 0) { // afterimage: last 3 positions, sampled every 30 ms
        pt.trailT = 0.03;
        pt.trail.unshift({ x: pt.x, y: pt.y, spin: pt.spin });
        if (pt.trail.length > 3) pt.trail.pop();
      }
      if (!pt.back) {
        const u = pt.travelled / pt.range;
        const spd = pt.speed * Math.max(0.18, 1 - u);
        pt.ang += pt.curve * dt;
        pt.vx = Math.cos(pt.ang) * spd;
        pt.vy = Math.sin(pt.ang) * spd;
        pt.travelled += spd * dt;
        if (u >= 1) { pt.back = true; pt.hitSet.clear(); } // fresh hit list for the return trip
      } else {
        pt.backT += dt;
        const tx = hero.x, ty = hero.y - 40;
        const a = Math.atan2(ty - pt.y, tx - pt.x);
        const spd = pt.speed * Math.min(1.35, 0.3 + pt.backT * 2.5);
        const steer = Math.min(1, dt * 8);
        pt.vx += (Math.cos(a) * spd - pt.vx) * steer;
        pt.vy += (Math.sin(a) * spd - pt.vy) * steer;
        if (Math.hypot(tx - pt.x, ty - pt.y) < BLADE_CATCH_R * pt.size) pt.life = 0; // caught
      }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      const hitR = 16 * pt.size;
      const near = getNearbyEnemies(pt.x, pt.y, hitR + 40);
      for (let j = 0; j < near.length; j++) {
        const e = near[j];
        if (e.hp <= 0 || pt.hitSet.has(e) || Math.hypot(e.x - pt.x, e.y - 15 - pt.y) > e.radius + hitR) continue;
        pt.hitSet.add(e);
        const dir = pt.vx >= 0 ? 1 : -1;
        playVFX('spark', pt.x, pt.y, { scale: 0.3 * pt.size, fps: 30, rot: Math.random() * 6.28 });
        kickCamera(dir * 1.5, 0);
        damageEnemy(e, pt.dmg, dir, false);
        // Reaper's Edge: anything left under 10% HP is cut down (bosses excluded)
        if (pt.execute && e.hp > 0 && !e.isBoss && e.hp < e.maxHp * BLADE_EXECUTE_PCT) {
          spawnParticle({ type: 'reaper_slash', x: e.x, y: e.y - 18, rot: Math.random() * Math.PI, life: 0.22, maxLife: 0.22 });
          addShake(4);
          damageEnemy(e, e.hp / DMG_TUNE + 1, dir, true);
        }
      }
    }

    function updateHexTotem(pt, dt) {
      pt.life -= dt;
      if (pt.zapFlash > 0) pt.zapFlash -= dt;
      pt.zapTimer -= dt;
      if (pt.zapTimer > 0) return;
      pt.zapTimer = pt.rate;
      const e = findNearestEnemy(pt.x, pt.y, pt.rad);
      if (!e) return;
      pt.zapFlash = 0.14; // crystal eye flares on every zap
      playVFX('spark', pt.x, pt.y - 84, { scale: 0.32, fps: 30 });
      spawnParticle({ type: 'lightning_bolt', x1: pt.x, y1: pt.y - 84, x2: e.x, y2: e.y - 15, life: 0.14, maxLife: 0.14 });
      playVFX('zap', e.x, e.y - 15, { scale: 0.45, fps: 24 });
      if (pt.chain) executeChainLightning(e, pt.chain, pt.dmg);
      else damageEnemy(e, pt.dmg, e.x >= pt.x ? 1 : -1, false);
    }

    function updateGravityWell(pt, dt) {
      pt.life -= dt;
      const near = getNearbyEnemies(pt.x, pt.y, pt.rad * 1.3);
      near.forEach(e => {
        if (e.isBoss) return;
        const dx = pt.x - e.x, dy = pt.y - e.y, d = Math.hypot(dx, dy) || 1;
        if (d > pt.rad * 1.3 || d < 8) return;
        e.x += (dx / d) * pt.pull * dt;
        e.y += (dy / d) * pt.pull * dt;
      });
      if (pt.life > 0) return;
      Sound.meteor();
      addShake(pt.sing ? 16 : 10);
      playVFX('explosion', pt.x, pt.y, { scale: pt.rad / 90, fps: 24, tint: 'pink' });
      getNearbyEnemies(pt.x, pt.y, pt.rad).forEach(e => {
        if (e.hp > 0 && Math.hypot(e.x - pt.x, e.y - pt.y) < pt.rad) damageEnemy(e, pt.dmg, e.x >= pt.x ? 1 : -1, true);
      });
    }

    function findNearestEnemy(x, y, maxDist = 9999) {
      let closest = null;
      let minD = maxDist;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - x, e.y - y);
        if (d < minD) {
          minD = d;
          closest = e;
        }
      });
      return closest;
    }

    function findRandomEnemyCluster() {
      if (enemies.length === 0) return null;
      return enemies[Math.floor(Math.random() * enemies.length)];
    }

    // Chain cast gesture: staff raised (cast pose, stretch up) + crackle at the crystal
    function chainRaise() {
      if (startHeroAnim('raise', 0.22, 3)) hero.castTimer = 0.22;
      const tp = staffTip();
      playVFX('zap', tp.x, tp.y, { scale: 0.4, fps: 30, rot: Math.random() * Math.PI * 2 });
    }

    // Chain lightning: first arc leaves from the staff crystal
    function executeChainLightning(startTarget, jumps, baseDamage) {
      let current = startTarget;
      let hitList = [current];
      damageEnemy(current, baseDamage, 1, true);

      const cTip = staffTip();
      let prevX = cTip.x;
      let prevY = cTip.y;

      for (let j = 0; j < jumps; j++) {
        spawnParticle({
          type: 'lightning_bolt',
          fromTip: j === 0, // first arc stays glued to the staff crystal while it lives
          x1: prevX,
          y1: prevY,
          x2: current.x,
          y2: current.y - 15,
          life: 0.16,
          maxLife: 0.16
        });

        prevX = current.x;
        prevY = current.y - 15;

        let nextTarget = null;
        let minDist = 320;
        enemies.forEach(e => {
          if (!hitList.includes(e)) {
            const d = Math.hypot(e.x - current.x, e.y - current.y);
            if (d < minDist) {
              minDist = d;
              nextTarget = e;
            }
          }
        });

        if (nextTarget) {
          hitList.push(nextTarget);
          current = nextTarget;
          damageEnemy(current, baseDamage * 0.85, 1, false);
        } else {
          break;
        }
      }
    }

    // --- ENEMY AI & COLLISION ---
    function updateEnemies(dt) {
      rebuildSpatialGrid(enemies);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.flashTimer > 0) e.flashTimer -= dt;
        if (e.slowTimer > 0) e.slowTimer -= dt;
        if (e.freezeTimer > 0) e.freezeTimer -= dt;
        if (e.hitFlash > 0) e.hitFlash -= dt;
        if (e.hurtT > 0) e.hurtT -= dt;
        if (e.atkRearm > 0) e.atkRearm -= dt;
        if (e.atkT >= 0 && (e.atkT += dt) >= ATK_S) e.atkT = -1;

        e.squashX += (1 - e.squashX) * dt * 14;
        e.squashY += (1 - e.squashY) * dt * 14;

        if (e.isBoss && e.stunTimer > 0) {
          e.stunTimer -= dt;
          e.walkTimer = 0;
          e.isMovingNow = false;
          continue;
        }

        const effectiveSpeed = e.freezeTimer > 0 ? 0 : e.speed * (e.slowTimer > 0 ? 0.45 : 1.0);
        const toHeroX = hero.x - e.x;
        const toHeroY = hero.y - e.y;
        const distToHero = Math.hypot(toHeroX, toHeroY);

        e.walkTimer += dt * (effectiveSpeed / 40);

        if (e.type === 'potbelly') {
          if (distToHero > 0.1) {
            e.vx = (toHeroX / distToHero) * effectiveSpeed;
            e.vy = (toHeroY / distToHero) * effectiveSpeed;
          }
        } else if (e.type === 'fishguy') {
          if (e.state === 'windup') {
            e.stateTimer -= dt;
            e.vx = 0;
            e.vy = 0;
            if (e.stateTimer <= ATK_WINDUP && e.atkT < 0) startEnemyAttack(e, true); // lunge lands on the strike
            if (e.stateTimer <= 0) {
              e.state = 'walk';
              Sound.hit(true);
              if (distToHero < 95) {
                hitHero(e.damage);
              }
            }
          } else {
            if (distToHero < 75) {
              e.state = 'windup';
              e.stateTimer = 0.6;
              e.attackTelegraph = 0.6;
              e.facing = toHeroX >= 0 ? 1 : -1; // swing toward the hero
            } else if (distToHero > 0.1) {
              e.vx = (toHeroX / distToHero) * effectiveSpeed;
              e.vy = (toHeroY / distToHero) * effectiveSpeed;
            }
          }
        } else if (e.type === 'grumbo') {
          e.castCooldown -= dt;
          if (e.castCooldown <= 0.5 && e.state !== 'casting') {
            e.state = 'casting';
          }
          if (e.castCooldown <= ATK_WINDUP && e.atkT < 0) startEnemyAttack(e, true); // cast thrust
          if (e.castCooldown <= 0) {
            e.state = 'walk';
            e.castCooldown = 2.8 + Math.random() * 1.2;
            const orbAngle = Math.atan2(toHeroY, toHeroX);
            enemyProjectiles.push({
              x: e.x,
              y: e.y - 20,
              vx: Math.cos(orbAngle) * 160,
              vy: Math.sin(orbAngle) * 160,
              radius: 12,
              dmg: 16.2, // -10% (was 18)
              life: 4.5
            });
            Sound.bolt();
          }

          if (distToHero < 190) {
            e.vx = (-toHeroX / distToHero) * effectiveSpeed * 0.9;
            e.vy = (-toHeroY / distToHero) * effectiveSpeed * 0.9;
          } else if (distToHero > 250) {
            e.vx = (toHeroX / distToHero) * effectiveSpeed;
            e.vy = (toHeroY / distToHero) * effectiveSpeed;
          } else {
            e.vx = 0;
            e.vy = 0;
          }
        } else if (e.type === 'mootaur') {
          e.attackCooldown -= dt;
          if (e.state === 'charge_windup') {
            e.stateTimer -= dt;
            e.vx = 0;
            e.vy = 0;
            if (e.stateTimer <= 0) {
              e.state = 'charging';
              e.stateTimer = 1.6;
              const chargeLen = Math.hypot(e.chargeDirX, e.chargeDirY) || 1;
              e.vx = (e.chargeDirX / chargeLen) * e.chargeSpeed;
              e.vy = (e.chargeDirY / chargeLen) * e.chargeSpeed;
              chargeDustBurst(e);
              e.dustT = 0;
            }
          } else if (e.state === 'charging') {
            e.stateTimer -= dt;
            if (Math.random() < 0.4) {
              spawnGroundCrack(e.x, e.y + e.radius * 0.5, 20);
            }
            if ((e.dustT -= dt) <= 0) { e.dustT = CHARGE_DUST_EVERY; chargeDustPuff(e); }

            // Boss charge breaks vases
            vases.forEach(v => {
              if (!v.broken && Math.hypot(e.x - v.x, e.y - v.y) < (e.radius + v.radius + 10)) {
                breakVase(v);
              }
            });

            let hitObstacle = false;
            PILLARS.forEach(p => {
              if (Math.hypot(e.x - p.x, e.y - p.y) < (e.radius + p.r)) {
                hitObstacle = true;
              }
            });
            if (!pointInOctagon(e.x + e.vx * dt * 3, e.y + e.vy * dt * 3)) {
              hitObstacle = true;
            }

            if (hitObstacle) {
              // Boss charge into a wall: explosion at 1.0 plus stars
              e.state = 'walk';
              e.stunTimer = 2.5;
              e.vx = 0;
              e.vy = 0;
              e.attackCooldown = 4.0;
              Sound.bossStun();
              addShake(18);
              kickCamera(-e.facing * 14, 0);
              screenFlash = 0.2;
              spawnCrater(e.x, e.y, 44);
              playVFX('explosion', e.x, e.y, { scale: 1.0, fps: 24 });
              chargeImpactDust(e);
            } else if (e.stateTimer <= 0) {
              // Boss sword slam: explosion at 1.4 plus poof
              e.state = 'walk';
              e.attackCooldown = 3.2;
              playVFX('explosion', e.x, e.y, { scale: 1.4, fps: 24 });
              playVFX('poof', e.x, e.y, { scale: 1.0, fps: 18 });
              addShake(8);
            }
          } else {
            if (distToHero > 0.1) {
              e.vx = (toHeroX / distToHero) * effectiveSpeed;
              e.vy = (toHeroY / distToHero) * effectiveSpeed;
            }
            if (e.attackCooldown <= 0) {
              e.state = 'charge_windup';
              e.stateTimer = 0.8;
              e.chargeDirX = toHeroX;
              e.chargeDirY = toHeroY;
              e.facing = toHeroX >= 0 ? 1 : -1;
              Sound.bossStun();
            }
          }
        }

        // Facing follows the sign of horizontal velocity (sprites face RIGHT), so nobody moonwalks
        // Dead-zone: |vx| <= 8 keeps the last facing, so near-vertical movers don't flicker
        // Grumbo (caster) always faces the hero it shoots at, even while backing off or standing
        if (e.type === 'grumbo') {
          if (toHeroX > 8) e.facing = 1;
          else if (toHeroX < -8) e.facing = -1;
        } else if (e.vx > 8) e.facing = 1;
        else if (e.vx < -8) e.facing = -1;
        // Walk-sheet frame rate scales with movement speed: ~10 fps at base speed
        const moveSpeed = Math.hypot(e.vx, e.vy);
        e.isMovingNow = moveSpeed > 5;
        if (e.isMovingNow) e.animTime += dt * 10 * Math.min(2.2, moveSpeed / e.speed);

        e.x += (e.vx + e.recoilX) * dt;
        e.y += (e.vy + e.recoilY) * dt;
        e.recoilX *= 0.85;
        e.recoilY *= 0.85;

        clampToOctagon(e, e.radius);

        const neighbors = getNearbyEnemies(e.x, e.y, e.radius * 2);
        for (let n = 0; n < neighbors.length; n++) {
          const other = neighbors[n];
          if (other !== e) {
            const dx = e.x - other.x;
            const dy = e.y - other.y;
            const d = Math.hypot(dx, dy);
            const minDist = e.radius + other.radius;
            if (d < minDist && d > 0.01) {
              const push = (minDist - d) * 0.14;
              e.x += (dx / d) * push;
              e.y += (dy / d) * push;
            }
          }
        }

        if (ENEMY_MELEE.has(e.type) && distToHero < e.radius + hero.radius + ATK_RANGE_PAD) startEnemyAttack(e, false);
        if (distToHero < (e.radius + hero.radius)) {
          hitHero(e.damage);
        }
      }
    }

    // --- BOSS CHARGE DUST (separate from the sprite so clean charge art still kicks up dirt) ---
    const CHARGE_DUST_EVERY = 0.06;
    const ROCK_COLORS = ['#5b4a3a', '#7a6650', '#3f342b'];
    function dustRock(x, y, vx, vy, size) {
      spawnParticle({
        type: 'chunk', x, y, vx, vy,
        groundY: y + 6 + Math.random() * 10, bounced: false,
        rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 16,
        size, color: ROCK_COLORS[(Math.random() * ROCK_COLORS.length) | 0], life: 0.55
      });
    }
    function chargeFeet(e) {
      const sp = Math.hypot(e.vx, e.vy) || 1;
      return { dx: e.vx / sp, dy: e.vy / sp, fx: e.x - (e.vx / sp) * e.radius * 0.7, fy: e.y + e.radius * 0.3 };
    }
    function chargeDustPuff(e) {
      const f = chargeFeet(e);
      const side = (Math.random() - 0.5) * e.radius * 0.9;
      playVFX('poof', f.fx - f.dy * side, f.fy + f.dx * side * 0.5 - 8, {
        scale: 0.38 + Math.random() * 0.2, fps: 16, rot: (Math.random() - 0.5) * 0.6, flip: Math.random() < 0.5
      });
      for (let i = 0; i < 2; i++) {
        dustRock(f.fx, f.fy - 4, -f.dx * (80 + Math.random() * 120) + (Math.random() - 0.5) * 90,
          -70 - Math.random() * 110, 2 + Math.random() * 3);
      }
    }
    function chargeDustBurst(e) {
      const f = chargeFeet(e);
      playVFX('poof', f.fx, f.fy - 14, { scale: 1.25, fps: 15, flip: Math.random() < 0.5 });
      for (let i = -1; i <= 1; i += 2) {
        playVFX('poof', f.fx + f.dy * i * e.radius, f.fy - f.dx * i * e.radius * 0.5 - 8, { scale: 0.7, fps: 15, flip: i > 0 });
      }
      for (let i = 0; i < 7; i++) {
        dustRock(f.fx, f.fy - 6, -f.dx * (60 + Math.random() * 160) + (Math.random() - 0.5) * 200,
          -110 - Math.random() * 150, 3 + Math.random() * 4);
      }
      addShake(6);
    }
    function chargeImpactDust(e) {
      spawnGroundCrack(e.x, e.y + e.radius * 0.4, e.radius * 0.9);
      const n = 10, r = e.radius * 1.15;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        playVFX('poof', e.x + Math.cos(a) * r, e.y + e.radius * 0.3 + Math.sin(a) * r * 0.45 - 10, {
          scale: 0.5 + Math.random() * 0.15, fps: 14, rot: (Math.random() - 0.5) * 0.5, flip: Math.cos(a) < 0
        });
      }
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        dustRock(e.x, e.y, Math.cos(a) * (120 + Math.random() * 120), -120 - Math.random() * 140, 3 + Math.random() * 4);
      }
    }

    // Enemy attack lunge (draw-only: wind-up lean back -> lunge toward the hero -> recover). Data in drawEnemy.
    const ATK_S = 0.3, ATK_WINDUP = 0.12, ATK_LUNGE_END = 0.2;
    const ATK_REACH = 12;        // px forward at the peak of the lunge
    const ATK_RANGE_PAD = 14;    // melee types start the swing this far before contact
    const ATK_REARM = 0.7;       // s between melee swings
    const ENEMY_MELEE = new Set(['potbelly', 'fishguy']);
    const HURT_S = 0.18;
    function startEnemyAttack(e, force) {
      if (e.isBoss || e.freezeTimer > 0 || e.atkT >= 0 || (!force && e.atkRearm > 0)) return;
      const dx = hero.x - e.x, dy = hero.y - e.y, d = Math.hypot(dx, dy) || 1;
      e.atkDX = dx / d; e.atkDY = dy / d;
      e.atkT = 0;
      e.atkRearm = ATK_REARM;
      if (Math.abs(dx) > 4) e.facing = dx > 0 ? 1 : -1;
    }

    function hitHero(damage) {
      if (isGod || hero.iFrames > 0 || isGameOver) return;
      // Balance: damage taken * 0.9, then +5% (user: +10% harder overall)
      damage *= 0.9 * 1.05;
      const m = gameTime / 60;
      damage *= Math.min(1.6, 0.3 + m * 0.14);
      if (speedMult > 1) (window.__hits ||= []).push([gameTime | 0, Math.round(damage)]);
      hero.hp = Math.max(0, hero.hp - damage);
      hero.iFrames = 0.8;
      hero.flashTimer = 0.15;
      Sound.hurt();
      addShake(18);
      screenRedFlash = 0.35;
      kickCamera(-hero.facing * 12, (Math.random() - 0.5) * 6);

      playVFX('spark', hero.x, hero.y - 12, { scale: 0.6, fps: 30, rot: Math.random() * Math.PI * 2 });

      if (hero.hp <= 0) {
        triggerGameOver(false);
      }
    }

    const DMG_TUNE = 0.85 * 0.95; // -5% player damage (+10% harder overall with the +5% damage taken)
    function damageEnemy(e, amount, hitDirX = 1, isCrit = false, quiet = false) { // quiet: a beam tick, no hit-stop / slow-mo / camera kick
      if (e.isBoss && e.stunTimer > 0) {
        amount *= 2;
        isCrit = true;
      }
      amount *= DMG_TUNE;
      if (hero.passives.focus && Math.random() < 0.06 * hero.passives.focus) { amount *= 1.75; isCrit = true; } // Arcane Focus
      e.hp -= amount;
      e.flashTimer = 0.1; // 0.1 s white flash
      if (e.hp > 0 && !e.isBoss && !(e.hurtT > 0)) { // flinch plays out, a beam's per-frame ticks don't freeze it
        e.hurtT = HURT_S;
        e.hurtDir = hitDirX < 0 ? -1 : 1;
        e.flashTimer = 0.12;
      }
      Sound.hit(isCrit);
      e.hitFlash = 0.12; // elite bar flash
      // Hit recoil: ~6-10 px push (velocity decays x0.85/frame, so v * ~0.11 s of travel)
      e.recoilX += hitDirX * (e.isBoss ? 25 : 75);
      e.squashX = 1.34;
      e.squashY = 0.70;

      const now = gameTime;
      if (!e.lastSparkTime || (now - e.lastSparkTime >= 0.12)) {
        if (activeVfxCount < 150) {
          e.lastSparkTime = now;
          const sparkScale = Math.min(0.7, Math.max(0.35, 0.35 + (amount / 100) * 0.35));
          playVFX('spark', e.x, e.y - 12, {
            scale: sparkScale,
            fps: 30,
            rot: Math.random() * Math.PI * 2
          });
        }
      }

      if ((isCrit && enemies.length < 120) || enemies.length < 30 || Math.random() < 0.03) {  // a frozen horde printed a wall of numbers
        spawnDamageNumber(e.x, e.y, amount, isCrit);
      }

      if (!quiet && (e.isElite || e.isBoss)) {
        // Hit-stop budget: one big dramatic freeze on the first elite/boss hit of the run,
        // none until 4:00, then a short freeze on every 3rd elite/boss hit.
        if (!bigHitStopDone) { bigHitStopDone = true; hitStopFrames = 4; slowMo(1.1); addShake(8); }
        else if (gameTime >= HITSTOP_RESUME_AT && ((e.juiceHits = (e.juiceHits || 0) + 1) % 3 === 1)) { hitStopFrames = 2; slowMo(0.45); } // hits 1, 4, 7 ... on this elite/boss
        addShake(isCrit ? 5 : 3);
        kickCamera(hitDirX * 5, 0);
      }

      if (e.hp <= 0) {
        killEnemy(e);
      }
    }

    function killEnemy(e) {
      killCount++;
      if (hero.passives.siphon && killCount % SIPHON_KILLS === 0 && hero.hp > 0) { // Soul Siphon
        const heal = 3 * hero.passives.siphon;
        hero.hp = Math.min(hero.maxHp, hero.hp + heal);
        spawnDamageNumber(hero.x, hero.y - 30, '+' + heal, false, true);
      }
      Sound.death();
      const idx = enemies.indexOf(e);
      if (idx !== -1) enemies.splice(idx, 1);

      let poofScale = 0.6;
      if (e.type === 'potbelly') poofScale = 0.6;
      else if (e.type === 'fishguy') poofScale = 0.9;
      else if (e.type === 'grumbo') poofScale = 0.8;
      else if (e.type === 'mootaur') poofScale = 2.2;
      if (e.isElite && e.type !== 'mootaur') poofScale *= 1.4;

      // Death VFX Rules:
      // 1. Frozen enemies shatter with frost at 0.7 instead of poof
      // 2. Normal deaths play poof
      if (e.slowTimer > 0) {
        playVFX('frost', e.x, e.y - (e.radius * 0.4), { scale: 0.7, fps: 20 });
        Sound.shatter();
      } else {
        playVFX('poof', e.x, e.y - (e.radius * 0.4), {
          scale: poofScale,
          fps: 18,
          rot: (Math.random() - 0.5) * 0.4,
          flip: Math.random() < 0.5
        });
      }

      if (e.type === 'potbelly') {
        spawnEnemyChunks(e.x, e.y, ['#0d9488', '#14b8a6', '#f59e0b'], 2);
        spawnSoulGem(e.x, e.y, 'small');
      } else if (e.type === 'fishguy') {
        spawnEnemyChunks(e.x, e.y, ['#0284c7', '#38bdf8', '#334155'], 3);
        spawnSoulGem(e.x, e.y, 'medium');
      } else if (e.type === 'grumbo') {
        spawnEnemyChunks(e.x, e.y, ['#65a30d', '#84cc16', '#a855f7'], 3);
        spawnSoulGem(e.x, e.y, 'medium');
      } else if (e.type === 'mootaur') {
        spawnEnemyChunks(e.x, e.y, ['#78350f', '#b45309', '#d97706'], 3);
      }

      // Elite death: explosion VFX at 0.9 and a chest with bounce
      if (e.isElite && !e.isBoss) {
        playVFX('explosion', e.x, e.y - 20, { scale: 0.9, fps: 24 });
        addShake(8);
        spawnSoulGem(e.x, e.y, 'large');
        chests.push({
          x: e.x,
          y: e.y,
          radius: 26,
          isRelicChest: true,
          bounceY: -35,
          vy: -120,
          landed: false,
          life: 180
        });
      }

      if (e.isBoss) {
        addShake(22);
        screenFlash = 0.35;
        hitStopFrames = 6;
        slowMo(1.4);
        spawnCrater(e.x, e.y, 55);
        spawnSoulGem(e.x, e.y, 'large');

        // Boss death: 4 staggered explosions at 2.0-3.0
        for (let b = 0; b < 4; b++) {
          setTimeout(() => {
            const ox = (Math.random() - 0.5) * e.radius * 1.2;
            const oy = (Math.random() - 0.5) * e.radius * 1.2 - 20;
            const explScale = 2.0 + Math.random() * 1.0;
            playVFX('explosion', e.x + ox, e.y + oy, { scale: explScale, fps: 20 });
            Sound.hit(true);
            addShake(10);
          }, b * 160);
        }

        chests.push({
          x: e.x,
          y: e.y,
          radius: 32,
          isRelicChest: true,
          bounceY: -40,
          vy: -140,
          landed: false,
          life: 180
        });

        if (e.isFinalBoss) {
          setTimeout(() => triggerGameOver(true), 800);
        }
      }
    }

    // --- PROJECTILES, PARTICLES & SOUL GEMS ---
    function updateProjectilesAndEffects(dt) {
      updateVFX(dt);

      // Hero projectiles
      for (let i = heroProjectiles.length - 1; i >= 0; i--) {
        const p = heroProjectiles[i];
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 3) p.trail.shift();

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;

        // Storm staff bolts leave tiny green sparks
        if (p.isStormStaff && Math.random() < 0.45) {
          playVFX('spark', p.x, p.y, { scale: 0.32, fps: 30, rot: Math.random() * Math.PI * 2 });
        }

        // Hit enemies
        const near = getNearbyEnemies(p.x, p.y, 35 * (p.size || 1));
        for (let j = 0; j < near.length; j++) {
          const e = near[j];
          if (Math.hypot(e.x - p.x, e.y - p.y) < (e.radius + 12 * (p.size || 1))) {
            if (p.hitSet) {
              // Piercing Lance: each enemy is hit once, the lance never stops
              if (p.hitSet.has(e)) continue;
              p.hitSet.add(e);
            }
            const isCrit = Math.random() < 0.25;
            damageEnemy(e, p.dmg, p.vx >= 0 ? 1 : -1, isCrit);
            p.pierce--;
            if (p.pierce <= 0) {
              p.life = 0;
              break;
            }
          }
        }

        // Break vases
        for (let k = 0; k < vases.length; k++) {
          const v = vases[k];
          if (!v.broken && Math.hypot(p.x - v.x, p.y - v.y) < (v.radius + 10)) {
            breakVase(v);
            p.pierce--;
            if (p.pierce <= 0) {
              p.life = 0;
              break;
            }
          }
        }

        if (p.life <= 0) heroProjectiles.splice(i, 1);
      }

      // Enemy projectiles
      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const ep = enemyProjectiles[i];
        ep.x += ep.vx * dt;
        ep.y += ep.vy * dt;
        ep.life -= dt;

        if (Math.hypot(hero.x - ep.x, hero.y - ep.y) < (hero.radius + ep.radius)) {
          hitHero(ep.dmg);
          ep.life = 0;
        }
        if (ep.life <= 0) enemyProjectiles.splice(i, 1);
      }

      // Particles & effects
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        if (pt.type === 'arcane_orb' || pt.type === 'hex_totem' || pt.type === 'gravity_well' || pt.type === 'spectral_blade') {
          if (pt.type === 'arcane_orb') updateArcaneOrb(pt, dt);
          else if (pt.type === 'spectral_blade') updateSpectralBlade(pt, dt);
          else if (pt.type === 'hex_totem') updateHexTotem(pt, dt);
          else updateGravityWell(pt, dt);
          if (pt.life <= 0) particles.splice(particles.indexOf(pt), 1); // index may shift: zaps push new particles
        } else if (pt.type === 'frost_ring_logic') {
          pt.life -= dt;
          // Ring edge follows the sprite ripple exactly: strip edge (57 -> 95 px) x animated scale
          const prog = Math.min(1, 1 - pt.life / pt.maxLife);
          pt.radius = (ICE_RING_EDGE_START + (ICE_RING_EDGE_END - ICE_RING_EDGE_START) * prog) *
            (pt.startScale + (pt.endScale - pt.startScale) * prog);
          // Freeze each enemy once, when the ring's (isometric) edge passes it
          enemies.forEach(e => {
            if (pt.hitSet.has(e)) return;
            const d = Math.hypot(e.x - pt.x, (e.y - pt.y) / ICE_RING_ISO_Y);
            if (d <= pt.radius + e.radius * 0.5) {
              pt.hitSet.add(e);
              e.slowTimer = 3.0;
              if (pt.freeze) e.freezeTimer = 2.5;
              damageEnemy(e, pt.dmg, 0, false);
            }
          });

          vases.forEach(v => {
            if (!v.broken && Math.hypot(v.x - pt.x, (v.y - pt.y) / ICE_RING_ISO_Y) <= pt.radius) {
              breakVase(v);
            }
          });

          if (pt.life <= 0) particles.splice(i, 1);
        } else if (pt.type === 'meteor_telegraph') {
          pt.timer -= dt;
          if (pt.timer <= 0) {
            // Meteor impact: explosion at 1.5, plus 3 fire loops for 2.5s, plus poof at 1.0 a moment later
            Sound.meteor();
            addShake(18);
            kickCamera((Math.random() - 0.5) * 12, 10);
            screenFlash = 0.24;
            spawnCrater(pt.x, pt.y, pt.radius * 0.7);
            playVFX('explosion', pt.x, pt.y, { scale: pt.isComet ? 3.2 : 1.5, fps: 24 });
            if (pt.isComet) {
              addShake(10);
              screenFlash = 0.4;
            }

            for (let f = 0; f < 3; f++) {
              const fAng = (f / 3) * Math.PI * 2 + Math.random() * 0.5;
              const fDist = 18 + Math.random() * (pt.radius * 0.35);
              playVFX('firetrail', pt.x + Math.cos(fAng) * fDist, pt.y + Math.sin(fAng) * fDist, {
                scale: 0.5,
                fps: 12,
                loop: true,
                life: 2.5,
                startFrame: Math.floor(Math.random() * 6)
              });
            }

            setTimeout(() => {
              playVFX('poof', pt.x, pt.y - 10, { scale: 1.0, fps: 18 });
            }, 200);

            const near = getNearbyEnemies(pt.x, pt.y, pt.radius);
            near.forEach(e => {
              if (Math.hypot(e.x - pt.x, e.y - pt.y) < pt.radius) {
                damageEnemy(e, pt.dmg, 1, true);
              }
            });

            vases.forEach(v => {
              if (!v.broken && Math.hypot(v.x - pt.x, v.y - pt.y) < pt.radius) {
                breakVase(v);
              }
            });

            particles.splice(i, 1);
          }
        } else if (pt.type === 'chunk') {
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vy += 540 * dt;
          pt.rot += pt.vrot * dt;
          if (pt.y >= pt.groundY && !pt.bounced) {
            pt.bounced = true;
            pt.vy = -pt.vy * 0.45;
            pt.vx *= 0.5;
            pt.vrot *= 0.5;
          } else if (pt.y >= pt.groundY && pt.bounced) {
            pt.y = pt.groundY;
            pt.vx *= 0.9;
            pt.vrot *= 0.8;
          }
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        } else {
          pt.x += (pt.vx || 0) * dt;
          pt.y += (pt.vy || 0) * dt;
          pt.life -= dt;
          if (pt.life <= 0) particles.splice(i, 1);
        }
      }

      // Ground decals decay
      for (let i = groundDecals.length - 1; i >= 0; i--) {
        const d = groundDecals[i];
        d.life -= dt;
        if (d.life <= 0) groundDecals.splice(i, 1);
      }

      // Damage numbers
      for (let i = damageNumbers.length - 1; i >= 0; i--) {
        const dn = damageNumbers[i];
        dn.y -= dt * 42;
        dn.life -= dt;
        if (dn.life <= 0) damageNumbers.splice(i, 1);
      }

      // Vases broken timer update
      for (let i = vases.length - 1; i >= 0; i--) {
        const v = vases[i];
        if (v.broken) {
          v.brokenTimer -= dt;
          if (v.brokenTimer <= 0) vases.splice(i, 1);
        }
      }

      // Pickups collection
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.life -= dt;
        if (Math.hypot(hero.x - p.x, hero.y - p.y) < (hero.radius + p.radius + 6)) {
          collectPickup(p);
          pickups.splice(i, 1);
          continue;
        }
        if (p.life <= 0) pickups.splice(i, 1);
      }

      // Screen flashes decay
      if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 4.5);
      if (screenRedFlash > 0) screenRedFlash = Math.max(0, screenRedFlash - dt * 3.5);

      // Soul gems & Magnet
      for (let i = soulGems.length - 1; i >= 0; i--) {
        const gem = soulGems[i];
        const dHero = Math.hypot(hero.x - gem.x, hero.y - gem.y);
        if (dHero < hero.magnetRadius) {
          gem.magnetized = true;
        }

        if (gem.magnetized) {
          const pullSpeed = 460 + (hero.magnetRadius - dHero) * 3;
          gem.vx = ((hero.x - gem.x) / dHero) * pullSpeed;
          gem.vy = ((hero.y - gem.y) / dHero) * pullSpeed;
          gem.x += gem.vx * dt;
          gem.y += gem.vy * dt;

          if (dHero < hero.radius + 15) {
            collectGem(gem);
            soulGems.splice(i, 1);
            continue;
          }
        } else {
          gem.vx *= 0.9;
          gem.vy *= 0.9;
          gem.x += gem.vx * dt;
          gem.y += gem.vy * dt;
        }
      }

      // Chests update & pickup
      for (let i = chests.length - 1; i >= 0; i--) {
        const ch = chests[i];
        if (ch.bounceY < 0 || ch.vy !== 0) {
          ch.bounceY += ch.vy * dt;
          ch.vy += 450 * dt;
          if (ch.bounceY >= 0) {
            ch.bounceY = 0;
            ch.vy = 0;
            if (!ch.landed) {
              ch.landed = true;
              // levelup tinted gold at 0.7 when chest lands
              playVFX('levelup', ch.x, ch.y, { scale: 0.7, fps: 16, tint: 'gold' });
              Sound.clunk();
              addShake(3);
            }
          }
        }

        if (Math.hypot(hero.x - ch.x, hero.y - ch.y) < (hero.radius + ch.radius)) {
          Sound.levelUp();
          openRelicModal();
          chests.splice(i, 1);
        }
      }
    }

    function collectGem(gem) {
      Sound.gem();
      hero.xp += gem.xp;

      spawnParticle({
        type: 'collect_ring',
        x: gem.x,
        y: gem.y,
        radius: 6,
        life: 0.22,
        maxLife: 0.22
      });

      spawnParticle({
        type: 'xp_sparkle',
        x: hero.x + (Math.random() - 0.5) * 20,
        y: hero.y - 25,
        text: `+${gem.xp} XP`,
        life: 0.45,
        maxLife: 0.45
      });

      if (hero.xp >= hero.xpNeeded) {
        hero.xp -= hero.xpNeeded;
        hero.level++;
        hero.xpNeeded = Math.round(26 * Math.pow(1.16, hero.level - 1));
        Sound.levelUp();
        playVFX('levelup', hero.x, hero.y - 15, { scale: 1.3, fps: 14 });
        startHeroAnim('hop', 0.3, 5);
        const lTip = staffTip();
        playVFX('spark', lTip.x, lTip.y, { scale: 0.9, fps: 24, tint: 'gold' });
        setTimeout(() => openLevelUpModal(false), 430);
      }
    }

    // --- LEVEL UP & RELIC MODALS ---
    let isPausedForModal = false;

    let pendingLevelUps = 0;
    function releaseModal() {
      isPausedForModal = false;
      if (pendingLevelUps > 0) { pendingLevelUps--; setTimeout(() => openLevelUpModal(false), 250); }
    }
    function openLevelUpModal(isChest = false) {
      // Two level-ups 430 ms apart used to rebuild the open modal and silently eat one: queue it instead
      if (isPausedForModal) { pendingLevelUps++; return; }
      isPausedForModal = true;
      const modal = document.getElementById('level-modal');
      const heading = document.getElementById('modal-heading');
      const subheading = document.getElementById('modal-subheading');
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      heading.innerText = 'LEVEL UP!';
      heading.style.color = '#ffd23f';
      subheading.innerText = 'Choose your arcana power';

      const closeModal = () => {
        modal.style.display = 'none';
        releaseModal();
      };

      const choices = generateUpgradeChoices();
      choices.forEach(opt => {
        const isEvolve = opt.type === 'evolve';
        const isBonus = opt.type === 'heal' || opt.type === 'gold';
        const card = document.createElement('div');
        card.className = isEvolve ? 'upgrade-card card-evolve' : 'upgrade-card';
        if (isEvolve) {
          card.style.borderColor = '#ffd23f';
          card.style.boxShadow = '0 8px 0 #78350f, 0 0 22px rgba(255, 210, 63, 0.55)';
        }

        const badge = document.createElement('div');
        badge.className = 'card-badge';
        if (isEvolve) {
          badge.innerText = 'EVOLVE';
          badge.style.background = '#ffd23f';
          badge.style.color = '#1a1a1a';
        } else if (isBonus) {
          badge.innerText = 'BONUS';
        } else {
          badge.innerText = opt.isNew ? 'NEW!' : `LV ${opt.currentLvl}→${opt.currentLvl + 1}`;
        }
        card.appendChild(badge);

        const icon = document.createElement('div');
        icon.className = 'card-icon';
        const img = new Image();
        img.src = opt.iconSrc || `sprites/icons/${opt.id}.png`;
        img.alt = opt.name;
        img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block';
        if (opt.iconFilter) img.style.filter = opt.iconFilter;
        img.onerror = () => { icon.innerText = opt.icon; };
        icon.appendChild(img);
        card.appendChild(icon);

        const title = document.createElement('div');
        title.className = 'card-title';
        title.innerText = opt.name;
        if (isEvolve) title.style.color = '#ffd23f';
        card.appendChild(title);

        const lvl = document.createElement('div');
        lvl.className = 'card-level';
        // "Lv 4 -> 5": the old "Lv 5/5" showed the TARGET level and read as already maxed
        if (isEvolve) lvl.innerText = `Weapon MAX: pick one evolution`;
        else if (isBonus) lvl.innerText = 'Everything is maxed';
        else if (opt.isNew) lvl.innerText = `${opt.type === 'weapon' ? 'New weapon' : 'New passive'} · Lv 1`;
        else lvl.innerText = `${opt.type === 'weapon' ? 'Weapon' : 'Passive'} Lv ${opt.currentLvl} → ${opt.currentLvl + 1}${opt.currentLvl + 1 === MAX_LEVEL ? ' (MAX)' : ''}`;
        card.appendChild(lvl);

        if (isEvolve) {
          // Two variant buttons; the card itself does nothing
          ['A', 'B'].forEach(variant => {
            const ev = EVOLUTIONS[opt.id][variant];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.style.cssText = 'display:block;width:100%;margin-top:6px;padding:6px 4px;background:#3b2f15;border:2px solid #ffd23f;border-radius:8px;color:#fff;cursor:pointer;font:inherit;text-align:center';
            const bName = document.createElement('div');
            bName.style.cssText = 'font-weight:900;color:#ffd23f;font-size:13px';
            bName.innerText = ev.name;
            const bDesc = document.createElement('div');
            bDesc.style.cssText = 'font-size:11px;color:#e2e8f0;margin-top:2px';
            bDesc.innerText = ev.desc;
            btn.appendChild(bName);
            btn.appendChild(bDesc);
            btn.onclick = (evt) => {
              evt.stopPropagation();
              applyChoice(opt, variant);
              closeModal();
            };
            card.appendChild(btn);
          });
        } else {
          const desc = document.createElement('div');
          desc.className = 'card-desc';
          desc.innerText = opt.desc;
          card.appendChild(desc);

          card.onclick = () => {
            applyChoice(opt);
            closeModal();
          };
        }

        container.appendChild(card);
      });

      modal.style.display = 'flex';
    }

    // Blessings: repeatable chest rewards once every relic is owned (stack on top of passives)
    const blessCount = { might: 0, haste: 0 };
    function recalcBlessings() {
      hero.damageMult = 1.0 + hero.passives.damage * 0.15 + blessCount.might * 0.08;
      hero.cooldownMult = Math.max(0.4, 1.0 - hero.passives.cooldown * 0.08 - blessCount.haste * 0.04);
    }
    const BLESSINGS = [
      { name: 'Arcane Might', desc: '+8% damage (stacks forever).', icon: 'sprites/icons/damage.png', apply: () => { blessCount.might++; recalcBlessings(); } },
      { name: 'Swift Sigil', desc: '-4% weapon cooldowns (stacks).', icon: 'sprites/icons/cooldown.png', apply: () => { blessCount.haste++; recalcBlessings(); } },
      { name: 'Troll Heart', desc: '+20 max HP and a full heal.', icon: 'sprites/icons/health.png', apply: () => { hero.maxHp += 20; hero.hp = hero.maxHp; } },
      { name: 'Dragon Hoard', desc: 'A shower of 8 big soul gems.', icon: 'sprites/items/soul-large.png', apply: () => { for (let i = 0; i < 8; i++) spawnSoulGem(hero.x + (Math.random() - 0.5) * 140, hero.y + (Math.random() - 0.5) * 100, 'large'); } }
    ];
    function openRelicModal() {
      isPausedForModal = true;
      const modal = document.getElementById('level-modal');
      const heading = document.getElementById('modal-heading');
      const subheading = document.getElementById('modal-subheading');
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      heading.innerText = 'RELIC DISCOVERED!';
      heading.style.color = '#ffd23f';
      subheading.innerText = 'Choose 1 legendary relic to empower your run';

      const unobtained = Object.keys(RELIC_REGISTRY).filter(id => !hero.relics.has(id));
      const allOwned = unobtained.length === 0;
      if (allOwned) { heading.innerText = 'BLESSING!'; subheading.innerText = 'All relics found: choose a blessing'; }
      const pool = allOwned ? BLESSINGS.slice().sort(() => 0.5 - Math.random()).slice(0, 2)
                            : unobtained.sort(() => 0.5 - Math.random()).slice(0, 2).map(id => RELIC_REGISTRY[id]);

      pool.forEach(relic => {
        const card = document.createElement('div');
        card.className = 'upgrade-card card-relic';
        card.style.borderColor = '#ffd23f';
        card.style.boxShadow = '0 8px 0 #78350f, 0 0 20px rgba(255, 210, 63, 0.4)';

        const badge = document.createElement('div');
        badge.className = 'card-badge';
        badge.style.background = '#ffd23f';
        badge.style.color = '#1a1a1a';
        badge.innerText = allOwned ? 'BLESSING' : 'RELIC';
        card.appendChild(badge);

        const icon = document.createElement('div');
        icon.className = 'card-icon';
        icon.style.background = '#3b2f15';
        icon.style.borderColor = '#ffd23f';
        const img = new Image();
        img.src = relic.icon;
        img.alt = relic.name;
        img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block';
        img.onerror = () => { icon.innerText = '⭐'; };
        icon.appendChild(img);
        card.appendChild(icon);

        const title = document.createElement('div');
        title.className = 'card-title';
        title.innerText = relic.name;
        title.style.color = '#ffd23f';
        card.appendChild(title);

        const lvl = document.createElement('div');
        lvl.className = 'card-level';
        lvl.innerText = allOwned ? 'Stacking blessing' : 'Legendary Relic';
        card.appendChild(lvl);

        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.innerText = relic.desc;
        card.appendChild(desc);

        card.onclick = () => {
          relic.apply();
          Sound.levelUp();
          playVFX('levelup', hero.x, hero.y - 15, { scale: 1.2, fps: 16, tint: 'gold' });
          modal.style.display = 'none';
          releaseModal();
          heading.innerText = 'LEVEL UP!';
          subheading.innerText = 'Choose your arcana power';
        };

        container.appendChild(card);
      });

      modal.style.display = 'flex';
    }

    // --- LEVEL-UP OFFERS: weighted pick of 3 distinct cards, rotation memory, weapon pity ---
    // An item at MAX_LEVEL is never a normal card: a 5/5 weapon offers only its EVOLVE card,
    // an evolved weapon and a 5/5 passive leave the pool. selfCheckOffers() proves it (?god=1).
    const MAX_WEAPONS = Object.keys(WEAPON_REGISTRY).length; // no cap: every weapon can be owned in one run
    // v17 balance: 0.7 starved owned upgrades and runs got hard. Early game (first 3 min) favours upgrades.
    const NEW_WEAPON_CHANCE = 0.8;       // while unowned weapons exist, one card is a new weapon this often
    const NEW_WEAPON_CHANCE_EARLY = 0.65;
    const EARLY_GAME_S = 180;
    const PITY_LEVELUPS = 2;             // no new-weapon card at all for this many level-ups -> force one (after early game)
    const OFFER_WEIGHT = { weapon: 1.0, evolve: 2.0, passive: 0.8 };
    const RECENT_MULT = 0.35;      // offered in the last 2 level-ups
    const FRESH_MULT = 1.6;        // never offered this run
    const OWNED_UPGRADE_CHANCE = 0.45;
    const OWNED_UPGRADE_CHANCE_EARLY = 0.6;
    let lastNewWeaponTurn = 0;    // levelUpCount when any unowned weapon was last offered
    let levelUpCount = 0;
    const weaponLastOffered = {}; // weapon id -> levelUpCount when last offered
    const recentOffers = [];      // keys offered in the last 2 level-ups
    const everOffered = new Set();
    let goldScore = 0;

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    const offerKey = c => c.type + ':' + c.id;

    function offerWeight(c) {
      const key = offerKey(c);
      let w = OFFER_WEIGHT[c.type];
      if (recentOffers.some(r => r.includes(key))) w *= RECENT_MULT;
      else if (!everOffered.has(key)) w *= FRESH_MULT;
      return w;
    }

    // Removes and returns one weighted-random entry of `list` (null when empty)
    function takeWeighted(list) {
      if (!list.length) return null;
      const total = list.reduce((s, c) => s + offerWeight(c), 0);
      let r = Math.random() * total;
      for (let i = 0; i < list.length; i++) {
        r -= offerWeight(list[i]);
        if (r <= 0) return list.splice(i, 1)[0];
      }
      return list.pop();
    }

    // The one place the candidate pool is built: owned weapon < MAX -> upgrade, == MAX and no evo -> evolve, evo -> nothing
    function buildOfferCandidates(weapons, passives) {
      const candidates = [];
      const slotFree = weapons.length < MAX_WEAPONS;
      Object.keys(WEAPON_REGISTRY).forEach(id => {
        const reg = WEAPON_REGISTRY[id];
        const base = { id, name: reg.name, icon: reg.icon, iconSrc: reg.iconSrc, iconFilter: reg.iconFilter };
        const owned = weapons.find(w => w.id === id);
        if (owned) {
          if (owned.evo) return;
          if (owned.level >= MAX_LEVEL) candidates.push({ ...base, type: 'evolve', currentLvl: MAX_LEVEL, desc: '', isNew: false });
          else candidates.push({ ...base, type: 'weapon', currentLvl: owned.level, desc: reg.desc, isNew: false });
        } else if (slotFree) {
          candidates.push({ ...base, type: 'weapon', currentLvl: 0, desc: reg.desc, isNew: true });
        }
      });
      Object.keys(PASSIVE_REGISTRY).forEach(id => {
        const current = passives[id] || 0;
        if (current >= MAX_LEVEL) return;
        const reg = PASSIVE_REGISTRY[id];
        candidates.push({ id, name: reg.name, icon: reg.icon, iconSrc: reg.iconSrc, iconFilter: reg.iconFilter,
          type: 'passive', currentLvl: current, desc: reg.desc, isNew: current === 0 });
      });
      return { candidates, slotFree };
    }

    function generateUpgradeChoices(weapons = hero.weapons, passives = hero.passives, record = true) {
      const turn = levelUpCount + 1;
      const { candidates, slotFree } = buildOfferCandidates(weapons, passives);
      const pool = shuffleInPlace(candidates.slice());
      const picks = [];
      const take = filter => {
        const sub = pool.filter(filter);
        const c = takeWeighted(sub);
        if (c) { pool.splice(pool.indexOf(c), 1); picks.push(c); }
        return c;
      };

      const early = gameTime < EARLY_GAME_S;
      // Pity rule (after the early game): no new-weapon card in the last 6 level-ups -> the least recently
      // offered unowned weapon is forced in. One trickle, so every weapon still shows up over a full run.
      if (slotFree && turn - lastNewWeaponTurn > PITY_LEVELUPS) {
        const starved = pool.filter(c => c.type === 'weapon' && c.isNew);
        if (starved.length) {
          starved.sort((a, b) => (weaponLastOffered[a.id] || 0) - (weaponLastOffered[b.id] || 0));
          pool.splice(pool.indexOf(starved[0]), 1);
          picks.push(starved[0]);
        }
      }
      // Owned upgrade first (90% early, 60% later), then ~40% (20% early) one card is a weapon you do not own yet
      const isNewWeapon = c => c.type === 'weapon' && c.isNew;
      const isOwnedUp = c => c.type === 'evolve' || (c.type === 'weapon' && !c.isNew);
      if (!picks.some(isOwnedUp) && Math.random() < (early ? OWNED_UPGRADE_CHANCE_EARLY : OWNED_UPGRADE_CHANCE)) take(isOwnedUp);
      if (!picks.some(isNewWeapon) && Math.random() < (early ? NEW_WEAPON_CHANCE_EARLY : NEW_WEAPON_CHANCE)) take(isNewWeapon);
      // Slots free: at least one weapon card in every offer
      if (slotFree && !picks.some(c => c.type === 'weapon' || c.type === 'evolve')) take(isOwnedUp) || take(c => c.type === 'weapon');
      // Fill: unowned weapons only appear through the rolls above (else 10 fresh weapons flood the filler slots)
      while (picks.length < 3 && pool.length) take(c => !isNewWeapon(c)) || take(() => true);

      // Everything maxed or evolved: bonus cards instead
      const fallbacks = [
        { type: 'heal', id: 'heal', name: 'Full Heal', icon: '❤️', desc: 'Restore all of your HP.', isNew: false, currentLvl: 0 },
        { type: 'gold', id: 'gold', name: '+50 Gold', icon: '🪙', desc: '+50 gold score.', isNew: false, currentLvl: 0 }
      ];
      for (let i = 0; i < fallbacks.length && picks.length < 3; i++) picks.push(fallbacks[i]);

      shuffleInPlace(picks);
      if (record) {
        levelUpCount = turn;
        if (picks.some(isNewWeapon)) lastNewWeaponTurn = turn;
        picks.forEach(c => {
          if (c.type === 'weapon' || c.type === 'evolve') weaponLastOffered[c.id] = turn;
          everOffered.add(offerKey(c));
        });
        recentOffers.push(picks.map(offerKey));
        if (recentOffers.length > 2) recentOffers.shift();
        (window.__offers ||= []).push(picks.map(c => `${c.type}:${c.id}:${c.currentLvl}`));
      }
      return picks;
    }

    // Startup self-check (?god=1): 500 random states -> no maxed/evolved item is ever offered, 3 distinct cards
    function selfCheckOffers() {
      const wIds = Object.keys(WEAPON_REGISTRY);
      const pIds = Object.keys(PASSIVE_REGISTRY);
      const errors = [];
      for (let n = 0; n < 500; n++) {
        const weapons = shuffleInPlace(wIds.slice()).slice(0, 1 + Math.floor(Math.random() * MAX_WEAPONS)).map(id => {
          const level = 1 + Math.floor(Math.random() * MAX_LEVEL);
          return { id, level, evo: level === MAX_LEVEL && Math.random() < 0.5 ? (Math.random() < 0.5 ? 'A' : 'B') : undefined };
        });
        const passives = {};
        pIds.forEach(id => { passives[id] = Math.floor(Math.random() * (MAX_LEVEL + 1)); });
        const picks = generateUpgradeChoices(weapons, passives, false);
        if (picks.length !== 3 || new Set(picks.map(offerKey)).size !== 3) errors.push(`#${n} not 3 distinct`);
        picks.forEach(c => {
          const w = weapons.find(x => x.id === c.id);
          const bad =
            (c.type === 'weapon' && (w ? (w.evo || w.level >= MAX_LEVEL || c.currentLvl !== w.level) : weapons.length >= MAX_WEAPONS)) ||
            (c.type === 'evolve' && (!w || w.evo || w.level !== MAX_LEVEL)) ||
            (c.type === 'passive' && passives[c.id] >= MAX_LEVEL);
          if (bad) errors.push(`#${n} offered maxed ${offerKey(c)} lv${c.currentLvl}`);
        });
      }
      console.info(`[offers self-check] 500 random offers: ${errors.length ? 'FAIL ' + errors.slice(0, 5).join('; ') : 'PASS (no maxed/evolved item offered)'}`);
      return errors.length === 0;
    }
    if (isGod) selfCheckOffers();

    function applyChoice(opt, variant) {
      if (opt.type === 'weapon') {
        const owned = hero.weapons.find(w => w.id === opt.id);
        if (owned) {
          owned.level = Math.min(MAX_LEVEL, owned.level + 1); // hard cap 5
        } else if (hero.weapons.length < MAX_WEAPONS) {
          hero.weapons.push({ id: opt.id, level: 1, timer: 0.1 });
        }
      } else if (opt.type === 'evolve') {
        const owned = hero.weapons.find(w => w.id === opt.id);
        if (owned && owned.level >= MAX_LEVEL && !owned.evo && (variant === 'A' || variant === 'B')) {
          owned.evo = variant;
          Sound.evolve();
          playVFX('levelup', hero.x, hero.y - 15, { scale: 1.3, fps: 16, tint: 'gold' });
        }
      } else if (opt.type === 'passive') {
        if (hero.passives[opt.id] < MAX_LEVEL) PASSIVE_REGISTRY[opt.id].apply(); // hard cap 5
      } else if (opt.type === 'heal') {
        hero.hp = hero.maxHp;
        spawnDamageNumber(hero.x, hero.y - 20, 'FULL', false, true);
      } else if (opt.type === 'gold') {
        goldScore += 50;
      }
    }

    // --- GAME ENDING MODAL ---
    function triggerGameOver(victory) {
      isGameOver = true;
      isVictory = victory;
      stopMusic();
      if (victory) Sound.victory(); else Sound.defeat();
      const modal = document.getElementById('end-modal');
      const title = document.getElementById('end-title');
      const stats = document.getElementById('end-stats');

      title.className = `end-title ${victory ? 'victory' : 'defeat'}`;
      title.innerText = victory ? 'VICTORY' : 'DEFEATED';

      const mins = Math.floor(gameTime / 60);
      const secs = Math.floor(gameTime % 60);
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      stats.innerHTML = `
        <div><strong>Time Survived:</strong> ${timeStr}</div>
        <div><strong>Level Reached:</strong> ${hero.level}</div>
        <div><strong>Enemies Vanquished:</strong> ${killCount}</div>
        ${goldScore > 0 ? `<div><strong>Gold:</strong> ${goldScore}</div>` : ''}
      `;

      modal.style.display = 'flex';
      if (lbOn && (!(urlParams.has('god') || urlParams.has('speed')) || urlParams.get('lbapi'))) {
        window.SVTI_Leaderboard.showResultCard({ kills: killCount, survival_time: Math.floor(gameTime), level: hero.level, won: !!victory });
      }
      document.getElementById('restart-btn').onclick = () => {
        window.location.reload();
      };
    }

    // --- RENDER PIPELINE ---
    const renderables = [];
    const GROUND_VFX = new Set(['fire', 'firetrail', 'icering']); // drawn flat under characters

    function draw() {
      ctx.save();
      ctx.scale(dpr, dpr);

      let shakeOffsetX = 0;
      let shakeOffsetY = 0;
      if (CAMERA.shake > 0) {
        shakeOffsetX = (Math.random() - 0.5) * CAMERA.shake;
        shakeOffsetY = (Math.random() - 0.5) * CAMERA.shake;
        CAMERA.shake = Math.max(0, CAMERA.shake - 0.8);
      }

      CAMERA.kickX *= 0.82;
      CAMERA.kickY *= 0.82;
      if (Math.abs(CAMERA.kickX) < 0.1) CAMERA.kickX = 0;
      if (Math.abs(CAMERA.kickY) < 0.1) CAMERA.kickY = 0;

      CAMERA.x += (hero.x - CAMERA.x) * 0.1;
      CAMERA.y += (hero.y - CAMERA.y) * 0.1;

      // zoom in just enough that the view always fits inside the map (no bars on any aspect), then clamp
      CAMERA.zoom = Math.max(CAM_ZOOM, screenW / (ARENA_W - 2 * CAM_EDGE), screenH / (ARENA_H - 2 * CAM_EDGE));
      const halfViewW = (screenW / 2) / CAMERA.zoom;
      const halfViewH = (screenH / 2) / CAMERA.zoom;
      CAMERA.x = Math.max(CAM_EDGE + halfViewW, Math.min(ARENA_W - CAM_EDGE - halfViewW, CAMERA.x));
      CAMERA.y = Math.max(CAM_EDGE + halfViewH, Math.min(ARENA_H - CAM_EDGE - halfViewH, CAMERA.y));

      ctx.fillStyle = '#0d0c13';
      ctx.fillRect(0, 0, screenW, screenH);

      // WORLD SPACE TRANSFORM
      ctx.save();
      ctx.translate(screenW / 2 + shakeOffsetX + CAMERA.kickX, screenH / 2 + shakeOffsetY + CAMERA.kickY);
      ctx.scale(CAMERA.zoom, CAMERA.zoom);
      ctx.translate(-CAMERA.x, -CAMERA.y);

      // 1. Arena (Pillar debug drawing removed)
      drawArena();

      // 2. Ground Decals & Chests
      drawGroundObjects();

      // 3. Soul Gems
      drawSoulGems();

      // 4. Characters, Vases, Pickups & Sprite VFX (Depth sorted in world space)
      renderables.length = 0;
      for (let i = 0; i < enemies.length; i++) {
        renderables.push(enemies[i]);
      }
      renderables.push(hero);
      for (let i = 0; i < vases.length; i++) {
        renderables.push(vases[i]);
      }
      for (let i = 0; i < pickups.length; i++) {
        renderables.push(pickups[i]);
      }
      for (let i = 0; i < VFX_POOL_SIZE; i++) {
        const v = vfxPool[i];
        if (v.active) renderables.push(v);
      }

      // depth key computed once per item (the comparator used to recompute it, with a Set lookup, on every comparison)
      for (let i = 0; i < renderables.length; i++) {
        const a = renderables[i];
        a._sy = (((a === hero) ? hero.y : (a.y + (a.name ? (GROUND_VFX.has(a.name) ? -10000 : 2) : 0))) * 4) | 0; // quarter-pixel integer key: the comparator then returns small ints (no boxed number per comparison)
      }
      renderables.sort((a, b) => a._sy - b._sy);

      renderables.forEach(item => {
        if (item === hero) drawHero(hero);
        else if (item.name) drawVFXInstance(item);
        else if (item.broken !== undefined) drawVase(item);
        else if (item.bobOffset !== undefined) drawPickup(item);
        else drawEnemy(item);
      });

      // 5. Projectiles, Green Lightning & Numbers
      drawProjectilesAndEffects();

      ctx.restore(); // END WORLD SPACE

      // SCREEN SPACE HUD & FULLSCREEN FLASHES
      drawHUD();

      // White impact flash
      if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.55, screenFlash)})`;
        ctx.fillRect(0, 0, screenW, screenH);
      }

      // Edge damage flash
      if (screenRedFlash > 0) {
        const edgeGrad = ctx.createRadialGradient(screenW / 2, screenH / 2, screenW * 0.35, screenW / 2, screenH / 2, screenW * 0.65);
        edgeGrad.addColorStop(0, 'rgba(239, 68, 68, 0)');
        edgeGrad.addColorStop(1, `rgba(239, 68, 68, ${Math.min(0.65, screenRedFlash)})`);
        ctx.fillStyle = edgeGrad;
        ctx.fillRect(0, 0, screenW, screenH);
      }

      // Low Health Vignette Pulse (< 30% HP)
      if (hero.hp / hero.maxHp < 0.3 && !isGameOver) {
        drawLowHealthVignette();
      }

      ctx.restore();
    }

    // --- LAVA GLOW: flowing light along the painted cracks (world-lava-mask.png, half res) ---
    // Offscreen canvas covers only the visible world rect at mask resolution; 2 scrolling noise
    // layers are clipped to the crack mask ('destination-in') and added onto the floor ('lighter').
    const LAVA = {
      canvas: document.createElement('canvas'), noise: null, pattern: null,
      frame: 0, every: 2, slowMs: 0, lastNow: 0, avgMs: 16,
      reduced: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    };
    LAVA.ctx = LAVA.canvas.getContext('2d');
    if (LAVA.reduced) LAVA.every = 8;

    const ORB_CANV = document.createElement('canvas'); // arcane orb glow, drawn once (was a new radial gradient per orb per frame)
    ORB_CANV.width = ORB_CANV.height = 64;
    {
      const oc = ORB_CANV.getContext('2d');
      const g = oc.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, '#d8b4fe');
      g.addColorStop(1, 'rgba(168, 85, 247, 0)');
      oc.fillStyle = g;
      oc.beginPath(); oc.arc(32, 32, 32, 0, Math.PI * 2); oc.fill();
    }

    function makeLavaNoise(size) {
      // tileable value noise, 3 octaves, mapped to a hot ramp (black -> ember -> orange -> gold)
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const img = g.createImageData(size, size);
      const field = new Float32Array(size * size);
      for (const [cells, amp] of [[4, 0.55], [8, 0.3], [16, 0.15]]) {
        const grid = new Float32Array(cells * cells).map(() => Math.random());
        const step = size / cells;
        for (let y = 0; y < size; y++) {
          const gy = y / step, y0 = Math.floor(gy), fy = gy - y0, sy = fy * fy * (3 - 2 * fy);
          for (let x = 0; x < size; x++) {
            const gx = x / step, x0 = Math.floor(gx), fx = gx - x0, sx = fx * fx * (3 - 2 * fx);
            const at = (i, j) => grid[((j % cells) * cells) + (i % cells)];
            const top = at(x0, y0) + (at(x0 + 1, y0) - at(x0, y0)) * sx;
            const bot = at(x0, y0 + 1) + (at(x0 + 1, y0 + 1) - at(x0, y0 + 1)) * sx;
            field[y * size + x] += (top + (bot - top) * sy) * amp;
          }
        }
      }
      for (let i = 0; i < field.length; i++) {
        const v = Math.max(0, Math.min(1, (field[i] - 0.38) / 0.4)); // contrast: dark gaps, hot blobs
        const v2 = v * v;
        img.data[i * 4] = 255 * Math.min(1, v * 1.6);
        img.data[i * 4 + 1] = 200 * v2 + 40 * v;
        img.data[i * 4 + 2] = 70 * v2 * v2;
        img.data[i * 4 + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      return c;
    }

    function drawLavaGlow() {
      const mask = SPRITES['lavamask'];
      if (!mask || !mask.complete || !mask.naturalWidth) return;
      if (!LAVA.noise) {
        LAVA.noise = makeLavaNoise(256);
        LAVA.pattern = LAVA.ctx.createPattern(LAVA.noise, 'repeat');
      }
      const now = performance.now();
      // perf fallback: average frame > 22 ms for 2 s -> halve the update rate (once)
      if (LAVA.lastNow) {
        LAVA.avgMs += (Math.min(100, now - LAVA.lastNow) - LAVA.avgMs) * 0.1;
        LAVA.slowMs = LAVA.avgMs > 22 ? LAVA.slowMs + (now - LAVA.lastNow) : 0;
        if (LAVA.slowMs > 2000 && LAVA.every < 4) LAVA.every = 4;
      }
      LAVA.lastNow = now;

      // visible world rect, in mask pixels (mask = world-map at 1/2 scale)
      const sx = mask.naturalWidth / ARENA_W, sy = mask.naturalHeight / ARENA_H;
      const hw = screenW / 2 / CAMERA.zoom + 48, hh = screenH / 2 / CAMERA.zoom + 48;
      const mx0 = Math.max(0, Math.floor((CAMERA.x - hw) * sx));
      const my0 = Math.max(0, Math.floor((CAMERA.y - hh) * sy));
      const mx1 = Math.min(mask.naturalWidth, Math.ceil((CAMERA.x + hw) * sx));
      const my1 = Math.min(mask.naturalHeight, Math.ceil((CAMERA.y + hh) * sy));
      const mw = mx1 - mx0, mh = my1 - my0;
      if (mw <= 0 || mh <= 0) return;

      const c = LAVA.canvas, g = LAVA.ctx;
      if (LAVA.frame++ % LAVA.every === 0 || c.width !== mw || c.height !== mh || c.dataset.key !== mx0 + ',' + my0) {
        if (c.width !== mw || c.height !== mh) { c.width = mw; c.height = mh; }
        c.dataset.key = mx0 + ',' + my0;
        const t = now / 1000;
        g.globalCompositeOperation = 'source-over';
        g.globalAlpha = 1;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, mw, mh);
        // two layers, world-anchored, drifting in different directions -> light travels along cracks
        g.setTransform(1, 0, 0, 1, -mx0 + (t * 23) % 256, -my0 + (t * 9) % 256);
        g.fillStyle = LAVA.pattern;
        g.fillRect(mx0 - 256, my0 - 256, mw + 512, mh + 512);
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 0.7;
        g.setTransform(0.6, 0, 0, 0.6, -mx0 - (t * 14) % 154, -my0 + (t * 19) % 154);
        g.fillRect((mx0 - 256) / 0.6, (my0 - 256) / 0.6, (mw + 512) / 0.6, (mh + 512) / 0.6);
        g.globalAlpha = 1;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.globalCompositeOperation = 'destination-in';
        g.drawImage(mask, mx0, my0, mw, mh, 0, 0, mw, mh);
        g.globalCompositeOperation = 'source-over';
      }
      const pulse = LAVA.reduced ? 0.5 : 0.52 + 0.18 * Math.sin(now / 1000 * (Math.PI * 2 / 3));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = pulse;
      ctx.drawImage(c, mx0 / sx, my0 / sy, mw / sx, mh / sy);
      ctx.restore();
    }

    // --- ARENA DRAWING (Pillar debug drawing removed, collision retained) ---
    function drawArena() {
      const mapImg = SPRITES['worldmap'];
      if (mapImg && mapImg.complete && mapImg.naturalWidth > 0) {
        ctx.drawImage(mapImg, 0, 0, ARENA_W, ARENA_H);
        drawLavaGlow();
      } else {
        ctx.fillStyle = '#181524';
        ctx.fillRect(0, 0, ARENA_W, ARENA_H);

        ctx.beginPath();
        OCTAGON_VERTS.forEach((v, i) => {
          if (i === 0) ctx.moveTo(v.x, v.y);
          else ctx.lineTo(v.x, v.y);
        });
        ctx.closePath();
        ctx.fillStyle = '#252136';
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#1a1a1a';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ARENA_CX, ARENA_CY, 420, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#3a3354';
        ctx.stroke();
      }
    }

    // --- GROUND OBJECTS (DECALS, CHESTS) ---
    function drawGroundObjects() {
      groundDecals.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        const alpha = Math.min(1, d.life / 0.8);
        ctx.globalAlpha = alpha;

        if (d.type === 'crater') {
          // a faint scorch only: the hand-drawn explosion and fire sprites carry the impact (Matin 10-02: the black disc looked bad)
          ctx.globalAlpha = alpha * 0.28;
          ctx.fillStyle = '#2a1a12';
          ctx.beginPath();
          ctx.ellipse(0, 0, d.radius * 0.7, d.radius * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'crack') {
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-d.radius, 0);
          ctx.lineTo(-d.radius * 0.3, -4);
          ctx.lineTo(d.radius * 0.3, 4);
          ctx.lineTo(d.radius, 0);
          ctx.stroke();
        }
        ctx.restore();
      });

      // Chests with bounce
      chests.forEach(ch => {
        ctx.save();
        ctx.translate(ch.x, ch.y);
        const bob = Math.sin(gameTime * 5) * 3;
        const bounceOff = ch.bounceY || 0;

        ctx.fillStyle = 'rgba(10,8,16,0.6)';
        ctx.beginPath();
        ctx.ellipse(0, 8, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        const chestImg = SPRITES['chest'];
        if (chestImg && chestImg.complete && chestImg.naturalWidth > 0) {
          ctx.drawImage(chestImg, -24, -40 + bounceOff + bob, 48, 48);
        } else {
          ctx.fillStyle = '#ffd23f';
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 3.5;
          ctx.fillRect(-18, -20 + bounceOff + bob, 36, 26);
          ctx.strokeRect(-18, -20 + bounceOff + bob, 36, 26);
          ctx.fillStyle = '#b45309';
          ctx.fillRect(-18, -10 + bounceOff + bob, 36, 4);
          ctx.fillStyle = '#ff3366';
          ctx.fillRect(-5, -12 + bounceOff + bob, 10, 10);
          ctx.strokeRect(-5, -12 + bounceOff + bob, 10, 10);
        }
        ctx.restore();
      });
    }

    // --- SOUL GEMS ---
    function drawSoulGems() {
      soulGems.forEach(gem => {
        ctx.save();
        ctx.translate(gem.x, gem.y);

        const isBig = gem.type === 'medium' || gem.type === 'large';
        const pulse = isBig ? (1 + Math.sin(gameTime * 6 + gem.y) * 0.12) : 1;
        const bob = Math.sin(gameTime * 6 + gem.x) * 3;
        const s = gem.size * pulse;

        ctx.fillStyle = 'rgba(10,8,16,0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 4, s * 0.8, s * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.translate(0, -6 + bob);
        // Painted soul gem (Flow art): green small, blue medium, gold large
        const gemImg = SPRITES[gem.type === 'large' ? 'soul-large' : (gem.type === 'medium' ? 'soul-medium' : 'soul-small')];
        if (gemImg && gemImg.complete && gemImg.naturalWidth) {
          const gh = s * 3.4;
          const gw = gh * gemImg.naturalWidth / gemImg.naturalHeight;
          ctx.drawImage(gemImg, -gw / 2, -gh / 2, gw, gh);
          ctx.restore();
          return;
        }
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#1a1a1a';

        ctx.fillStyle = gem.type === 'large' ? '#fde047' : (gem.type === 'medium' ? '#7dd3fc' : '#86efac');
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(-s * 0.8, 0);
        ctx.lineTo(0, s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = gem.color;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.8, 0);
        ctx.lineTo(0, s);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      });
    }

    // --- CHARACTER RENDERING (HERO, ENEMIES, VASES, PICKUPS) ---
    function drawHero(h) {
      ctx.save();
      ctx.translate(h.x, h.y);

      // Dash After-images
      h.ghosts.forEach(g => {
        ctx.save();
        ctx.translate(g.x - h.x, g.y - h.y);
        ctx.scale(g.facing, 1);
        ctx.globalAlpha = g.alpha * 0.55;
        ctx.filter = 'drop-shadow(0 0 6px #6366f1)';
        drawCharacterSprite('hero-idle', 100, 0, 0, false);
        ctx.restore();
      });

      // Shadow
      ctx.fillStyle = 'rgba(10,8,16,0.6)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 28, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Speed lines when boots buff is active
      if (h.speedBuffTimer > 0 && h.isMoving) {
        ctx.save();
        ctx.strokeStyle = 'rgba(124, 255, 107, 0.7)';
        ctx.lineWidth = 2;
        for (let s = 0; s < 4; s++) {
          const offY = (s - 1.5) * 12;
          const len = 30 + Math.random() * 20;
          ctx.beginPath();
          ctx.moveTo(-h.facing * 18, offY - 20);
          ctx.lineTo(-h.facing * (18 + len), offY - 20);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Body: pose from updateHeroPose (walk bob + cast gesture), rotated/squashed around the feet
      const pose = heroPose;
      ctx.save();
      ctx.translate(pose.ox, pose.oy);
      ctx.scale(h.facing, 1);
      ctx.rotate(pose.rot);
      ctx.scale(pose.sx, pose.sy);
      drawCharacterSprite(pose.key, HERO_SPRITE_H, h.walkTimer, 6, h.flashTimer > 0);
      ctx.restore();

      // Staff crystal glow (world space): green pulsing halo while the beam runs, sky beam on meteor call
      if (activeBeam || (h.anim === 'meteor' && h.animT < h.animDur)) {
        const tp = staffTip();
        const tx = tp.x - h.x, ty = tp.y - h.y;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        if (activeBeam) {
          const pulse = 0.75 + 0.25 * Math.sin(gameTime * 30);
          ctx.fillStyle = 'rgba(124,255,107,0.35)';
          ctx.beginPath(); ctx.arc(tx, ty, 13 * pulse, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(220,255,210,0.85)';
          ctx.beginPath(); ctx.arc(tx, ty, 5 * pulse, 0, Math.PI * 2); ctx.fill();
        } else {
          const a = 1 - h.animT / h.animDur;
          ctx.fillStyle = `rgba(255,214,90,${0.55 * a})`;
          ctx.fillRect(tx - 4, ty - 180, 8, 180);
          ctx.fillStyle = `rgba(255,250,220,${0.9 * a})`;
          ctx.fillRect(tx - 1.5, ty - 180, 3, 180);
        }
        ctx.restore();
      }

      ctx.scale(h.facing, 1);

      // 1. Orbiting Gems: 34px tall, cycling colors, spinning, twinkle, 2 ghost copies
      const runesW = h.weapons.find(w => w.id === 'runes');
      if (runesW) {
        const geo = runesGeometry(runesW);
        const rad = geo.rad;
        const gemColors = ['green', 'blue', 'purple', 'red', 'yellow', 'white'];

        for (let i = 0; i < geo.count; i++) {
          const colName = gemColors[i % gemColors.length];
          const gemImg = SPRITES[`gem-${colName}`];
          const ang = runesAngle + (i / geo.count) * Math.PI * 2;

          // Faint short trail of 2 ghost copies
          for (let g = 2; g >= 1; g--) {
            const gAng = ang - g * 0.14;
            const gx = Math.cos(gAng) * rad;
            const gy = -25 + Math.sin(gAng) * rad;

            ctx.save();
            ctx.translate(gx, gy);
            ctx.globalAlpha = 0.35 / g;
            if (gemImg && gemImg.complete && gemImg.naturalWidth > 0) {
              ctx.rotate(gameTime * 2.2 + i);
              ctx.drawImage(gemImg, -14, -14, 28, 28);
            }
            ctx.restore();
          }

          // Main orbiting gem (34px tall, slowly spinning, with small white twinkle)
          const rx = Math.cos(ang) * rad;
          const ry = -25 + Math.sin(ang) * rad;

          ctx.save();
          ctx.translate(rx, ry);
          ctx.rotate(gameTime * 2.2 + i);
          if (gemFlash[i] > 0) {
            gemFlash[i]--; // tiny 2-frame white flash on hit
            ctx.filter = 'brightness(10) contrast(2)';
          }

          if (gemImg && gemImg.complete && gemImg.naturalWidth > 0) {
            ctx.drawImage(gemImg, -17, -17, 34, 34);
          } else {
            ctx.fillStyle = colName;
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -17);
            ctx.lineTo(14, 0);
