<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sorceress vs the Idiots</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d0c13;
      overflow: hidden;
      font-family: 'Trebuchet MS', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 8, 16, 0.84);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 50;
      padding: 16px;
    }
    .modal-card-container {
      display: flex;
      flex-direction: row;
      gap: 14px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    @keyframes cardPopIn {
      0% {
        transform: scale(0.55) translateY(44px);
        opacity: 0;
      }
      70% {
        transform: scale(1.08) translateY(-6px);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }
    .upgrade-card {
      background: #1f1b2e;
      border: 3.5px solid #1a1a1a;
      box-shadow: 0 8px 0 #120f1a, 0 14px 24px rgba(0,0,0,0.65);
      border-radius: 12px;
      padding: 16px 14px;
      width: 250px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      overflow: hidden;
      animation: cardPopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .upgrade-card:nth-child(1) { animation-delay: 0.04s; }
    .upgrade-card:nth-child(2) { animation-delay: 0.12s; }
    .upgrade-card:nth-child(3) { animation-delay: 0.20s; }
    .upgrade-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -130%;
      width: 60%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: rotate(25deg);
      pointer-events: none;
      transition: none;
    }
    .upgrade-card:hover::after {
      left: 170%;
      transition: left 0.55s ease-in-out;
    }
    .upgrade-card:hover {
      transform: translateY(-8px) scale(1.03);
    }
    .upgrade-card:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 0 #120f1a;
    }
    .card-badge {
      position: absolute;
      top: -10px;
      right: 12px;
      background: #ff3366;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 2px solid #1a1a1a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 0 #1a1a1a;
    }
    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      border: 3px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
      background: #2f2847;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.15);
    }
    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      text-shadow: 1px 1px 0 #1a1a1a;
    }
    .card-level {
      font-size: 12px;
      font-weight: 700;
      color: #ffd23f;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13px;
      line-height: 1.35;
      color: #cbd5e1;
    }
    .end-modal-content {
      background: #1e192c;
      border: 4px solid #1a1a1a;
      box-shadow: 0 10px 0 #100d18, 0 20px 40px rgba(0,0,0,0.8);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .end-title {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #1a1a1a;
    }
    .end-title.victory { color: #ffd23f; }
    .end-title.defeat { color: #ff3366; }
    .end-stats {
      font-size: 15px;
      color: #e2e8f0;
      margin: 18px 0;
      line-height: 1.8;
      background: #14111e;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #1a1a1a;
    }
    .end-btn {
      background: #ff5e36;
      border: 3px solid #1a1a1a;
      box-shadow: 0 5px 0 #100d18;
      border-radius: 10px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      padding: 12px 28px;
      cursor: pointer;
      transition: transform 0.1s ease;
      display: inline-block;
      margin-top: 10px;
    }
    .end-btn:hover { background: #ff7654; }
    .end-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #100d18; }
    .credits {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 16px;
      direction: rtl;
    }
    #dash-btn {
      position: absolute;
      right: 22px;
      bottom: 24px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #6366f1;
      border: 3.5px solid #1a1a1a;
      box-shadow: 0 6px 0 #1f1b3e, 0 10px 18px rgba(0,0,0,0.5);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }
    #dash-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #1f1b3e;
    }
    #dash-cooldown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(10, 8, 16, 0.65);
      clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%);
      pointer-events: none;
    }
    .dash-pips {
      display: flex;
      flex-direction: row;
      gap: 5px;
      margin-top: 2px;
    }
    .dash-pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffd23f;
      border: 1.5px solid #1a1a1a;
      box-shadow: 0 0 4px #ffd23f;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .dash-pip.empty {
      background: #334155;
      box-shadow: none;
      opacity: 0.5;
    }

    /* --- PAINTED UI SKIN (sprites/ui/*.png, cut by slice_ui.py) --- */
    :root {
      --parchment: #f3e2b8;
      --ink-outline: 0 0 2px #000, 1px 1px 0 #140f0c, -1px -1px 0 #140f0c, 1px -1px 0 #140f0c, -1px 1px 0 #140f0c;
    }
    #modal-heading, #modal-subheading, .card-title, .card-desc, .end-stats, .end-btn {
      text-shadow: var(--ink-outline);
    }
    #modal-subheading, .card-desc { color: var(--parchment) !important; }
    .modal-banner {
      text-align: center;
      padding: 14px 34px 12px;
      margin-bottom: 14px;
      border: 22px solid transparent;
      border-image: url('sprites/ui/panel.png') 80 70 60 70 fill / 22px stretch;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
    }
    .modal-banner #modal-heading { margin: 0 0 2px !important; }
    .modal-banner #modal-subheading { margin: 0 !important; }

    .upgrade-card {
      --cw: 220px; /* padding is in card widths: % padding would follow the container */
      width: var(--cw);
      aspect-ratio: 628 / 900;
      padding: calc(var(--cw) * 0.21) calc(var(--cw) * 0.19) calc(var(--cw) * 0.19);
      background: url('sprites/ui/card-normal.png') center / 100% 100% no-repeat;
      border: none;
      border-radius: 0;
      box-shadow: none !important;
      overflow: clip; /* clips the shine but still lets content grow the card */
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.7));
      transition: translate 0.15s ease, scale 0.15s ease, filter 0.15s ease;
    }
    .upgrade-card.card-evolve { background-image: url('sprites/ui/card-evolve.png'); padding-top: calc(var(--cw) * 0.26); }
    .upgrade-card.card-relic { background-image: url('sprites/ui/card-relic.png'); padding-top: calc(var(--cw) * 0.24); }
    .upgrade-card::after { top: 8%; height: 84%; width: 30%; }
    /* Hover: frame stays, runes light up (glow colour per frame) */
    .upgrade-card { --glow-a: #ff4fd8; --glow-b: #b84dff; }
    .upgrade-card.card-evolve { --glow-a: #ffd23f; --glow-b: #ff9d2e; }
    .upgrade-card.card-relic { --glow-a: #4dff9a; --glow-b: #1fbf6a; }
    @keyframes runeGlow {
      0%, 100% { filter: brightness(1.12) drop-shadow(0 0 5px var(--glow-a)) drop-shadow(0 0 12px var(--glow-b)); }
      50% { filter: brightness(1.25) drop-shadow(0 0 8px var(--glow-a)) drop-shadow(0 0 20px var(--glow-b)); }
    }
    .upgrade-card:hover {
      /* individual transform props: cardPopIn's fill-mode holds `transform`, these compose on top */
      translate: 0 -6px;
      scale: 1.04;
      animation: cardPopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both, runeGlow 1.2s ease-in-out infinite;
    }
    .upgrade-card:active { translate: 0 2px; scale: 0.98; }
    .card-badge { top: 4px; right: 14%; z-index: 1; }
    .card-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 8px;
      border: 2px solid #8a6d3b;
      background: rgba(20, 14, 24, 0.7);
      flex-shrink: 0;
    }
    .card-title { font-size: 15px; color: var(--parchment); }
    .card-level { font-size: 11px; margin-bottom: 6px; text-shadow: var(--ink-outline); }
    .card-desc { font-size: 12px; }
    .upgrade-card button {
      background: url('sprites/ui/button.png') center / 100% 100% no-repeat !important;
      border: none !important;
      padding: 8px 10px !important;
      text-shadow: var(--ink-outline);
    }
    .upgrade-card button:hover { filter: brightness(1.2); }

    .end-modal-content {
      background: none;
      border: 26px solid transparent;
      border-image: url('sprites/ui/panel.png') 80 70 60 70 fill / 26px stretch;
      border-radius: 0;
      box-shadow: none;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.8));
      padding: 8px 10px 4px;
    }
    .end-stats { background: rgba(10, 8, 14, 0.45); border-color: #6b5530; color: var(--parchment); }
    .end-btn {
      background: url('sprites/ui/button.png') center / 100% 100% no-repeat;
      border: none;
      border-radius: 0;
      box-shadow: none;
      color: var(--parchment);
      min-width: 190px;
      padding: 16px 30px;
      filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.6));
    }
    .end-btn:hover { background-color: transparent; filter: brightness(1.15) drop-shadow(0 5px 6px rgba(0, 0, 0, 0.6)); }
    .end-btn:active { box-shadow: none; }

    #dash-btn {
      width: 88px;
      height: 88px;
      background: url('sprites/ui/dash-button.png') center / contain no-repeat;
      border: none;
      box-shadow: none;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.6));
    }
    #dash-btn:active { box-shadow: none; filter: brightness(1.2) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.6)); }
    #dash-btn > span:first-of-type { display: none; } /* the boot rune is the label */
    #dash-btn > span:nth-of-type(2) {
      position: absolute;
      bottom: -12px;
      color: var(--parchment);
      text-shadow: var(--ink-outline);
    }
    #dash-cooldown-overlay { top: 7%; left: 7%; width: 86%; height: 86%; }
    .dash-pips { position: absolute; bottom: 8px; }

    /* --- ICON BUTTONS, PAUSE MENU, MAIN MENU --- */
    .icon-btn {
      display: block;
      width: 48px;
      height: 48px;
      border: none;
      background: transparent center / contain no-repeat;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.6));
      transition: scale 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover, .pause-action:hover .icon-btn { scale: 1.08; filter: brightness(1.15) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6)); }
    .icon-btn:active, .pause-action:active .icon-btn { scale: 0.94; }
    .btn-pause { background-image: url('sprites/ui/btn-pause.png'); }
    .btn-play { background-image: url('sprites/ui/btn-play.png'); }
    .btn-restart { background-image: url('sprites/ui/btn-restart.png'); }
    .btn-home { background-image: url('sprites/ui/btn-home.png'); }
    .sound-toggle { background-image: url('sprites/ui/btn-sound-on.png'); }
    .sound-toggle.muted { background-image: url('sprites/ui/btn-sound-off.png'); }
    #pause-btn { position: absolute; width: 40px; height: 40px; z-index: 10; }

    #pause-modal { z-index: 60; }
    .pause-panel {
      width: min(92vw, 440px);
      text-align: center;
      border: 26px solid transparent;
      border-image: url('sprites/ui/panel.png') 80 70 60 70 fill / 26px stretch;
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.8));
      padding: 6px 4px 8px;
    }
    .pause-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffd23f;
      text-shadow: var(--ink-outline), 0 0 18px rgba(255, 79, 216, 0.55);
      margin-bottom: 14px;
    }
    .pause-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .pause-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 72px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--parchment);
      font: 800 12px 'Trebuchet MS', sans-serif;
      text-shadow: var(--ink-outline);
    }
    .pause-action .icon-btn { width: 60px; height: 60px; }

    #main-menu {
      position: absolute;
      inset: 0;
      z-index: 100;
      pointer-events: auto;
      overflow: hidden;
      background: #0d0c13;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 16px max(36px, env(safe-area-inset-bottom));
      transition: opacity 0.45s ease;
    }
    #main-menu.hidden { opacity: 0; pointer-events: none; }
    .menu-bg {
      position: absolute;
      inset: -4%;
      background: url('sprites/ui/title-bg.jpg?v=4') 50% 55% / cover no-repeat;
      animation: menuDrift 26s ease-in-out infinite alternate;
    }
    .menu-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 58%, transparent 38%, rgba(5, 4, 10, 0.85) 100%),
        linear-gradient(to bottom, rgba(5, 4, 10, 0.25), transparent 30%, transparent 65%, rgba(5, 4, 10, 0.85));
    }
    @keyframes menuDrift {
      from { transform: scale(1) translate(0, 0); }
      to { transform: scale(1.08) translate(-1.5%, 1%); }
    }
    .menu-logo {
      position: relative;
      width: min(90vw, 620px);
      max-height: 34vh;
      object-fit: contain;
      animation: logoBob 3.2s ease-in-out infinite, logoGlow 2.6s ease-in-out infinite;
    }
    @keyframes logoBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 6px rgba(255, 79, 216, 0.25)); }
      50% { filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 22px rgba(255, 79, 216, 0.6)); }
    }
    .menu-play {
      position: relative;
      width: min(72vw, 300px);
      aspect-ratio: 900 / 268;
      border: none;
      background: url('sprites/ui/button.png') center / 100% 100% no-repeat;
      color: var(--parchment);
      font: 900 32px 'Trebuchet MS', sans-serif;
      letter-spacing: 4px;
      text-shadow: var(--ink-outline), 0 0 14px rgba(255, 210, 63, 0.6);
      cursor: pointer;
      animation: playPulse 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-play:hover { filter: brightness(1.15); }
    .menu-play:active { scale: 0.95; }
    @keyframes playPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 16px rgba(255, 210, 63, 0.55)); }
    }
    .menu-lb { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; bottom: calc(max(36px, env(safe-area-inset-bottom)) + min(72vw, 300px) * 0.298 + 18px);
      background: rgba(20, 16, 28, 0.85); color: #ffd23f; border: 3px solid #ffd23f; border-radius: 999px; padding: 9px 20px; box-shadow: 0 4px 0 #000;
      font: 800 15px 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; letter-spacing: 1.5px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .menu-lb:active { scale: 0.95; }
    .menu-sound { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; }

    @media (max-width: 520px) {
      .modal-overlay { padding: 10px; }
      .modal-card-container { gap: 8px; }
      .upgrade-card { --cw: 160px; }
      .card-icon { width: 40px; height: 40px; margin-bottom: 4px; }
      .card-title { font-size: 13px; margin-bottom: 2px; }
      .card-level { font-size: 10px; margin-bottom: 3px; }
      .card-desc { font-size: 11px; line-height: 1.25; }
      .card-badge { font-size: 9px; padding: 2px 5px; }
      .upgrade-card button { padding: 5px 6px !important; margin-top: 3px !important; }
      .upgrade-card button div { font-size: 10px !important; }
      .modal-banner { padding: 8px 18px 6px; border-width: 16px; border-image-width: 16px; }
      #modal-heading { font-size: 21px !important; }
      #dash-btn { width: 80px; height: 80px; }
      #main-menu { padding-top: max(64px, env(safe-area-inset-top)); } /* clear the sound toggle */
      .pause-actions { gap: 6px; }
      .pause-action { width: 64px; }
      .pause-action .icon-btn { width: 52px; height: 52px; }
    }
      #loading-screen { position: fixed; inset: 0; z-index: 9000; background: #0d0c13; transition: opacity 0.5s ease; }
    #loading-screen.done { opacity: 0; pointer-events: none; }
    #loading-screen .load-bg { position: absolute; inset: 0; background: url('sprites/ui/loading-bg.jpg?v=2') center 40% / cover no-repeat;
      animation: loadDrift 14s ease-in-out infinite alternate; }
    @keyframes loadDrift { from { transform: scale(1.02); } to { transform: scale(1.08) translateY(-1%); } }
    #loading-screen .load-box { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(520px, 80vw); text-align: center; }
    #loading-screen .load-bar { height: 16px; border: 3px solid #1a1a1a; border-radius: 10px; background: rgba(20, 12, 30, 0.85);
      box-shadow: 0 0 0 2px #b8893a, 0 4px 14px rgba(0,0,0,0.6); overflow: hidden; }
    #loading-screen .load-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b2fc9, #e879f9, #ffd23f);
      box-shadow: 0 0 12px #e879f9; transition: width 0.2s ease; }
    #loading-screen .load-text { margin-top: 10px; color: #f3e6c4; font: 700 15px/1.2 'Trebuchet MS', sans-serif;
      text-shadow: 0 2px 0 #1a1a1a, 0 0 8px #000; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-layer">
    <div id="dash-btn">
      <div id="dash-cooldown-overlay" style="display:none;"></div>
      <span>DASH</span>
      <span style="font-size: 9px; opacity: 0.8; margin-top: 1px;">SPACE</span>
      <div id="dash-pips" class="dash-pips" style="display:none;">
        <div id="dash-pip-1" class="dash-pip"></div>
        <div id="dash-pip-2" class="dash-pip"></div>
      </div>
    </div>

    <!-- Level-up / Relic Modal -->
    <div id="level-modal" class="modal-overlay">
      <div class="modal-banner">
      <h2 id="modal-heading" style="font-size: 26px; font-weight: 900; margin-bottom: 6px; color: #ffd23f; text-shadow: 2px 2px 0 #1a1a1a;">LEVEL UP!</h2>
      <p id="modal-subheading" style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px;">Choose your arcana power</p>
      </div>
      <div id="cards-container" class="modal-card-container"></div>
    </div>

    <!-- End Game Modal -->
    <div id="end-modal" class="modal-overlay">
      <div class="end-modal-content">
        <div id="end-title" class="end-title">VICTORY</div>
        <div id="end-stats" class="end-stats"></div>

  <script>
/**
 * Leaderboard Client for "Sorceress vs the Idiots"
 * Comic Pop aesthetic (#14101c dark purple, #ffd23f bright yellow).
 * Handles run submission, offline retries, menu viewer, and Instagram Story result card.
 */
(function (root) {
  'use strict';

  var API_BASE = "https://sorceress-leaderboard.ek-relay.workers.dev"; // Updated via config
  var STORAGE_KEY_HANDLE = "svti_lb_handle";
  var STORAGE_KEY_NAME = "svti_lb_player_name";
  var STORAGE_KEY_RETRY = "svti_lb_retry_queue";

  var LB = {
    config: {
      apiBase: API_BASE,
      gameVersion: "1.0.0",
      instagramHost: "matin.nazifii"
    },

    init: function (options) {
      if (options) {
        if (options.apiBase) this.config.apiBase = options.apiBase;
        if (options.gameVersion) this.config.gameVersion = options.gameVersion;
      }
      this._injectStyles();
      this._processPendingRetry();
    },

    getSavedHandle: function () {
      try {
        return localStorage.getItem(STORAGE_KEY_HANDLE) || "";
      } catch (e) {
        return "";
      }
    },

    setSavedHandle: function (handle) {
      try {
        if (handle) {
          localStorage.setItem(STORAGE_KEY_HANDLE, handle.replace(/^@/, "").trim());
        }
      } catch (e) {}
    },

    getSavedName: function () {
      try {
        return localStorage.getItem(STORAGE_KEY_NAME) || "Sorceress";
      } catch (e) {
        return "Sorceress";
      }
    },

    setSavedName: function (name) {
      try {
        if (name) localStorage.setItem(STORAGE_KEY_NAME, name.trim());
      } catch (e) {}
    },

    generateRunId: function () {
      return 'run_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    },

    /**
     * Submit a run when game ends (death or victory). Never crashes game on failure.
     */
    submit: function (runData, callback) {
      var self = this;
      var payload = {
        run_id: runData.run_id || self.generateRunId(),
        player_name: runData.player_name || self.getSavedName(),
        handle: runData.handle || self.getSavedHandle() || null,
        kills: runData.kills || 0,
        survival_time: runData.survival_time || 0,
        level: runData.level || 1,
        won: !!runData.won,
        game_version: self.config.gameVersion
      };

      fetch(self.config.apiBase + "/score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (callback) callback(null, data);
      })
      .catch(function (err) {
        // Queue single offline retry
        self._queueRetry(payload);
        if (callback) callback(err, null);
      });
    },

    top: function (board, callback) {
      var boardType = board || "kills";
      fetch(this.config.apiBase + "/top?board=" + encodeURIComponent(boardType) + "&limit=50")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (json) {
          callback(null, json.data || []);
        })
        .catch(function (err) {
          callback(err, []);
        });
    },

    /**
     * Open Leaderboard Modal Screen (from Main Menu)
     */
    openScreen: function () {
      var self = this;
      var existing = document.getElementById("svti-lb-modal");
      if (existing) existing.remove();

      var modal = document.createElement("div");
      modal.id = "svti-lb-modal";
      modal.className = "svti-lb-overlay";
      modal.innerHTML = [
        '<div class="svti-lb-container">',
        '  <div class="svti-lb-header">',
        '    <h2 class="svti-lb-title">HALL OF VALOR</h2>',
        '    <button class="svti-lb-close" id="svti-lb-btn-close">&times;</button>',
        '  </div>',
        '  <div class="svti-lb-tabs">',
        '    <button class="svti-lb-tab active" data-board="kills">MOST KILLS</button>',
        '    <button class="svti-lb-tab" data-board="fastwin">FASTEST WIN</button>',
        '    <button class="svti-lb-tab" data-board="week">THIS WEEK</button>',
        '  </div>',
        '  <div class="svti-lb-list-wrap">',

        '    <table class="svti-lb-table" id="svti-lb-table" style="display:none;">',
        '      <thead>',
        '        <tr><th>#</th><th>HERO</th><th>KILLS</th><th>TIME</th><th>LVL</th></tr>',
        '      </thead>',
        '      <tbody id="svti-lb-tbody"></tbody>',
        '    </table>',
        '  </div>',
        '  <div class="svti-lb-footer">',
        '    Follow @' + self.config.instagramHost + '!',
        '  </div>',
        '</div>'
      ].join('\n');

      document.body.appendChild(modal);

      document.getElementById("svti-lb-btn-close").onclick = function () {
        modal.remove();
      };

      var tabs = modal.querySelectorAll(".svti-lb-tab");
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].onclick = function () {
          for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
          this.classList.add("active");
          self._renderBoard(this.getAttribute("data-board"));
        };
      }

      this._renderBoard("kills");
    },

    /**
     * Show End-of-Run Result Card ready for Instagram Story screenshot.
     */
    showResultCard: function (runData, onDone) {
      var self = this;
      var existing = document.getElementById("svti-card-modal");
      if (existing) existing.remove();

      var timeStr = self._formatTime(runData.survival_time || 0);
      var savedHandle = self.getSavedHandle();
      var isWon = !!runData.won;

      var modal = document.createElement("div");
      modal.id = "svti-card-modal";
      modal.className = "svti-lb-overlay";
      modal.innerHTML = [
        '<div class="svti-card-box">',
        '  <div class="svti-card-badge ' + (isWon ? 'won' : 'died') + '">' + (isWon ? 'VICTORY!' : 'SLAIN IN BATTLE') + '</div>',
        '  <div class="svti-card-title">SORCERESS VS THE IDIOTS</div>',

        '  <div class="svti-card-stats-grid">',
        '    <div class="stat-item"><span class="lbl">KILLS</span><span class="val highlight">' + (runData.kills || 0) + '</span></div>',
        '    <div class="stat-item"><span class="lbl">SURVIVED</span><span class="val">' + timeStr + '</span></div>',
        '    <div class="stat-item"><span class="lbl">LEVEL</span><span class="val">' + (runData.level || 1) + '</span></div>',
        '  </div>',
        '  <div class="svti-card-input-row">',
        '    <label>Your Instagram handle (optional):</label>',
        '    <div class="input-wrap">',
        '      <span class="at">@</span>',
        '      <input type="text" id="svti-inp-handle" placeholder="your_handle" value="' + savedHandle + '" maxlength="30" />',
        '    </div>',
        '  </div>',
        '  <div class="svti-card-actions">',
        '    <button class="svti-btn-sub" id="svti-btn-submit-score">SUBMIT & SAVE</button>',
        '    <button class="svti-btn-skip" id="svti-btn-skip">CONTINUE</button>',
        '  </div>',
        '  <div class="svti-card-story-hint">',
        '    &#128248; Screenshot this & tag <strong>@' + self.config.instagramHost + '</strong> on your story!',
        '  </div>',
        '</div>'
      ].join('\n');

      document.body.appendChild(modal);

      var submitted = false;
      var handleInp = document.getElementById("svti-inp-handle");
      var submitBtn = document.getElementById("svti-btn-submit-score");
      var skipBtn = document.getElementById("svti-btn-skip");

      submitBtn.onclick = function () {
        if (submitted) return;
        var handleVal = handleInp.value.trim().replace(/^@/, "");
        self.setSavedHandle(handleVal);
        runData.handle = handleVal;
        submitBtn.innerText = "SUBMITTING...";
        submitBtn.disabled = true;

        self.submit(runData, function (err, res) {
          submitted = true;
          if (err) {
            submitBtn.innerText = "SAVED OFFLINE &#10003;";
          } else {
            submitBtn.innerText = "SUBMITTED &#10003;";
          }
          setTimeout(function () {
            modal.remove();
            if (onDone) onDone();
          }, 900);
        });
      };

      skipBtn.onclick = function () {
        if (!submitted) {
          // Silent anonymous submit
          runData.handle = null;
          self.submit(runData);
        }
        modal.remove();
        if (onDone) onDone();
      };
    },

    _renderBoard: function (board) {
      var self = this;
      var loading = document.getElementById("svti-lb-loading");
      var table = document.getElementById("svti-lb-table");
      var tbody = document.getElementById("svti-lb-tbody");

      loading.style.display = "block";
      loading.innerText = "SUMMONING HEROES...";
      table.style.display = "none";
      tbody.innerHTML = "";

      this.top(board, function (err, items) {
        loading.style.display = "none";
        if (err || !items || items.length === 0) {
          loading.style.display = "block";
          loading.innerText = err ? "COULD NOT CONNECT TO LEADERBOARD" : "NO SCORES REGISTERED YET. BE THE FIRST!";
          return;
        }

        table.style.display = "table";
        var rows = [];
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var rank = i + 1;
          var rankBadge = rank === 1 ? '&#129351;' : (rank === 2 ? '&#129352;' : (rank === 3 ? '&#129353;' : rank));
          var displayName = item.handle ? ('@' + item.handle) : (item.player_name || 'Anonymous');
          var timeStr = self._formatTime(item.survival_time);

          rows.push([
            '<tr class="' + (rank <= 3 ? 'top-rank' : '') + '">',
            '  <td class="r-col">' + rankBadge + '</td>',
            '  <td class="name-col">' + self._escapeHtml(displayName) + (item.won ? ' &#11088;' : '') + '</td>',
            '  <td class="kills-col">' + item.kills + '</td>',
            '  <td class="time-col">' + timeStr + '</td>',
            '  <td class="lvl-col">' + item.level + '</td>',
            '</tr>'
          ].join(''));
        }
        tbody.innerHTML = rows.join('\n');
      });
    },

    _formatTime: function (secs) {
      var total = Math.floor(secs || 0);
      var m = Math.floor(total / 60);
      var s = total % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    },

    _escapeHtml: function (str) {
      return String(str).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    },

    _queueRetry: function (payload) {
      try {
        localStorage.setItem(STORAGE_KEY_RETRY, JSON.stringify(payload));
      } catch (e) {}
    },

    _processPendingRetry: function () {
      var self = this;
      try {
        var raw = localStorage.getItem(STORAGE_KEY_RETRY);
        if (!raw) return;
        var pending = JSON.parse(raw);
        localStorage.removeItem(STORAGE_KEY_RETRY);
        self.submit(pending);
      } catch (e) {}
    },

    _injectStyles: function () {
      if (document.getElementById("svti-lb-styles")) return;
      var css = [
        '.svti-lb-overlay { position: fixed; inset: 0; background: rgba(20, 16, 28, 0.88); z-index: 999999; display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif; font-weight: 700; -webkit-font-smoothing: antialiased; padding: 12px; box-sizing: border-box; }',
        '.svti-lb-container, .svti-card-box { background: #1c152b; border: 4px solid #ffd23f; border-radius: 12px; box-shadow: 0 10px 0 #000, 0 0 25px rgba(255, 210, 63, 0.3); color: #fff; width: 100%; max-width: 440px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }',

        '.svti-lb-list-wrap { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 240px; }',
        '.svti-lb-table { width: 100%; border-collapse: collapse; font-size: 16px; }',
        '.svti-lb-table th { text-align: left; padding: 8px 6px; color: #ffd23f; border-bottom: 2px solid #3b2c59; font-size: 13px; }',
        '.svti-lb-table td { padding: 8px 6px; border-bottom: 1px solid #281e3d; }',
        '.svti-lb-table tr.top-rank td { color: #ffd23f; font-weight: bold; }',

        // Result Card Specific Styles

      var styleTag = document.createElement("style");
      styleTag.id = "svti-lb-styles";

      document.head.appendChild(styleTag);
    }
  };

  root.SVTI_Leaderboard = LB;
})(typeof window !== 'undefined' ? window : this);

  (() => {

    // walkable top of the raised platform, inside the low rim (measured on the 2048 map)
    const OCTAGON_VERTS = [
      { x: 810, y: 590 },

      { x: 1595, y: 800 },

    function pointInOctagon(px, py) {
      let inside = false;
      for (let i = 0, j = OCTAGON_VERTS.length - 1; i < OCTAGON_VERTS.length; j = i++) {
        const xi = OCTAGON_VERTS[i].x, yi = OCTAGON_VERTS[i].y;
        const xj = OCTAGON_VERTS[j].x, yj = OCTAGON_VERTS[j].y;
        const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;

      return inside;

    function clampToOctagon(pos, radius = 24) {

        const dy = p2.y - p1.y;

        const ny = dx / len;
        const toPtX = pos.x - p1.x;
        const toPtY = pos.y - p1.y;
        const dist = toPtX * nx + toPtY * ny;

          pos.y += ny * push;

    const LOAD = { total: Object.keys(SPRITE_URLS).length, done: 0, shownAt: performance.now(), MIN_MS: 1400 };

    let activeVfxCount = 0;
    const vfxPool = [];
    for (let i = 0; i < VFX_POOL_SIZE; i++) {
      vfxPool.push({
        active: false,
        name: '',
        x: 0,
        y: 0,
        scale: 1,
        scaleEnd: null,
        fps: 30,
        rot: 0,
        flip: false,
        loop: false,
        life: 0,
        maxLife: 0,
        elapsed: 0,
        startFrame: 0,
        tint: null

    function playVFX(name, x, y, options = {}) {
      if (name === 'spark' && activeVfxCount >= 150) return null;

      let inst = null;
      for (let i = 0; i < VFX_POOL_SIZE; i++) {
        if (!vfxPool[i].active) {
          inst = vfxPool[i];
          break;
        }
      }

      if (!inst) {
        if (name === 'spark') return null;
        for (let i = 0; i < VFX_POOL_SIZE; i++) {
          if (vfxPool[i].active && vfxPool[i].name === 'spark') {
            inst = vfxPool[i];
            break;
          }
        }
        if (!inst) inst = vfxPool[0];
      } else {
        activeVfxCount++;
      }

      const fps = options.fps || 30;
      const startFrame = options.startFrame !== undefined ? options.startFrame : 0;
      inst.active = true;
      inst.name = name;
      inst.x = x;
      inst.y = y;
      inst.scale = options.scale !== undefined ? options.scale : 1;
      inst.scaleEnd = options.scaleEnd !== undefined ? options.scaleEnd : null;
      inst.fps = fps;
      inst.rot = options.rot || 0;
      inst.flip = !!options.flip;
      inst.loop = !!options.loop;
      inst.life = options.life !== undefined ? options.life : (options.loop ? 999999 : (6 / fps));
      inst.maxLife = inst.life;
      inst.elapsed = startFrame / fps;
      inst.startFrame = startFrame;
      inst.tint = options.tint || null;
      return inst;
    }

    function updateVFX(dt) {
      for (let i = 0; i < VFX_POOL_SIZE; i++) {
        const v = vfxPool[i];
        if (!v.active) continue;

        v.elapsed += dt;
        if (v.life > 0) {
          v.life -= dt;
          if (v.life <= 0) {
            v.active = false;
            activeVfxCount--;
            continue;
          }
        }

        if (!v.loop) {
          const totalDur = 6 / v.fps;
          if (v.elapsed >= totalDur) {
            v.active = false;
            activeVfxCount--;
          }
        }
      }
    }

    function drawVFXInstance(v) {
      const img = SPRITES['vfx-' + v.name] || SPRITES[v.name];
      if (!img || !img.complete || !img.naturalWidth) return;

      const frameWidth = img.naturalWidth / 6;
      const frameHeight = img.naturalHeight;

      let f = 0;
      if (v.loop) {
        f = Math.floor(v.elapsed * v.fps) % 6;
      } else {
        f = Math.min(5, Math.floor(v.elapsed * v.fps));
      }

      const sx = f * frameWidth;
      const sy = 0;
      // Outward ripple: scale = start + (end - start) * progress
      const scale = v.scaleEnd === null ? v.scale : v.scale + (v.scaleEnd - v.scale) * Math.min(1, v.elapsed * v.fps / 6);
      const dw = 256 * scale;
      const dh = 256 * scale;

      ctx.save();
      ctx.translate(v.x, v.y);

      if ((v.name === 'fire' || v.name === 'firetrail') && v.life < 0.6) {

      if (v.rot) ctx.rotate(v.rot);

      } else if (v.tint === 'gold') {

      }

      ctx.drawImage(img, sx, sy, frameWidth, frameHeight, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();

    // --- AUDIO: Flow Music samples (sfx) + streamed music with crossfade ---

      zap: [0.7, 0.14, 0.08], fire: [0.7, 0.6, 0.06], meteor: [1, 0.15, 0.04], vase: [1, 0.06, 0.06],
      chain: [0.9, 0.18, 0.05], beam: [0.9, 0.4, 0.03], frog: [1, 0.15, 0.06], potion: [1, 0, 0],
      dash: [1, 0.1, 0.04], gem: [0.7, 0.07, 0.06], levelup: [1, 0.3, 0], evolve: [1, 0.5, 0],

        sfxBus.gain.value = MUSIC_VOL * 0.5; // SFX sit at half the music level (Matin 2026-10-06)

              .then(buf => { (sfxBuffers[n] = sfxBuffers[n] || []).push(buf); })
              .catch(e => console.warn('sfx failed', n, e));

    window.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume(); });
    // phones unlock audio only on touchend/click: keep (re)starting the music element on each gesture until it is actually playing
    const musicKick = () => {
      if (!audioCtx) { initAudio(); return; }
      if (isMuted) return;

    };
    ['touchend', 'click', 'pointerup', 'keydown'].forEach(ev => window.addEventListener(ev, musicKick, { passive: true }));

    function makeTrack(srcs) {
      // Plays its sources one after another forever; volume through a GainNode (iOS ignores el.volume)
      const el = new Audio();
      el.preload = 'auto';
      let i = Math.floor(Math.random() * srcs.length);
      el.src = srcs[i];
      el.addEventListener('ended', () => { i = (i + 1) % srcs.length; el.src = srcs[i]; el.play().catch(() => {}); });
      const g = audioCtx.createGain();
      g.gain.value = 0;
      audioCtx.createMediaElementSource(el).connect(g);
      g.connect(audioCtx.destination);
      return { el, g };
    }

    // Dungeon music moves through the run in phases (same key and instruments, rising tempo); the boss tracks still take over on a boss.
    // Each phase alternates two variants; a phase's files only load ~20 s before it starts.
    const MUSIC_PHASES = [
      { from: 0,   srcs: ['audio/music-dungeon-a.m4a', 'audio/music-dungeon-b.m4a'] },  // calm, eerie
      { from: 150, srcs: ['audio/music-explore-a.m4a', 'audio/music-explore-b.m4a'] },  // stirring, curious
      { from: 300, srcs: ['audio/music-tense-a.m4a', 'audio/music-tense-b.m4a'] },      // walls closing in
      { from: 450, srcs: ['audio/music-laststand-a.m4a', 'audio/music-laststand-b.m4a'] } // last stand
    ];
    let musicPhase = 0;
    function musicPhaseAt(t) { let p = 0; for (let i = 0; i < MUSIC_PHASES.length; i++) if (t >= MUSIC_PHASES[i].from) p = i; return p; }

    function initMusic() {
      musicPhase = 0;
      music.p = [makeTrack(MUSIC_PHASES[0].srcs)];

    function setPhaseMusic(i) {

      const t = audioCtx.currentTime, prev = music.p[musicPhase];
      if (!music.p[i]) music.p[i] = makeTrack(MUSIC_PHASES[i].srcs);

      musicPhase = i;
      music.a = next;
      next.el.play().catch(() => {});
      next.g.gain.setTargetAtTime(music.boss ? MUSIC_VOL * 0.12 : MUSIC_VOL, t, 1.8); // crossfade into the new phase
      prev.g.gain.setTargetAtTime(0, t, 1.5);
      setTimeout(() => { if (prev !== music.a) prev.el.pause(); }, 8000);

    function setBossMusic(on) {
      if (!audioCtx || !music.a || music.boss === on) return;
      music.boss = on;
      const t = audioCtx.currentTime;
      const to = on ? music.b : music.a;
      const from = on ? music.a : music.b;
      to.el.play().catch(() => {});

    function playSample(name, volMul = 1) {
      const vars = sfxBuffers[name];
      if (!audioCtx || !vars || !vars.length) return;
      const [vol, gap, jitter] = SFX_MIX[name];
      const now = audioCtx.currentTime;
      if (gap && sfxLast[name] && now - sfxLast[name] < gap) return;
      sfxLast[name] = now;

        const src = audioCtx.createBufferSource();

        let k = Math.floor(Math.random() * vars.length);
        if (vars.length > 1 && k === sfxPrev[name]) k = (k + 1) % vars.length;
        sfxPrev[name] = k;
        src.buffer = vars[k];
        src.playbackRate.value = 1 + (Math.random() * 2 - 1) * jitter;
        const g = audioCtx.createGain();
        g.gain.value = vol * volMul;
        src.connect(g);
        g.connect(sfxBus);
        src.start();

    const SPATIAL_N = 32, spatialCells = [];
    for (let i = 0; i < SPATIAL_N * SPATIAL_N; i++) spatialCells.push([]);
    const spatialCl = v => { v = (v / SPATIAL_CELL) | 0; return v < 0 ? 0 : v > SPATIAL_N - 1 ? SPATIAL_N - 1 : v; };

    function rebuildSpatialGrid(enemiesList) {
      for (let i = 0; i < spatialCells.length; i++) spatialCells[i].length = 0;
      for (let i = 0; i < enemiesList.length; i++) {
        const e = enemiesList[i];
        spatialCells[spatialCl(e.x) * SPATIAL_N + spatialCl(e.y)].push(e);
      }
    }

    function getNearbyEnemies(x, y, radius) {

      for (let cx = minCx; cx <= maxCx; cx++) {

        e.hp = 26 * hpScale;

        e.damage = 10;
      } else if (type === 'fishguy') {
        e.radius = 28;
        e.hp = 115 * hpScale;
        e.speed = 65;
        e.damage = 25;
      } else if (type === 'grumbo') {
        e.radius = 24;
        e.hp = 62 * hpScale;
        e.speed = 80;
        e.damage = 16;
        e.castCooldown = 2.4 + Math.random() * 1.5;
      } else if (type === 'mootaur') {
        // Each Moo-taur: HP x1.6 vs the last one, moves and charges 10% faster; damage unchanged
        const tier = bossCount;
        bossCount++;
        lastBossHp = tier === 0 ? 1600 * Math.max(1, hpScale * 0.7) : lastBossHp * (tier === 3 ? 2.6 : 1.6);  // the enraged final one jumps x2.6 so it stays the hardest fight (Matin: stronger, not weaker)
        e.radius = isElite ? 52 * 1.4 : 52;
        e.hp = lastBossHp;
        e.speed = 95 * Math.pow(1.1, tier);
        e.chargeSpeed = 440 * Math.pow(1.1, tier);
        e.damage = 38;
        e.isBoss = true;
        e.isFinalBoss = isElite;
        e.bossName = isElite ? 'ANCIENT MOO-TAUR (FINAL BOSS, ENRAGED)' : `MOO-TAUR ${['I', 'II', 'III'][tier] || ''} (MINI-BOSS)`;
        e.attackCooldown = 3.5;
        e.stunTimer = 0;
      }

      if (isElite && type !== 'mootaur') {
        e.hp *= 6;
        e.radius *= 1.6;
        e.speed *= 1.1;
        e.damage *= 1.5;
      }
      e.maxHp = e.hp;

      clampToOctagon(e, e.radius);
      enemies.push(e);
      return e;
    }

    // --- VASES & PICKUPS HELPERS ---
    function getRandomVasePos() {
      for (let attempts = 0; attempts < 100; attempts++) {
        const rx = OCT_MIN_X + Math.random() * (OCT_MAX_X - OCT_MIN_X);
        const ry = OCT_MIN_Y + Math.random() * (OCT_MAX_Y - OCT_MIN_Y);
        if (!pointInOctagon(rx, ry)) continue;
        if (Math.hypot(rx - hero.x, ry - hero.y) < 120) continue;
        let nearStair = false;
        for (let s = 0; s < STAIRS.length; s++) {
          if (Math.hypot(rx - STAIRS[s].x, ry - STAIRS[s].y) < 120) {
            nearStair = true;
            break;
          }
        }
        if (nearStair) continue;
        return { x: rx, y: ry };
      }
      return { x: ARENA_CX + (Math.random() - 0.5) * 300, y: ARENA_CY + (Math.random() - 0.5) * 200 };
    }

    function spawnInitialVases() {
      for (let i = 0; i < 8; i++) {
        const pos = getRandomVasePos();
        const types = ['a', 'b', 'c'];
        vases.push({
          type: types[Math.floor(Math.random() * types.length)],
          x: pos.x,
          y: pos.y,
          broken: false,
          brokenTimer: 4.0,
          radius: 18,
          height: 55
        });
      }
    }
    spawnInitialVases();

    function breakVase(v) {
      if (v.broken) return;
      v.broken = true;
      v.brokenTimer = 4.0;
      playVFX('poof', v.x, v.y - 15, { scale: 0.6, fps: 18 });
      addShake(4);
      Sound.clunk();

      const r = Math.random();
      if (r < 0.40) {
        // 40% chance: 3-6 soul gems
        const count = 3 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          spawnSoulGem(v.x + (Math.random() - 0.5) * 20, v.y + (Math.random() - 0.5) * 20, 'small');
        }
      } else if (r < 0.65) {
        // 25% chance: potion
        spawnPickup('potion', v.x, v.y);
      } else if (r < 0.80) {
        // 15% chance: magnet
        spawnPickup('magnet', v.x, v.y);
      } else if (r < 0.95) {
        // 15% chance: boots
        spawnPickup('boots', v.x, v.y);
      }
      // 5% chance: nothing
    }

    function spawnPickup(type, x, y) {
      pickups.push({
        type,
        x, y,
        radius: 18,
        bobOffset: Math.random() * Math.PI * 2,
        life: 120
      });
    }

    function collectPickup(p) {
      Sound.gem();
      if (p.type === 'potion') {
        Sound.potion();
        hero.hp = Math.min(hero.maxHp, hero.hp + 30);
        spawnDamageNumber(hero.x, hero.y - 20, '+30', false, true);
        playVFX('levelup', hero.x, hero.y - 15, { scale: 0.6, fps: 16, tint: 'pink' });
      } else if (p.type === 'magnet') {
        soulGems.forEach(g => { g.magnetized = true; });
        playVFX('spark', hero.x, hero.y - 12, { scale: 0.8, fps: 24 });
      } else if (p.type === 'boots') {
        hero.speedBuffTimer = 8.0;
        playVFX('spark', hero.x, hero.y - 12, { scale: 0.7, fps: 24 });
      }
    }

    // --- SPAWN DIRECTOR (TIME-BASED PRESSURE CURVE) ---
    let spawnTimer = 0;
    let waveCycleTimer = 0;
    let stairBurstQueue = [];
    const MINI_BOSS_TIMES = [150, 300, 450]; // 2:30, 5:00, 7:30
    let miniBossesSpawned = 0;
    let finalBossSpawned = false;
    let bossCount = 0;
    let lastBossHp = 0;
    let nextEliteTime = 100; // First elite at 2:00
    let vaseSpawnTimer = 0;

    function updateSpawnDirector(dt) {
      waveCycleTimer += dt;
      const cycleTime = waveCycleTimer % 50;
      const isBreather = cycleTime > 40;
      const pressureMultiplier = isBreather ? 0.35 : (0.8 + (cycleTime / 40) * 0.8);

      if (miniBossesSpawned < MINI_BOSS_TIMES.length && gameTime >= MINI_BOSS_TIMES[miniBossesSpawned]) {
        miniBossesSpawned++;
        Sound.roar();
        addShake(14);
        screenFlash = 0.2;
        spawnEnemy('mootaur', ARENA_CX, OCT_MIN_Y + 60, false);
      }

      if (gameTime >= 570 && !finalBossSpawned) {
        finalBossSpawned = true;
        Sound.roar();
        addShake(18);
        screenFlash = 0.3;
        spawnEnemy('mootaur', ARENA_CX, OCT_MIN_Y + 60, true);
      }

      // Elite Spawning: first at 2:00, then every 70-90s, one at a time
      if (gameTime >= nextEliteTime) {
        const hasActiveElite = enemies.some(e => e.isElite && !e.isBoss);
        if (!hasActiveElite) {
          const unlocked = ['potbelly'];
          if (gameTime >= 45) unlocked.push('fishguy');
          if (gameTime >= 90) unlocked.push('grumbo');
          const eliteType = pickUnlockedType(unlocked);
          const stair = STAIRS[Math.floor(Math.random() * STAIRS.length)];
          spawnEnemy(eliteType, stair.x, stair.y, true);
          nextEliteTime = gameTime + 70 + Math.random() * 20;
        }
      }

      // Vase Resupply: Keep about 8 on the map; a new one appears every 18 s, up to 10.
      vaseSpawnTimer += dt;
      if (vaseSpawnTimer >= 18.0) {
        vaseSpawnTimer = 0;
        const activeVases = vases.filter(v => !v.broken).length;
        if (activeVases < 10) {
          const pos = getRandomVasePos();
          const types = ['a', 'b', 'c'];
          vases.push({
            type: types[Math.floor(Math.random() * types.length)],
            x: pos.x,
            y: pos.y,
            broken: false,
            brokenTimer: 4.0,
            radius: 18,
            height: 55
          });
        }
      }

      const hasBoss = enemies.some(e => e.isBoss && e.hp > 0);
      const bossSpawnThrottle = hasBoss ? 0.3 : 1.0;

      const minutes = gameTime / 60;
      // Balance: multiply spawnsPerSec by 1.15
      // Rebalance v2: busy from second one, then a gentle slope (was cubic: hundreds of enemies late, fps drops).
      // Late game gets FEWER but TOUGHER enemies (hpScale + ENEMY_CAP below).
      let spawnsPerSec = (1.0 + minutes * 0.5 + minutes * minutes * 0.015) * pressureMultiplier * bossSpawnThrottle;
      if (minutes >= 8.0 && minutes < 9.5) spawnsPerSec *= 1.2;

      spawnTimer += dt * spawnsPerSec;

      if (Math.abs(gameTime - 240) < dt || Math.abs(gameTime - 450) < dt) {
        spawnEncirclement(26);
      }

      if ((gameTime > 120 && Math.floor(gameTime) % 45 === 0 && Math.abs(gameTime - Math.floor(gameTime)) < dt)) {
        triggerStairBurst(Math.floor(5 + minutes * 1.5));
      }

      while (spawnTimer >= 1.0) {
        spawnTimer -= 1.0;
        spawnTrickleEnemy();
      }

      if (stairBurstQueue.length > 0) {
        const item = stairBurstQueue.shift();
        spawnEnemy(item.type, item.x + (Math.random() - 0.5) * 40, item.y + (Math.random() - 0.5) * 40);
      }
    }

    const ENEMY_CAP = 170; // was 380: fps drop late game
    function spawnTrickleEnemy() {
      if (enemies.length >= ENEMY_CAP) return;
      const ang = Math.random() * Math.PI * 2;
      const dist = (screenW / CAMERA.zoom) * 0.6 + 60;
      let sx = hero.x + Math.cos(ang) * dist;
      let sy = hero.y + Math.sin(ang) * dist;

      // Balance: Type mix in spawnTrickleEnemy
      let type = 'potbelly';
      if (gameTime >= 180) {
        // 3:00 onward: 48.2% potbelly, 35.3% fishguy, 16.5% grumbo (grumbo -25% vs 45/33/22)
        const r = Math.random();
        if (r < 0.482) type = 'potbelly';
        else if (r < 0.835) type = 'fishguy';
        else type = 'grumbo';
      } else if (gameTime >= 90) {
        // 1:30 onward: + grumbo (11.25%), fishguy (26.1%), potbelly (62.65%) (grumbo -25% vs 15/25/60)
        const r = Math.random();
        if (r < 0.1125) type = 'grumbo';
        else if (r < 0.3735) type = 'fishguy';
        else type = 'potbelly';
      } else if (gameTime >= 45) {
        // 0:45 onward: + fishguy (25%)
        type = Math.random() < 0.25 ? 'fishguy' : 'potbelly';
      } else {
        // 0:00–0:45: potbelly only
        type = 'potbelly';
      }

      spawnEnemy(type, sx, sy, false);
    }

    // Weighted pick: grumbo weighs 2/3 vs 1 for the rest, so with all three unlocked its share is 25% (was 33%)
    function pickUnlockedType(unlocked) {
      const w = t => (t === 'grumbo' ? 2 / 3 : 1);
      let total = 0;
      for (const t of unlocked) total += w(t);
      let r = Math.random() * total;
      for (const t of unlocked) { r -= w(t); if (r < 0) return t; }
      return unlocked[unlocked.length - 1];
    }

    function triggerStairBurst(count) {
      const stair = STAIRS[Math.floor(Math.random() * STAIRS.length)];
      // Stair bursts mix all unlocked types
      const unlocked = ['potbelly'];
      if (gameTime >= 45) unlocked.push('fishguy');
      if (gameTime >= 90) unlocked.push('grumbo');

      for (let i = 0; i < count; i++) {
        const t = pickUnlockedType(unlocked);
        stairBurstQueue.push({
          type: t,
          x: stair.x,
          y: stair.y
        });
      }
    }

    function spawnEncirclement(count) {
      const rad = 460;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2;
        const ex = hero.x + Math.cos(ang) * rad;
        const ey = hero.y + Math.sin(ang) * rad;
        spawnEnemy('potbelly', ex, ey, false);
      }
      addShake(5);
    }

    // --- STAFF TIP + CAST GESTURES ---
    // Crystal centre measured on the PNGs (centroid of the bright-yellow pixels), in draw units:
    // sprite drawn 100 px tall, anchored bottom-centre at the feet, facing right on disk. y up = negative.
    const HERO_SPRITE_H = 100;
    const STAFF_TIP = {
      'hero-idle': { x: -20.5, y: -77 },   // staff held on the back hand
      'hero-cast': { x: 22.2, y: -77.8 },  // staff thrust forward
      'hero-walk': { y: -80.6, x: [21.5, 17.5, 15.7, 16.0, 15.1, 16.8] } // per walk frame
    };
    const SLAM_IMPACT = 0.14; // s: anticipation + hop before the staff hits the ground
    // Pose the hero is drawn with this frame (local frame: +x = facing direction, +rot = lean forward)
    const heroPose = { key: 'hero-idle', frame: 0, ox: 0, oy: 0, rot: 0, sx: 1, sy: 1 };
    const tipPos = { x: 0, y: 0 }; // shared result of staffTip(), no per-call allocation
    let lastTipFlash = -1;

    // World position of the staff crystal for the current sprite/frame/facing/pose
    function staffTip() {
      const p = heroPose;
      const t = STAFF_TIP[hero.castTimer > 0 ? 'hero-cast' : p.key]; // a cast started this frame draws the cast pose
      const px = Array.isArray(t.x) ? t.x[p.frame] : t.x;
      const lx = px * p.sx, ly = t.y * p.sy;
      const c = Math.cos(p.rot), s = Math.sin(p.rot);
      tipPos.x = hero.x + p.ox + hero.facing * (lx * c - ly * s);
      tipPos.y = hero.y + p.oy + (lx * s + ly * c);
      return tipPos;
    }

    function tipFlash(scale = 0.35) {
      if (gameTime >= lastTipFlash && gameTime - lastTipFlash < 0.08) return; // throttled: rapid fire never floods the pool
      lastTipFlash = gameTime;
      const tp = staffTip();
      playVFX('spark', tp.x, tp.y, { scale, fps: 30, rot: Math.random() * Math.PI * 2 });
    }

    // Bigger cast wins; the same gesture never restarts itself mid-play (no jitter at high fire rates)
    function startHeroAnim(kind, dur, prio, dirX = hero.facing, dirY = 0) {
      const busy = hero.animT < hero.animDur;
      if (busy && (prio < hero.animPrio || hero.anim === kind)) return false;
      hero.anim = kind; hero.animT = 0; hero.animDur = dur; hero.animPrio = prio;
      hero.animDirX = dirX; hero.animDirY = dirY;
      return true;
    }

    function updateHeroPose(dt) {
      const h = hero;
      if (h.animT < h.animDur) h.animT += dt;
      if (h.recoilT > 0) h.recoilT -= dt;
      if (h.landT > 0) h.landT -= dt;

      // Delayed slam ring: lands exactly on the impact frame
      if (h.slamT >= 0) {
        h.slamT -= dt;
        if (h.slamT < 0) frostSlamImpact(h.slamW);
      }

      let ox = 0, oy = 0, rot = 0, sx = 1, sy = 1;
      const t = h.animT, p = h.animDur > 0 ? Math.min(1, t / h.animDur) : 1;
      if (t < h.animDur) {
        const fwd = Math.sign(h.animDirX || h.facing) * h.facing; // +1 = target in front of the hero
        if (h.anim === 'slam') {
          if (t < 0.06) { const k = t / 0.06; sy = 1 - 0.12 * k; sx = 1 + 0.08 * k; }
          else if (t < 0.10) { const k = (t - 0.06) / 0.04; oy = -11 * k; sy = 0.88 + 0.27 * k; sx = 1.08 - 0.14 * k; }
          else if (t < SLAM_IMPACT) { const k = (t - 0.10) / (SLAM_IMPACT - 0.10); oy = -11 * (1 - k); sy = 1.15; sx = 0.94; rot = 0.12 * k; }
          else { const e = 1 - (t - SLAM_IMPACT) / (h.animDur - SLAM_IMPACT); sy = 1 - 0.18 * e; sx = 1 + 0.14 * e; rot = 0.12 * e; }
        } else if (h.anim === 'thrust') {
          const e = Math.sin(Math.PI * p);
          ox = h.animDirX * 5 * e; oy = h.animDirY * 3 * e; rot = 0.1 * fwd * e;
        } else if (h.anim === 'brace') {
          const e = Math.min(1, t / 0.06, (h.animDur - t) / 0.08);
          sx = 1 + 0.08 * e; sy = 1 - 0.07 * e; rot = 0.07 * fwd * e;
        } else if (h.anim === 'raise' || h.anim === 'meteor') {
          const e = p < 0.25 ? p / 0.25 : 1 - (p - 0.25) / 0.75;
          sy = 1 + 0.12 * e; sx = 1 - 0.06 * e; oy = -3 * e;
        } else if (h.anim === 'plant') {
          const e = Math.sin(Math.PI * p);
          sy = 1 - 0.1 * e; sx = 1 + 0.06 * e; rot = 0.12 * e;
        } else if (h.anim === 'swirl') {
          rot = 0.14 * Math.sin(p * Math.PI * 2) * (1 - p);
          sy = 1 + 0.05 * Math.sin(Math.PI * p);
        } else if (h.anim === 'flick') { // quick staff slash: snap forward, settle back
          const e = p < 0.3 ? p / 0.3 : 1 - (p - 0.3) / 0.7;
          ox = h.animDirX * 4 * e; rot = 0.24 * fwd * e; sx = 1 + 0.05 * e;
        } else if (h.anim === 'hop') {
          const e = Math.sin(Math.PI * p);
          oy = -14 * e; sy = 1 + 0.1 * e; sx = 1 - 0.05 * e;
        }
      }
      if (h.recoilT > 0) { const e = h.recoilT / 0.06; ox -= h.animDirX * 1.5 * e; oy -= h.animDirY * 1 * e; }
      if (h.isDashing) {
        sx *= 1 + 0.25 * Math.abs(h.dashDirX) - 0.1 * Math.abs(h.dashDirY);
        sy *= 1 + 0.2 * Math.abs(h.dashDirY) - 0.1 * Math.abs(h.dashDirX);
        rot += 0.15 * h.dashDirX * h.facing;
      } else if (h.landT > 0) {
        const e = h.landT / 0.12;
        sy *= 1 - 0.12 * e; sx *= 1 + 0.1 * e;
      }
      // Walk bob (same curve the old draw used)
      if (h.isMoving) {
        rot += Math.sin(h.walkTimer) * 0.1;
        const b = Math.abs(Math.sin(h.walkTimer)) * 0.08;
        sy *= 1 - b; sx *= 1 + b;
      }
      heroPose.key = h.castTimer > 0 ? 'hero-cast' : (h.isMoving ? 'hero-walk' : 'hero-idle');
      heroPose.frame = Math.floor(h.walkTimer * 1.6) % 6;
      heroPose.ox = ox; heroPose.oy = oy; heroPose.rot = rot; heroPose.sx = sx; heroPose.sy = sy;
    }

    // Frost Ring on the slam's impact frame: ring at the feet, frost burst + crack where the staff hits
    function frostSlamImpact(w) {
      hero.slamW = null;
      if (!w || !hero.weapons.includes(w)) return;
      const stats = WEAPON_REGISTRY.frost.levels[w.level - 1];
      Sound.frost();
      addShake(6);
      kickCamera(0, 3);
      const tp = staffTip();
      const gx = tp.x, gy = hero.y + 2; // the staff's foot, on the ground under the crystal
      playVFX('frost', gx, gy - 6, { scale: 0.45, fps: 22 });
      spawnGroundCrack(gx, gy, 24);
      for (let i = 0; i < 4; i++) {
        spawnParticle({
          type: 'chunk', x: gx, y: gy - 4,
          vx: (Math.random() - 0.5) * 220, vy: -120 - Math.random() * 120,
          groundY: gy + 4 + Math.random() * 12, bounced: false,
          rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 14,
          size: 3 + Math.random() * 3, color: '#bae6fd', life: 0.6
        });
      }
      // Expanding ice ring: the strip's ring grows from ~57 px to ~95 px (outer edge) across its 6 frames
      const ringRad = stats.radius * hero.areaMult;
      const endScale = ringRad / ICE_RING_EDGE_END;
      const startScale = endScale * 0.2;
      const ringDur = 6 / ICE_RING_FPS;
      playVFX('icering', hero.x, hero.y, { scale: startScale, scaleEnd: endScale, fps: ICE_RING_FPS });
      spawnParticle({
        type: 'frost_ring_logic',
        x: hero.x,
        y: hero.y,
        startScale,
        endScale,
        radius: 0,
        dmg: stats.dmg * hero.damageMult,
        slow: stats.slow,
        freeze: w.evo === 'A', // Glacier: frozen solid for 2.5 s
        hitSet: new Set(),
        life: ringDur,
        maxLife: ringDur
      });
    }

    // --- HERO & WEAPON UPDATES ---
    function updateHero(dt) {
      if (hero.iFrames > 0) hero.iFrames -= dt;
      if (hero.flashTimer > 0) hero.flashTimer -= dt;
      if (hero.castTimer > 0) hero.castTimer -= dt;
      if (hero.speedBuffTimer > 0) hero.speedBuffTimer -= dt;

      // Calculate hero speed
      let baseSpeed = 210 * (1 + hero.passives.speed * 0.1);
      if (hero.relics.has('swift-soles')) baseSpeed *= 1.15;
      if (hero.speedBuffTimer > 0) baseSpeed *= 1.4;
      hero.speed = baseSpeed;

      // Dash Charges & Cooldown recovery
      if (hero.dashCharges < hero.maxDashCharges) {
        hero.dashChargeTimer -= dt;
        if (hero.dashChargeTimer <= 0) {
          hero.dashCharges++;
          if (hero.dashCharges < hero.maxDashCharges) {
            hero.dashChargeTimer = hero.dashCooldown;
          } else {
            hero.dashChargeTimer = 0;
          }
        }
      }

      if (hero.isDashing) {
        hero.x += hero.dashDirX * hero.speed * 2.8 * dt;
        hero.y += hero.dashDirY * hero.speed * 2.8 * dt;

        // Break vases when dashing through them
        for (let i = 0; i < vases.length; i++) {
          const v = vases[i];
          if (!v.broken && Math.hypot(hero.x - v.x, hero.y - v.y) < (hero.radius + v.radius + 6)) {
            breakVase(v);
          }
        }

        if (Math.random() < 0.7) {
          hero.ghosts.push({
            x: hero.x,
            y: hero.y,
            facing: hero.facing,
            alpha: 0.75
          });
          if (hero.ghosts.length > 8) hero.ghosts.shift();
        }

        hero.dashTimer -= dt;
        if (hero.dashTimer <= 0) {
          hero.isDashing = false;
          hero.landT = 0.12; // squash on stop
        }
      } else {
        let moveX = 0;
        let moveY = 0;
        if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

        if (joystick.active) {
          moveX = joystick.dx;
          moveY = joystick.dy;
        }

        const len = Math.hypot(moveX, moveY);
        if (len > 0.05) {
          hero.vx = (moveX / (len > 1 ? len : 1)) * hero.speed;
          hero.vy = (moveY / (len > 1 ? len : 1)) * hero.speed;
          if (!activeBeam) hero.facing = hero.vx >= 0 ? 1 : -1; // beam holds the staff toward its target
          hero.isMoving = true;
          hero.walkTimer += dt * 11;
        } else {
          hero.vx = 0;
          hero.vy = 0;
          hero.isMoving = false;
        }

        hero.x += hero.vx * dt;
        hero.y += hero.vy * dt;
      }

      clampToOctagon(hero, hero.radius);

      for (let i = hero.ghosts.length - 1; i >= 0; i--) {
        hero.ghosts[i].alpha -= dt * 3.5;
        if (hero.ghosts[i].alpha <= 0) hero.ghosts.splice(i, 1);
      }

      runesAngle += dt * 2.8;

      hero.weapons.forEach(w => {
        w.timer -= dt;
        // Echo Sigil: a cast repeats once, ECHO_DELAY later, without touching the cooldown
        if (w.echo > 0 && (w.echo -= dt) <= 0) {
          const keep = w.timer;
          fireWeapon(w);
          w.timer = keep;
        }
        if (w.timer <= 0) {
          fireWeapon(w);
          if (hero.passives.echo && Math.random() < 0.04 * hero.passives.echo) w.echo = ECHO_DELAY;
        }
      });
      updateHeroPose(dt); // after casts so a gesture/cast pose started this frame is drawn (and beamed from) this frame

      // Active Green Lightning Beam (no continuous shake; re-jagged every 2 frames)
      if (activeBeam) {
        activeBeam.timer -= dt;
        activeBeam.frameCounter = (activeBeam.frameCounter || 0) + 1;
        activeBeam.sweepAngle += dt * activeBeam.sweepSpeed;
        const bTip = staffTip();
        const bx = bTip.x;
        const by = bTip.y;
        // Twin Lightning: a second beam behind you
        const beamCount = activeBeam.twin ? 2 : 1;
        for (let bIdx = 0; bIdx < beamCount; bIdx++) {
        const currentAngle = activeBeam.baseAngle + bIdx * Math.PI + Math.sin(activeBeam.sweepAngle) * BEAM_SWEEP;
        const cosA = Math.cos(currentAngle);
        const sinA = Math.sin(currentAngle);
        const segKey = bIdx === 0 ? 'segments' : 'segments2';

        // Re-jagged segments every 2 frames
        if (!activeBeam[segKey] || activeBeam.frameCounter % 2 === 0) {
          const numSegs = 16;
          const segs = [{ x: bx, y: by }];
          const endX = bx + cosA * activeBeam.length;
          const endY = by + sinA * activeBeam.length;
          const perpX = -sinA;
          const perpY = cosA;
          for (let s = 1; s < numSegs; s++) {
            const frac = s / numSegs;
            const jx = bx + (endX - bx) * frac + perpX * (Math.random() - 0.5) * 18;
            const jy = by + (endY - by) * frac + perpY * (Math.random() - 0.5) * 18;
            segs.push({ x: jx, y: jy });
          }
          segs.push({ x: endX, y: endY });
          activeBeam[segKey] = segs;
          if (bIdx === 0) {
            activeBeam.tipX = endX;
            activeBeam.tipY = endY;
          }
        }

        enemies.forEach(e => {
          const toEx = e.x - bx;
          const toEy = e.y - by;
          const proj = toEx * cosA + toEy * sinA;
          if (proj > 0 && proj < activeBeam.length) {
            const perpDist = Math.abs(-toEx * sinA + toEy * cosA);
            if (perpDist < (activeBeam.width + e.radius)) {
              // registers as a hit every 0.12 s (same damage per second as before: dmg x 4), not every frame
              if (!e.beamT || gameTime - e.beamT >= 0.12) { e.beamT = gameTime; const firstOfCast = e.beamId !== activeBeam.id; e.beamId = activeBeam.id; damageEnemy(e, activeBeam.dmg * 0.48, cosA >= 0 ? 1 : -1, false, !firstOfCast); }
            }
          }
        });

        // Beam breaks vases
        vases.forEach(v => {
          if (!v.broken) {
            const toVx = v.x - bx;
            const toVy = v.y - by;
            const proj = toVx * cosA + toVy * sinA;
            if (proj > 0 && proj < activeBeam.length) {
              const perpDist = Math.abs(-toVx * sinA + toVy * cosA);
              if (perpDist < (activeBeam.width + v.radius)) {
                breakVase(v);
              }
            }
          }
        });
        }

        // Spark VFX at far end of green lightning beam
        if (Math.random() < dt * 18) {
          playVFX('spark', activeBeam.tipX, activeBeam.tipY, { scale: 0.5, fps: 30, rot: Math.random() * Math.PI * 2 });
        }

        if (activeBeam.timer <= 0) activeBeam = null;
      }

      // Frog Familiar (Frog Squad = 3 frogs, Mega Frog = one giant frog)
      const frogW = hero.weapons.find(w => w.id === 'frog');
      if (frogW) {
        const stats = WEAPON_REGISTRY.frog.levels[frogW.level - 1];
        const isMega = frogW.evo === 'B';
        const wantFrogs = frogW.evo === 'A' ? 3 : 1;
        while (frogStates.length < wantFrogs) {
          const nf = makeFrog();
          nf.timer = 0.3 * frogStates.length;
          frogStates.push(nf);
        }
        const dmgMult = isMega ? 3 : 1;
        const areaK = isMega ? 1.8 : 1;
        frogStates.forEach(frogState => {
        frogState.mega = isMega;
        if (frogState.bonkT > 0) frogState.bonkT -= dt; // BONK + landing frames after the last hit
        if (!frogState.active) {
          frogState.timer -= dt;
          if (frogState.timer <= 0) {
            const target = findNearestEnemy(hero.x, hero.y, 450);
            if (target) {
              frogState.active = true;
              frogState.leapsLeft = stats.leaps;
              frogState.startX = hero.x;
              frogState.startY = hero.y - 40;
              frogState.targetX = target.x + (frogStates.length > 1 ? (Math.random() - 0.5) * 60 : 0);
              frogState.targetY = target.y + (frogStates.length > 1 ? (Math.random() - 0.5) * 60 : 0);
              frogState.t = 0;
              Sound.frog();
            } else {
              frogState.timer = 0.5;
            }
          }
        } else {
          frogState.t += dt / frogState.duration;
          const t = Math.min(1, frogState.t);
          frogState.x = frogState.startX + (frogState.targetX - frogState.startX) * t;
          const groundY = frogState.startY + (frogState.targetY - frogState.startY) * t;
          frogState.y = groundY - 4 * frogState.arcHeight * t * (1 - t);

          if (frogState.t >= 1) {
            frogState.bonkT = 0.3;
            frogState.bonkX = frogState.targetX;
            frogState.bonkY = frogState.targetY;
            frogState.bonkFace = frogState.targetX >= frogState.startX ? 1 : -1;
            Sound.hit(true);
            addShake(isMega ? 16 : 7);
            kickCamera((Math.random() - 0.5) * 6, isMega ? 12 : 6);
            playVFX('spark', frogState.targetX, frogState.targetY, { scale: 0.7, fps: 30 });
            if (isMega) {
              // Big landing quake
              playVFX('poof', frogState.targetX, frogState.targetY, { scale: 1.6, fps: 18 });
              spawnGroundCrack(frogState.targetX, frogState.targetY, 60);
            }

            const nearby = getNearbyEnemies(frogState.targetX, frogState.targetY, 90 * hero.areaMult * areaK + 40);
            nearby.forEach(e => {
              const d = Math.hypot(e.x - frogState.targetX, e.y - frogState.targetY);
              if (d < 70 * hero.areaMult * areaK) {
                damageEnemy(e, stats.dmg * dmgMult * hero.damageMult, 1, false);
              }
              if (stats.shockDmg > 0 && d < 120 * hero.areaMult * areaK) {
                damageEnemy(e, stats.shockDmg * dmgMult * hero.damageMult, 1, false);
              }
            });

            // Frog impact breaks vases
            vases.forEach(v => {
              if (!v.broken && Math.hypot(v.x - frogState.targetX, v.y - frogState.targetY) < 70 * hero.areaMult * areaK) {
                breakVase(v);
              }
            });

            frogState.leapsLeft--;
            if (frogState.leapsLeft > 0) {
              const nextTarget = findNearestEnemy(frogState.targetX, frogState.targetY, 350);
              frogState.startX = frogState.targetX;
              frogState.startY = frogState.targetY;
              frogState.targetX = nextTarget ? nextTarget.x : (frogState.startX + (Math.random() - 0.5) * 200);
              frogState.targetY = nextTarget ? nextTarget.y : (frogState.startY + (Math.random() - 0.5) * 200);
              frogState.t = 0;
              Sound.frog();
            } else {
              frogState.active = false;
              frogState.timer = stats.cd * hero.cooldownMult;
            }
          }
        }
        });
      }

      // Orbiting gems contact damage & vase breaking
      const runesW = hero.weapons.find(w => w.id === 'runes');
      if (runesW) {
        const geo = runesGeometry(runesW);
        const stats = geo.stats;
        const rad = geo.rad;
        for (let i = 0; i < geo.count; i++) {
          const ang = runesAngle + (i / geo.count) * Math.PI * 2;
          const rx = hero.x + Math.cos(ang) * rad;
          const ry = hero.y - 20 + Math.sin(ang) * rad;
          const near = getNearbyEnemies(rx, ry, 36);
          near.forEach(e => {
            if (Math.hypot(e.x - rx, e.y - ry) < (18 + e.radius)) {
              if (!e.lastRuneHit || gameTime - e.lastRuneHit > 0.28) {
                e.lastRuneHit = gameTime;
                damageEnemy(e, stats.dmg * hero.damageMult, Math.cos(ang), false);
                gemFlash[i] = 2; // tiny 2-frame white flash on the gem
                // Electric zap at the contact point, at most 1 per enemy every 150 ms
                if (!e.lastZap || gameTime - e.lastZap >= 0.15) {
                  e.lastZap = gameTime;
                  Sound.zap();
                  playVFX('zap', (rx + e.x) / 2, (ry + e.y - 12) / 2, { scale: 0.45, fps: 24, rot: Math.random() * Math.PI * 2 });
                }
              }
            }
          });

          vases.forEach(v => {
            if (!v.broken && Math.hypot(rx - v.x, ry - v.y) < (18 + v.radius)) {
              breakVase(v);
            }
          });
        }
      }

      // Dash Cooldown Overlay & Button Pips
      const cdPct = (hero.dashCharges === 0 && hero.dashChargeTimer > 0) ? (hero.dashChargeTimer / hero.dashCooldown) : 0;
      const dashOverlay = document.getElementById('dash-cooldown-overlay');
      if (cdPct > 0) {
        dashOverlay.style.display = 'block';
        dashOverlay.style.opacity = cdPct;
      } else {
        dashOverlay.style.display = 'none';
      }

      const pipsContainer = document.getElementById('dash-pips');
      if (hero.maxDashCharges > 1) {
        pipsContainer.style.display = 'flex';
        const pip1 = document.getElementById('dash-pip-1');
        const pip2 = document.getElementById('dash-pip-2');
        if (pip1) pip1.className = hero.dashCharges >= 1 ? 'dash-pip' : 'dash-pip empty';
        if (pip2) pip2.className = hero.dashCharges >= 2 ? 'dash-pip' : 'dash-pip empty';
      } else {
        pipsContainer.style.display = 'none';
      }
    }

    // Orbiting gems: count & radius incl. evolutions (Gem Storm: 8 wider; Crystal Nova: burst out every 4 s and return)
    function runesGeometry(w) {
      const stats = WEAPON_REGISTRY.runes.levels[w.level - 1];
      let count = stats.count;
      let rad = stats.radius * hero.areaMult;
      if (w.evo === 'A') {
        count = 8;
        rad *= 1.35;
      } else if (w.evo === 'B') {
        const phase = gameTime % 4;
        if (phase < 1.2) rad *= 1 + 1.6 * Math.sin((phase / 1.2) * Math.PI);
      }
      return { stats, count, rad };
    }

    // Arcane Beam aim: the direction (from the staff tip) holding the most enemies in reach; ties -> nearest.
    const BEAM_SWEEP = 0.3;      // rad either side of the aim
    const BEAM_RETRY_S = 0.3;    // no enemy in reach: try again this soon
    const BEAM_AIM_CONE = 0.35;  // rad: enemies this close to a candidate angle count for it
    const BEAM_AIM_MAX = 24;     // candidate angles tested (nearest enemies)
    function beamAimAngle(len) {
      const tp = staffTip();
      const tx = tp.x, ty = tp.y;
      const near = getNearbyEnemies(tx, ty, len)
        .filter(e => e.hp > 0 && Math.hypot(e.x - tx, e.y - ty) < len + e.radius)
        .map(e => ({ a: Math.atan2(e.y - 15 - ty, e.x - tx), d: Math.hypot(e.x - tx, e.y - ty) }))
        .sort((p, q) => p.d - q.d);
      if (!near.length) return null;
      let best = near[0].a, bestN = 0;
      // ponytail: O(24*n) scan over nearby enemies; fine at swarm sizes here
      for (let i = 0; i < Math.min(BEAM_AIM_MAX, near.length); i++) {
        let n = 0;
        for (let j = 0; j < near.length; j++) {
          const da = Math.abs(Math.atan2(Math.sin(near[j].a - near[i].a), Math.cos(near[j].a - near[i].a)));
          if (da < BEAM_AIM_CONE) n++;
        }
        if (n > bestN) { bestN = n; best = near[i].a; }
      }
      return best;
    }

    function fireWeapon(w) {
      const reg = WEAPON_REGISTRY[w.id];
      const stats = reg.levels[w.level - 1];
      w.timer = (stats.cd || 1.0) * hero.cooldownMult;
      if (w.id === 'frost' && w.evo === 'B') w.timer *= 0.5; // Permafrost: pulses twice as often
      w.cdMax = w.timer; // inventory HUD clock wipe

      if (w.id === 'bolt') {
        const isLance = w.evo === 'B';
        const count = w.evo === 'A' ? 5 : (isLance ? 1 : stats.projs); // Arcane Volley: 5-bolt fan
        const hasStormStaff = hero.relics.has('storm-staff');
        const boltDmg = stats.dmg * hero.damageMult * (hasStormStaff ? 1.6 : 1.0) * (isLance ? 3 : 1);
        const boltPierce = isLance ? 9999 : stats.pierce + (hasStormStaff ? 2 : 0);
        const boltCol = hasStormStaff ? '#7CFF6B' : '#38bdf8';
        const fanStep = w.evo === 'A' ? 0.22 : 0.16;

        for (let i = 0; i < count; i++) {
          const target = findNearestEnemy(hero.x, hero.y, 750);
          if (target) {
            hero.castTimer = 0.15;
            if (i === 0) {
              const aim = Math.atan2(target.y - hero.y, target.x - hero.x);
              // Standing still: turn to face the target so the bolt leaves the front of the staff
              if (!hero.isMoving && !hero.isDashing && !activeBeam) hero.facing = target.x >= hero.x ? 1 : -1;
              // Staff thrust; mid-thrust re-casts only get a tiny recoil
              if (!startHeroAnim('thrust', 0.15, 1, Math.cos(aim), Math.sin(aim))) {
                hero.animDirX = Math.cos(aim); hero.animDirY = Math.sin(aim); hero.recoilT = 0.06;
              }
              tipFlash();
            }
            const tp = staffTip();
            const spread = (i - (count - 1) / 2) * fanStep;
            const angle = Math.atan2(target.y - tp.y, target.x - tp.x) + spread;
            heroProjectiles.push({
              type: 'bolt',
              x: tp.x,
              y: tp.y,
              vx: Math.cos(angle) * 620,
              vy: Math.sin(angle) * 620,
              dmg: boltDmg,
              pierce: boltPierce,
              life: 1.4,
              color: boltCol,
              isStormStaff: hasStormStaff,
              size: isLance ? 2.6 : 1,
              hitSet: isLance ? new Set() : null,
              trail: []
            });
            Sound.bolt();
          }
        }
      } else if (w.id === 'chain') {
        const jumps = stats.jumps + (w.evo === 'A' ? 5 : 0); // Storm Web: +5 jumps
        if (w.evo === 'B') {
          // Thunder Crown: strikes the 3 nearest targets at once
          const starts = enemies
            .filter(e => Math.hypot(e.x - hero.x, e.y - hero.y) < 550)
            .sort((a, b) => Math.hypot(a.x - hero.x, a.y - hero.y) - Math.hypot(b.x - hero.x, b.y - hero.y))
            .slice(0, 3);
          if (starts.length) {
            Sound.lightning();
            addShake(6);
            chainRaise();
            starts.forEach(st => executeChainLightning(st, jumps, stats.dmg * hero.damageMult));
          }
        } else {
          const startTarget = findNearestEnemy(hero.x, hero.y, 550);
          if (startTarget) {
            Sound.lightning();
            addShake(4);
            chainRaise();
            executeChainLightning(startTarget, jumps, stats.dmg * hero.damageMult);
          }
        }
      } else if (w.id === 'frost') {
        if (hero.slamT >= 0) { hero.slamT = -1; frostSlamImpact(hero.slamW); } // a pending slam lands first
        // Staff slam: hop, slam; the ring is born on the impact frame (bigger gesture in progress: ring now)
        if (startHeroAnim('slam', 0.32, 4)) {
          hero.slamW = w;
          hero.slamT = SLAM_IMPACT;
        } else {
          frostSlamImpact(w);
        }
      } else if (w.id === 'beam') {
        const overcharge = w.evo === 'B'; // Overcharge: x2 damage, x1.5 length
        const beamLen = stats.length * hero.areaMult * (overcharge ? 1.5 : 1);
        const aimAng = beamAimAngle(beamLen);
        if (aimAng === null) { w.timer = BEAM_RETRY_S; w.cdMax = 0; return; } // nothing in reach: hold fire, retry soon
        if (!hero.isDashing) hero.facing = Math.cos(aimAng) >= 0 ? 1 : -1; // staff (and its tip) turns to the target
