            ctx.lineTo(0, 17);
            ctx.lineTo(-14, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          // Small white twinkle
          const twinkle = Math.sin(gameTime * 7 + i * 2);
          if (twinkle > 0.4) {
            ctx.save();
            ctx.globalAlpha = (twinkle - 0.4) * 1.6;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          ctx.restore();
        }
      }

      ctx.restore();
    }

    function drawVase(v) {
      ctx.save();
      ctx.translate(v.x, v.y);

      if (v.broken) {
        ctx.globalAlpha = Math.max(0, Math.min(1, v.brokenTimer / 4.0));
      }

      // Soft ground shadow
      ctx.fillStyle = 'rgba(10, 8, 16, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      const spriteKey = v.broken ? `vase-${v.type}-broken` : `vase-${v.type}`;
      const img = SPRITES[spriteKey];
      if (img && img.complete && img.naturalWidth > 0) {
        const aspect = img.naturalWidth / img.naturalHeight;
        const vh = v.height;
        const vw = vh * aspect;
        ctx.drawImage(img, -vw / 2, -vh + 6, vw, vh);
      } else {
        ctx.fillStyle = v.broken ? '#854d0e' : '#b45309';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3;
        if (v.broken) {
          ctx.beginPath();
          ctx.arc(0, -10, 14, 0, Math.PI);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.roundRect(-12, -45, 24, 45, 6);
          ctx.fill();
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawPickup(p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      // Soft ground shadow
      ctx.fillStyle = 'rgba(10, 8, 16, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 4, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      const bob = Math.sin(gameTime * 4 + p.bobOffset) * 4;
      ctx.translate(0, -16 + bob);

      // White outline flash every second
      const flash = Math.sin(gameTime * Math.PI * 2) > 0.65;
      if (flash) {
        ctx.filter = 'drop-shadow(0 0 6px #ffffff) brightness(1.25)';
      }

      const img = SPRITES[p.type];
      if (img && img.complete && img.naturalWidth > 0) {
        // keep the art's own proportions (was forced into a 36x36 square = squashed/thin)
        const PICK = 40, k = PICK / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * k, h = img.naturalHeight * k;
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      } else {
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'potion' ? '🧪' : (p.type === 'magnet' ? '🧲' : '👢'), 0, 8);
      }
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      // Telegraphs
      if (e.type === 'fishguy' && e.state === 'windup') {
        ctx.save();
        ctx.rotate(e.facing > 0 ? 0 : Math.PI);
        ctx.fillStyle = 'rgba(255, 51, 102, 0.35)';
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 85, -0.6, 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      if (e.type === 'mootaur' && e.state === 'charge_windup') {
        ctx.save();
        const ang = Math.atan2(e.chargeDirY, e.chargeDirX);
        ctx.rotate(ang);
        ctx.fillStyle = 'rgba(255, 51, 102, 0.3)';
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 3;
        ctx.fillRect(0, -e.radius, 550, e.radius * 2);
        ctx.strokeRect(0, -e.radius, 550, e.radius * 2);
        ctx.restore();
      }

      // Shadow
      ctx.fillStyle = 'rgba(10,8,16,0.6)';
      ctx.beginPath();
      ctx.ellipse(0, 4, e.radius * 1.15, e.radius * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      const iceScale = updateEnemyIce(e);
      if (iceScale > 0) drawEnemyIce(e, iceScale, true);

      // Facing (sign of velocity) + procedural juice. Art that faces LEFT on disk is mirrored per
      // sprite key just before drawing (SPRITE_FACES_LEFT), so every enemy faces where it walks.
      ctx.scale(e.facing, 1);

      let hopY = 0;
      let squishX = e.squashX || 1; // hit squash + spawn pop (springs back in updateEnemies)
      let squishY = e.squashY || 1;
      let tilt = 0;

      // Step bob synced to the walk frames: 2 steps per 6-frame cycle
      if (e.isMovingNow) {
        const stepPhase = (e.animTime % 3) / 3;
        const lift = Math.sin(stepPhase * Math.PI); // 0 at foot contact, 1 mid-step
        const bobAmp = e.type === 'potbelly' ? 7 : (e.type === 'mootaur' ? 5 : 3); // potbellies hop slightly
        hopY = -lift * bobAmp;
        // Squash on landing
        const land = Math.max(0, 1 - lift * 3);
        squishY *= 1 - land * 0.08;
        squishX *= 1 + land * 0.08;
        tilt = Math.sin(stepPhase * Math.PI * 2) * 0.04;
      }

      // Anticipation squash before attacks
      if (e.type === 'fishguy' && e.state === 'windup') {
        const k = 1 - Math.max(0, e.stateTimer) / 0.6; // wind-up crouch
        squishY *= 1 - 0.22 * k;
        squishX *= 1 + 0.16 * k;
        hopY = 0;
      } else if (e.type === 'grumbo' && e.state === 'casting') {
        const k = Math.min(1, Math.max(0, (0.5 - e.castCooldown) / 0.5)); // raises its staff
        squishY *= 1 + 0.12 * k;
        squishX *= 1 - 0.08 * k;
        hopY -= 4 * k;
      } else if (e.type === 'mootaur' && e.state === 'charge_windup') {
        const k = 1 - Math.max(0, e.stateTimer) / 0.8; // rears back before the charge
        tilt = -0.22 * k;
        squishY *= 1 - 0.12 * k;
        squishX *= 1 + 0.1 * k;
        hopY = 0;
      }

      // Attack: lean back (-) then lunge (+) along the hero direction, stretch on the strike. Local frame: +x = facing.
      let lungeX = 0, lungeY = 0;
      if (e.atkT >= 0) {
        const t = e.atkT;
        let reach, str, lean;
        if (t < ATK_WINDUP) { const u = t / ATK_WINDUP; reach = -4 * u; str = -0.5 * u; lean = -0.16 * u; }
        else if (t < ATK_LUNGE_END) { const u = (t - ATK_WINDUP) / (ATK_LUNGE_END - ATK_WINDUP); reach = -4 + (ATK_REACH + 4) * u; str = -0.5 + 1.5 * u; lean = -0.16 + 0.3 * u; }
        else { const u = 1 - (t - ATK_LUNGE_END) / (ATK_S - ATK_LUNGE_END); reach = ATK_REACH * u; str = u; lean = 0.14 * u; }
        lungeX = e.atkDX * reach * e.facing;
        lungeY = e.atkDY * reach * 0.6;
        squishX *= 1 + 0.18 * str;
        squishY *= 1 - 0.1 * str;
        tilt += lean;
        hopY = 0;
      }
      // Hurt flinch: squash + tilt away from the hit (knockback itself is the recoil velocity)
      if (e.hurtT > 0) {
        const k = e.hurtT / HURT_S;
        squishX *= 1 + 0.14 * k;
        squishY *= 1 - 0.14 * k;
        tilt += 0.22 * k * e.hurtDir * e.facing;
      }

      ctx.translate(lungeX, hopY + lungeY);
      ctx.rotate(tilt);
      ctx.scale(squishX, squishY);

      let targetHeight = 60;
      let spriteKey = e.type;
      let frameIdx = Math.floor(e.animTime) % 6; // own random start frame, ~10 fps at base speed

      if (e.type === 'potbelly') {
        targetHeight = 60;
        spriteKey = SPRITES['potbelly-walk'] ? 'potbelly-walk' : 'potbelly';
      } else if (e.type === 'fishguy') {
        targetHeight = 95;
        spriteKey = SPRITES['fishguy-walk'] ? 'fishguy-walk' : 'fishguy';
      } else if (e.type === 'grumbo') {
        targetHeight = 80;
        spriteKey = (e.state === 'casting') ? 'grumbo-cast' : (SPRITES['grumbo-walk'] ? 'grumbo-walk' : 'grumbo');
      } else if (e.type === 'mootaur') {
        targetHeight = e.isFinalBoss ? 294 : 210;
        if (e.state === 'charging' || e.state === 'charge_windup') {
          spriteKey = 'mootaur-charge';
          frameIdx = undefined;
        } else if (e.isMovingNow && SPRITES['mootaur-walk']) {
          spriteKey = 'mootaur-walk';
        } else {
          spriteKey = 'mootaur-idle';
          frameIdx = undefined;
        }
      }

      // Optional art overrides the walk frame: <type>-attack (2 frames: windup, strike), <type>-hurt (1 frame)
      let frameCount = 6;
      if (e.atkT >= 0 && SPRITES[e.type + '-attack']) {
        spriteKey = e.type + '-attack'; frameCount = 2; frameIdx = e.atkT < ATK_WINDUP ? 0 : 1;
      } else if (e.hurtT > 0 && SPRITES[e.type + '-hurt']) {
        spriteKey = e.type + '-hurt'; frameCount = 1; frameIdx = 0;
      }
      targetHeight *= SPRITE_HEIGHT_MUL[spriteKey] || 1;

      // Elite: 1.6x size
      if (e.isElite && e.type !== 'mootaur') targetHeight *= 1.6;

      if (SPRITE_FACES_LEFT.has(spriteKey)) ctx.scale(-1, 1);
      // Frozen solid: bluish ice-tinted copy of the sprite (tinted once, cached)
      if (e.freezeTimer > 0 && SPRITES[spriteKey]) spriteKey = getIceTinted(spriteKey);
      drawCharacterSprite(spriteKey, targetHeight, e.walkTimer, frameCount, e.flashTimer > 0, frameIdx);

      // Elite Golden Outline Glow
      if (e.isElite) {
        ctx.save();
        ctx.strokeStyle = '#ffd23f';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#ffd23f';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(0, -e.radius * 0.9, e.radius * 1.35, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }


      // Stun Stars above head (Boss wall crash)
      if (e.isBoss && e.stunTimer > 0) {
        ctx.save();
        ctx.translate(0, -targetHeight - 14);
        for (let s = 0; s < 3; s++) {
          const starAng = gameTime * 8 + (s / 3) * Math.PI * 2;
          const sx = Math.cos(starAng) * 28;
          const sy = Math.sin(starAng) * 10;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.fillStyle = '#ffd23f';
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      ctx.restore();

      // Front half of the ice ring over the legs, plus falling frost flakes while only slowed
      if (iceScale > 0) {
        ctx.save();
        ctx.translate(e.x, e.y);
        drawEnemyIce(e, iceScale, false);
        if (e.freezeTimer <= 0 && e.slowTimer > 0) {
          ctx.fillStyle = '#e0f4ff';
          for (let j = 0; j < 3; j++) {
            const ph = (gameTime * 0.9 + j / 3 + e.iceSeed) % 1;
            ctx.globalAlpha = 0.9 * (1 - ph) * iceScale;
            const fx = Math.sin(j * 2.1 + e.iceSeed) * e.radius * 0.9 + Math.sin(gameTime * 3 + j) * 3;
            const fy = -targetHeight * 0.75 * (1 - ph) - 4;
            ctx.fillRect(fx - 1.5, fy - 1.5, 3, 3);
          }
        }
        ctx.restore();
      }

      // Elite health bar floating above the head (unflipped): 46 px, gold border, red fill, dark back, white flash on hit
      if (e.isElite && !e.isBoss) {
        const barW = 46;
        const barH = 7;
        const pct = Math.max(0, Math.min(1, e.hp / e.maxHp));
        ctx.save();
        ctx.translate(e.x - barW / 2, e.y - targetHeight - 16);
        ctx.fillStyle = '#14111e';
        ctx.beginPath();
        ctx.roundRect(0, 0, barW, barH, 3);
        ctx.fill();
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#ef4444';
        ctx.fillRect(1.5, 1.5, (barW - 3) * pct, barH - 3);
        ctx.strokeStyle = '#ffd23f';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(0, 0, barW, barH, 3);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- ICE AT THE FEET: ring of shards (back half behind the legs, front half over them) ---
    // ice-big while frozen, ice-med for the slow that follows a freeze, ice-small for a plain slow.
    // Pop-in 0.6 -> 1 over 0.12 s with overshoot; on thaw shrink + fade over 0.15 s. Returns draw scale (0 = none).
    const ICE_POP_TIME = 0.12;
    const ICE_THAW_TIME = 0.15;
    function updateEnemyIce(e) {
      let key = null;
      if (e.freezeTimer > 0) key = 'ice-big';
      else if (e.slowTimer > 0) key = (e.iceKey === 'ice-big' || e.iceKey === 'ice-med') ? 'ice-med' : 'ice-small';
      if (key) {
        if (key !== e.iceKey) { e.iceKey = key; e.iceStart = gameTime; }
        e.iceEnd = -1;
        const x = Math.min(1, (gameTime - e.iceStart) / ICE_POP_TIME) - 1;
        return 0.6 + 0.4 * (1 + 2.70158 * x * x * x + 1.70158 * x * x); // easeOutBack
      }
      if (!e.iceKey) return 0;
      if (e.iceEnd < 0) e.iceEnd = gameTime;
      const u = (gameTime - e.iceEnd) / ICE_THAW_TIME;
      if (u >= 1) { e.iceKey = null; return 0; }
      return 1 - u; // drawEnemyIce shrinks + fades with it
    }

    // Ice-tinted sprite copy, built once per sprite key (a per-draw ctx.filter halved FPS with 200 frozen enemies)
    function getIceTinted(key) {
      const iceKey = key + '#ice';
      if (!SPRITES[iceKey]) {
        const img = SPRITES[key];
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const cx = c.getContext('2d');
        cx.filter = 'saturate(0.45) brightness(1.2) sepia(0.4) hue-rotate(160deg) saturate(1.9)';
        cx.drawImage(img, 0, 0);
        c.complete = true; // drawCharacterSprite reads these like an <img>

        c.naturalHeight = c.height;

      }
      return iceKey;
    }

    function drawEnemyIce(e, k, backHalf) {
      const img = SPRITES[e.iceKey];
      if (!img) return;
      const thawing = e.iceEnd >= 0;
      const scale = thawing ? 0.7 + 0.3 * k : k;
      const grow = (e.isElite && !e.isBoss) ? 1.6 : 1;
      const shimmer = 1 + 0.025 * Math.sin(gameTime * 6 + e.iceSeed);
      const dw = e.radius * 2.2 * grow * scale * shimmer;
      const dh = dw * img.naturalHeight / img.naturalWidth;
      const split = 0.48; // back half = top 48% of the image
      const sh = img.naturalHeight * split;
      ctx.save();
      if (thawing) ctx.globalAlpha = k;
      if (backHalf) {
        ctx.drawImage(img, 0, 0, img.naturalWidth, sh, -dw / 2, -dh / 2, dw, dh * split);
      } else {
        ctx.drawImage(img, 0, sh, img.naturalWidth, img.naturalHeight - sh, -dw / 2, -dh / 2 + dh * split, dw, dh * (1 - split));
      }
      ctx.restore();
    }

    // Checked by eye on the PNGs: these walk to the LEFT on disk; everything else faces right or the camera.
    // Per key: add a key here when its art faces LEFT (the -attack / -hurt keys are assumed to face RIGHT).
    const SPRITE_FACES_LEFT = new Set(['potbelly-walk', 'fishguy-walk', 'grumbo-walk', 'mootaur-walk', 'grumbo']);
    // Per key: draw-height multiplier when a frame has more empty padding than the walk strip (e.g. 'fishguy-attack': 1.3)
    const SPRITE_HEIGHT_MUL = {};
    function drawCharacterSprite(key, height, timer, frameCount = 6, isWhiteFlash = false, frameOverride) {
      const img = SPRITES[key];
      if (img && img.complete && img.naturalWidth > 0) {
        // 6-frame walk sheets are > 2:1; a 2-frame strip is ~2:1; a 1-frame key is never a sheet
        const isSheet = frameCount === 1 ? false : frameCount === 2 ? img.naturalWidth >= img.naturalHeight * 1.5 : img.naturalWidth > img.naturalHeight * 2;
        let srcX = 0;
        let srcY = 0;
        let srcW = img.naturalWidth;
        let srcH = img.naturalHeight;

        if (isSheet) {
          srcW = img.naturalWidth / frameCount;
          const frameIdx = frameOverride !== undefined ? frameOverride % frameCount : Math.floor(timer * 1.6) % frameCount;
          srcX = frameIdx * srcW;
        }

        const aspect = srcW / srcH;
        const drawH = height;
        const drawW = height * aspect;

        ctx.save();
        if (isWhiteFlash) {
          ctx.filter = 'brightness(10) contrast(2)';
        }
        ctx.drawImage(img, srcX, srcY, srcW, srcH, -drawW / 2, -drawH, drawW, drawH);
        ctx.restore();
      } else {
        ctx.save();
        ctx.fillStyle = isWhiteFlash ? '#ffffff' : '#334155';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.roundRect(-height * 0.25, -height, height * 0.5, height, 12);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- PROJECTILES & PARTICLES RENDERING ---
    // One spinning ghost blade; painted sprite (points right, 256x67) or a procedural fallback until it loads
    const BLADE_LEN = 54;
    function drawSpectralBlade(x, y, spin, size, alpha) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(spin);
      ctx.globalAlpha = alpha;
      const len = BLADE_LEN * size;
      const img = SPRITES['spectral-blade'];
      if (img && img.complete && img.naturalWidth) {
        const h = len * img.naturalHeight / img.naturalWidth;
        ctx.drawImage(img, -len / 2, -h / 2, len, h);
      } else {
        const hw = 5 * size;
        ctx.beginPath();
        ctx.moveTo(len / 2, 0);
        ctx.lineTo(-len * 0.2, -hw);
        ctx.lineTo(-len / 2, -hw * 0.5);
        ctx.lineTo(-len / 2, hw * 0.5);
        ctx.lineTo(-len * 0.2, hw);
        ctx.closePath();
        ctx.fillStyle = '#c4b5fd';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2.5;
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#a5f3fc';
        ctx.fillRect(-len * 0.2, -hw * 0.3, len * 0.55, hw * 0.6);
      }
      ctx.restore();
    }

    function drawProjectilesAndEffects() {
      // Frog Familiar
      frogStates.forEach(frogState => {
        // Pet frog: painted 6-frame strip (crouch, launch, fly, headbutt dive, BONK, land), faces right
        const strip = SPRITES['petfrog'];
        let fx, fy, frame, face;
        if (frogState.active) {
          const t = Math.min(1, frogState.t);
          frame = t < 0.12 ? 0 : (t < 0.3 ? 1 : (t < 0.62 ? 2 : 3));
          fx = frogState.x; fy = frogState.y;
          face = frogState.targetX >= frogState.startX ? 1 : -1;
        } else if (frogState.bonkT > 0) {
          frame = frogState.bonkT > 0.15 ? 4 : 5;
          fx = frogState.bonkX; fy = frogState.bonkY;
          face = frogState.bonkFace || 1;
        } else return;
        ctx.save();
        ctx.translate(fx, fy);

          ctx.fillStyle = '#22c55e';
          ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });

      // 2. Arcane Beam as THICK GREEN LIGHTNING: wide aura at the hit width, 3 crossing jagged strands, forks, flares
      if (activeBeam) {
        const bEl = 0.65 - activeBeam.timer;
        const bA = Math.max(0, Math.min(1, bEl / 0.06, activeBeam.timer / 0.1));
        const bF = activeBeam.frameCounter >> 1; // new bolt shape every 2 frames
        const bLists = [activeBeam.segments, activeBeam.segments2];
        for (let bl = 0; bl < bLists.length; bl++) {
          const segs = bLists[bl];
          if (!segs || segs.length < 3 || bA <= 0) continue;
          const n = Math.min(segs.length, BEAM_MAXN);
          const sx = segs[0].x, sy = segs[0].y, ex = segs[n - 1].x, ey = segs[n - 1].y;
          const bLen = Math.hypot(ex - sx, ey - sy) || 1;
          const dx = (ex - sx) / bLen, dy = (ey - sy) / bLen, nx = -dy, ny = dx;

          ctx.globalAlpha = bA;
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';

          ctx.lineWidth = hw * 1.9; ctx.strokeStyle = 'rgba(40,255,100,0.10)'; ctx.stroke();

          ctx.globalCompositeOperation = 'source-over';
          // 3 strands: each point of the base wobble plus a perpendicular jolt, tapered to zero at both ends
          for (let k = 0; k < 3; k++) {

            for (let i = 0; i < n; i++) {
              const t = i / (n - 1), e = Math.sin(Math.PI * t) * 0.9 + 0.1 * (i > 0 && i < n - 1 ? 1 : 0);
              const j = beamHash(i, k, bF) * 2 * amp * e;
              beamCx[i] = segs[i].x + nx * j; beamCy[i] = segs[i].y + ny * j;
            }
            if (k === 0) for (let i = 0; i < n; i++) { beamMx[i] = beamCx[i]; beamMy[i] = beamCy[i]; }
            const thick = k === 0 ? 1 : 0.6;
            ctx.beginPath(); ctx.moveTo(beamCx[0], beamCy[0]);
            for (let i = 1; i < n; i++) ctx.lineTo(beamCx[i], beamCy[i]);
            ctx.lineWidth = 11 * thick; ctx.strokeStyle = '#102a16'; ctx.stroke();
            ctx.lineWidth = 6.5 * thick; ctx.strokeStyle = k === 0 ? '#27E05A' : '#4BEA7A'; ctx.stroke();
            ctx.lineWidth = 2.6 * thick; ctx.strokeStyle = '#F2FFF0'; ctx.stroke();
          }
          // forks: short side bolts leaving the main strand
          ctx.strokeStyle = '#7CFF8B'; ctx.lineWidth = 3.2;
          for (let f = 0; f < 5; f++) {
            const p = 1 + Math.floor(((beamHash(f, 7, bF) + 0.5) * (n - 3))), side = beamHash(f, 9, bF) > 0 ? 1 : -1;
            const ang = Math.atan2(dy, dx) + side * (0.55 + (beamHash(f, 3, bF) + 0.5) * 0.5), len = hw * (1.6 + (beamHash(f, 5, bF) + 0.5) * 1.2);
            const mx = beamMx[p] + Math.cos(ang) * len * 0.5 + nx * beamHash(f, 1, bF) * hw * 0.6, my = beamMy[p] + Math.sin(ang) * len * 0.5 + ny * beamHash(f, 1, bF) * hw * 0.6;
            ctx.beginPath(); ctx.moveTo(beamMx[p], beamMy[p]); ctx.lineTo(mx, my); ctx.lineTo(beamMx[p] + Math.cos(ang) * len, beamMy[p] + Math.sin(ang) * len); ctx.stroke();
          }
          // flares at the staff and at the far end, plus an impact ring
          ctx.globalCompositeOperation = 'lighter';
          const fl = (x, y, r) => { ctx.fillStyle = 'rgba(120,255,140,0.3)'; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = 'rgba(210,255,210,0.6)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, Math.PI * 2); ctx.fill(); };
          fl(sx, sy, hw * 0.7); fl(ex, ey, hw * 1.1);
          ctx.strokeStyle = 'rgba(190,255,190,0.7)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(ex, ey, hw * (1.5 + 0.5 * ((gameTime * 6) % 1)), 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
      }

      // Hero Projectiles (Outlined Crystal Shard + 3-segment trail)
      heroProjectiles.forEach(p => {
        ctx.save();
        const ang = Math.atan2(p.vy, p.vx);

        if (!SPRITES['shard-blue']) p.trail.forEach((pos, idx) => { // painted shard has its own trail
          ctx.save();
          ctx.translate(pos.x, pos.y);
          ctx.rotate(ang);
          ctx.globalAlpha = (idx + 1) * 0.22;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.moveTo(8, 0);
          ctx.lineTo(-8, -4);
          ctx.lineTo(-4, 0);
          ctx.lineTo(-8, 4);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });

        // Painted crystal shard (Flow art, faces right, carries its own energy trail)
        const shardImg = SPRITES[p.isStormStaff ? 'shard-green' : 'shard-blue'];
        if (shardImg && shardImg.complete && shardImg.naturalWidth) {
          ctx.translate(p.x, p.y);
          ctx.rotate(ang);
          const len = 58 * (p.size || 1);
          const hgt = len * shardImg.naturalHeight / shardImg.naturalWidth;
          ctx.drawImage(shardImg, -len * 0.62, -hgt / 2, len, hgt); // tip sits just ahead of the hit point
          ctx.restore();
          return;
        }

        ctx.translate(p.x, p.y);
        ctx.rotate(ang);
        if (p.size && p.size !== 1) ctx.scale(p.size, p.size); // Piercing Lance: one huge bolt

        ctx.fillStyle = p.isStormStaff ? '#1E7A2E' : '#0284c7';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-12, -7);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-12, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Top highlight facet
        ctx.fillStyle = p.isStormStaff ? '#7CFF6B' : '#bae6fd';
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-12, -7);
        ctx.lineTo(-5, 0);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      });

      // Enemy Projectiles
      const orbImg = SPRITES['vfx-enemyorb'];
      enemyProjectiles.forEach(ep => {
        ctx.save();
        ctx.translate(ep.x, ep.y);
        if (orbImg && orbImg.complete && orbImg.naturalWidth) {
          // Painted swamp-magic orb: 6-frame swirl loop, trail points back along its flight
          const fw = orbImg.naturalWidth / 6, size = ep.radius * 5.2;
          const frame = Math.floor(gameTime * 12 + ep.x * 0.01) % 6;
          ctx.rotate(Math.atan2(ep.vy, ep.vx));
          ctx.drawImage(orbImg, frame * fw, 0, fw, orbImg.naturalHeight, -size * 0.62, -size / 2, size, size);
          ctx.restore();
          return;
        }
        ctx.fillStyle = '#a855f7';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, ep.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, ep.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Chain Lightning & Retained Particles
      particles.forEach(pt => {
        ctx.save();
        if (pt.type === 'lightning_bolt') {
          if (pt.fromTip) { const tp = staffTip(); pt.x1 = tp.x; pt.y1 = tp.y; }
          // Chain Lightning as BLUE lightning (same look as the Arcane Beam, other colour): soft aura, 3 jagged strands, short forks, glowing flares at the staff and at the target
          const cdx = pt.x2 - pt.x1, cdy = pt.y2 - pt.y1, cLen = Math.hypot(cdx, cdy) || 1;
          const cnx = -cdy / cLen, cny = cdx / cLen;
          const cn = Math.max(6, Math.min(BEAM_MAXN - 1, Math.round(cLen / 28)));
          const cF = Math.floor(gameTime * 30) + ((pt.x2 * 13 + pt.y2 * 7) | 0), chw = 9;
          ctx.globalAlpha = Math.min(1, 0.4 + 0.6 * (pt.life / pt.maxLife));
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.globalCompositeOperation = 'lighter';
          ctx.beginPath(); ctx.moveTo(pt.x1 | 0, pt.y1 | 0); ctx.lineTo(pt.x2 | 0, pt.y2 | 0);
          ctx.lineWidth = 17.1; ctx.strokeStyle = 'rgba(40,130,255,0.12)'; ctx.stroke();
          ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(120,200,255,0.18)'; ctx.stroke();
          ctx.globalCompositeOperation = 'source-over';
          if (pt._cf !== cF || pt._cn !== cn) { // cache the noise per bolt: recomputed only when the 30 Hz noise frame (or length bucket) changes
            if (!pt._j) { pt._j = new Float32Array(3 * BEAM_MAXN + 12); pt._e = new Float32Array(BEAM_MAXN); }
            const J = pt._j, E = pt._e;
            for (let i = 0; i <= cn; i++) E[i] = Math.sin(Math.PI * (i / cn)) * 0.9 + (i > 0 && i < cn ? 0.1 : 0);
            for (let k = 0; k < 3; k++) for (let i = 0; i <= cn; i++) J[k * BEAM_MAXN + i] = beamHash(i, k + 11, cF);
            for (let f = 0; f < 3; f++) { const o = 3 * BEAM_MAXN + f * 4; J[o] = beamHash(f, 17, cF); J[o + 1] = beamHash(f, 19, cF); J[o + 2] = beamHash(f, 13, cF); J[o + 3] = beamHash(f, 15, cF); }
            pt._cf = cF; pt._cn = cn;
          }
          const cJ = pt._j, cE = pt._e;
          for (let k = 0; k < 3; k++) {
            const amp = chw * (k === 0 ? 0.6 : 0.85);
            for (let i = 0; i <= cn; i++) {
              const t = i / cn, e = cE[i];
              const j = cJ[k * BEAM_MAXN + i] * 2 * amp * e;
              beamCx[i] = pt.x1 + cdx * t + cnx * j; beamCy[i] = pt.y1 + cdy * t + cny * j;
            }
            if (k === 0) for (let i = 0; i <= cn; i++) { beamMx[i] = beamCx[i]; beamMy[i] = beamCy[i]; }
            ctx.beginPath(); ctx.moveTo(beamCx[0] | 0, beamCy[0] | 0); // whole-pixel vertices: integers are not boxed per call (the bolt was ~11 MB/s of garbage)
            for (let i = 1; i <= cn; i++) ctx.lineTo(beamCx[i] | 0, beamCy[i] | 0);
            ctx.lineWidth = k === 0 ? 9 : 5.4; ctx.strokeStyle = '#081a3a'; ctx.stroke();
            ctx.lineWidth = k === 0 ? 5.4 : 3.24; ctx.strokeStyle = k === 0 ? '#2f9bff' : '#5cb8ff'; ctx.stroke();
            ctx.lineWidth = k === 0 ? 2.2 : 1.32; ctx.strokeStyle = '#f0f8ff'; ctx.stroke();
          }
          ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 2.6;

            const ang = Math.atan2(cdy, cdx) + side * (0.55 + (cJ[o + 2] + 0.5) * 0.5), len = chw * (1.6 + (cJ[o + 3] + 0.5) * 1.2);
            ctx.beginPath(); ctx.moveTo(beamMx[p] | 0, beamMy[p] | 0); ctx.lineTo((beamMx[p] + Math.cos(ang) * len * 0.5) | 0, (beamMy[p] + Math.sin(ang) * len * 0.5) | 0); ctx.lineTo((beamMx[p] + Math.cos(ang) * len) | 0, (beamMy[p] + Math.sin(ang) * len) | 0); ctx.stroke();
          }
          // flares at the staff and at the target, plus an impact ring
          ctx.globalCompositeOperation = 'lighter';
          chainFlare(pt.x1, pt.y1, chw * 0.8); chainFlare(pt.x2, pt.y2, chw * 1.1);
          ctx.strokeStyle = 'rgba(180,220,255,0.7)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(pt.x2 | 0, pt.y2 | 0, (chw * (1.5 + 0.5 * ((gameTime * 6) % 1))) | 0, 0, CHAIN_TAU); ctx.stroke();
        } else if (pt.type === 'meteor_telegraph') {
          // Red ground-warning circle that tightens as the meteor comes in
          const p = Math.min(1, 1 - pt.timer / pt.totalTimer);
          ctx.fillStyle = `rgba(239, 68, 68, ${0.18 + 0.22 * p})`;
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.ellipse(pt.x, pt.y, pt.radius, pt.radius * 0.65, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(pt.x, pt.y, pt.radius * (1 - p), pt.radius * 0.65 * (1 - p), 0, 0, Math.PI * 2);
          ctx.stroke();
          // Painted meteor diving from the sky (top-left) onto the circle, accelerating
          const mImg = SPRITES['meteorfall'];
          if (mImg && mImg.complete && mImg.naturalWidth) {
            const fall = Math.pow(p, 1.7);
            const size = (pt.isComet ? 400 : 250) * (0.75 + 0.25 * fall);
            const hx = pt.x - 300 * (1 - fall), hy = pt.y - 620 * (1 - fall); // rock head position
            const fw = mImg.naturalWidth / 6, frame = Math.floor(gameTime * 14) % 6;
            ctx.drawImage(mImg, frame * fw, 0, fw, mImg.naturalHeight, hx - size * 0.56, hy - size * 0.56, size, size);
          }
        } else if (pt.type === 'chunk') {
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.fillStyle = pt.color;
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-pt.size, -pt.size * 0.7);
          ctx.lineTo(pt.size * 0.8, -pt.size * 0.5);
          ctx.lineTo(pt.size, pt.size * 0.8);
          ctx.lineTo(-pt.size * 0.6, pt.size * 0.6);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else if (pt.type === 'collect_ring') {
          const prog = 1 - (pt.life / pt.maxLife);
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.radius + 18 * prog, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (pt.type === 'arcane_orb') {
          const r = 7 * pt.size;
          const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r * 2.2);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(0.35, '#d8b4fe');
          g.addColorStop(1, 'rgba(168, 85, 247, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r * 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (pt.type === 'hex_totem') {
          const fade = Math.min(1, pt.life / 0.4);
          const age = pt.maxLife - pt.life;
          // hex ground area: soft magenta disc + rotating hexagon + bright rim, all projected on the floor (ellipse 0.65)
          const hxR = pt.rad, hxY = pt.rad * 0.65, hxPulse = 0.5 + 0.5 * Math.sin(gameTime * 5);
          ctx.globalAlpha = fade * (0.13 + 0.07 * hxPulse);
          ctx.fillStyle = '#c026d3';
          ctx.beginPath(); ctx.ellipse(pt.x, pt.y, hxR, hxY, 0, 0, Math.PI * 2); ctx.fill();
          ctx.lineJoin = 'round';
          ctx.globalAlpha = fade * (0.55 + 0.25 * hxPulse);
          ctx.strokeStyle = '#e879f9';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(pt.x, pt.y, hxR, hxY, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = fade * (0.5 + 0.2 * hxPulse);
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = gameTime * 0.4 + k * Math.PI / 3;
            const hx = pt.x + Math.cos(a) * hxR * 0.93, hy = pt.y + Math.sin(a) * hxY * 0.93;
            if (k) ctx.lineTo(hx, hy); else ctx.moveTo(hx, hy);
          }
          ctx.closePath(); ctx.stroke();
          ctx.globalAlpha = fade * 0.3;
          ctx.setLineDash([10, 9]);
          ctx.lineDashOffset = -gameTime * 30;
          ctx.beginPath(); ctx.ellipse(pt.x, pt.y, hxR * 0.55, hxY * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = fade;
          const img = SPRITES['hextotem'];
          if (img && img.complete && img.naturalWidth) {
            // Painted totem (8 frames): slam-in 1,0,2 then idle glow loop 3..7
            const SLAM = [1, 0, 2];
            const frame = age < 0.27 ? SLAM[Math.min(2, Math.floor(age / 0.09))] : 3 + Math.floor((age - 0.27) * 8) % 5;
            const fw = img.naturalWidth / 8, size = 112 * (pt.zapFlash > 0 ? 1.06 : 1);
            const pop = age < 0.09 ? 1.25 - age * 2.8 : 1; // drops in big, settles
            ctx.drawImage(img, frame * fw, 0, fw, img.naturalHeight, pt.x - size * pop / 2, pt.y - size * pop * 0.86, size * pop, size * pop);
            if (pt.zapFlash > 0) { // eye flare
              ctx.globalCompositeOperation = 'lighter';
              const g = ctx.createRadialGradient(pt.x, pt.y - 84, 0, pt.x, pt.y - 84, 26);
              g.addColorStop(0, 'rgba(255,200,255,0.9)'); g.addColorStop(1, 'rgba(192,38,211,0)');
              ctx.fillStyle = g;
              ctx.beginPath(); ctx.arc(pt.x, pt.y - 84, 26, 0, Math.PI * 2); ctx.fill();
              ctx.globalCompositeOperation = 'source-over';
            }
          } else {
            ctx.fillStyle = '#3b1d5e';
            ctx.fillRect(pt.x - 9, pt.y - 56, 18, 56);
          }
        } else if (pt.type === 'gravity_well') {
          const prog = 1 - pt.life / pt.maxLife;
          for (let k = 0; k < 3; k++) {
            const rr = pt.rad * (1 - ((prog * 2 + k / 3) % 1));
            ctx.strokeStyle = `rgba(168, 85, 247, ${0.25 + 0.5 * (1 - rr / pt.rad)})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(pt.x, pt.y, rr, rr * 0.65, gameTime * 3 + k, 0, Math.PI * 1.4);
            ctx.stroke();
          }
          ctx.fillStyle = '#1e0b33';
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 10 + 8 * prog, 0, Math.PI * 2);
          ctx.fill();
        } else if (pt.type === 'spectral_blade') {
          for (let k = pt.trail.length - 1; k >= 0; k--) { // 3 fading ghost copies
            const g = pt.trail[k];
            drawSpectralBlade(g.x, g.y, g.spin, pt.size, 0.38 - k * 0.11);
          }
          drawSpectralBlade(pt.x, pt.y, pt.spin, pt.size, Math.min(1, pt.life / 0.15));
        } else if (pt.type === 'reaper_slash') {
          const k = pt.life / pt.maxLife;
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.globalAlpha = k;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#1a1a1a';
          ctx.lineWidth = 10 * k + 2;
          ctx.beginPath(); ctx.arc(0, 0, 34, -0.9, 0.9); ctx.stroke();
          ctx.strokeStyle = '#e0f2fe';
          ctx.lineWidth = 6 * k + 1;
          ctx.stroke();
        } else if (pt.type === 'xp_sparkle') {
          ctx.font = '900 13px Trebuchet MS';
          ctx.textAlign = 'center';
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#1a1a1a';
          ctx.strokeText(pt.text, pt.x, pt.y);
          ctx.fillStyle = '#ffd23f';
          ctx.fillText(pt.text, pt.x, pt.y);
        }
        ctx.restore();
      });

      // Damage Numbers with pop-in and dark outline (supports green heal)
      damageNumbers.forEach(dn => {
        ctx.save();
        const prog = 1 - (dn.life / dn.maxLife);
        const popScale = prog < 0.2 ? (0.6 + prog * 3) : 1;

        ctx.translate(dn.x, dn.y);
        ctx.scale(popScale, popScale);

        ctx.font = dn.isCrit ? '900 24px Trebuchet MS' : '800 17px Trebuchet MS';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#1a1a1a';
        ctx.fillStyle = dn.isHeal ? '#4ade80' : (dn.isCrit ? '#ffd23f' : '#ffffff');
        ctx.strokeText(dn.text, 0, 0);
        ctx.fillText(dn.text, 0, 0);
        ctx.restore();
      });
    }

    // --- HUD (RESPONSIVE & CLEAN AT 390PX) ---
    // Painted frames from sprites/ui; channel insets are fractions of each PNG, measured from slice_ui.py output.
    const HUD_HP_CHANNEL = { x0: 0.152, x1: 0.93, y0: 0.37, y1: 0.63 };
    const HUD_XP_CHANNEL = { x0: 0.10, x1: 0.945, y0: 0.38, y1: 0.62 };
    const HUD_TEXT = '#f3e2b8';
    const HUD_OUTLINE = '#140f0c';

    function hudImage(key, x, y, w, h) {
      const img = SPRITES[key];
      if (img) ctx.drawImage(img, x, y, w, h);
      return !!img;
    }

    function hudText(text, x, y, size, color = HUD_TEXT) {
      ctx.save();
      ctx.font = `900 ${size}px Trebuchet MS`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(2.5, size * 0.28);
      ctx.strokeStyle = HUD_OUTLINE;
      ctx.strokeText(text, x, y);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // Frame first (its channel is opaque dark stone), then the fill inside the channel.
    function drawFramedBar(key, ch, x, y, w, h, pct, fill) {
      const fx = x + w * ch.x0, fy = y + h * ch.y0;
      const fw = w * (ch.x1 - ch.x0), fh = h * (ch.y1 - ch.y0);
      if (!hudImage(key, x, y, w, h)) {
        ctx.fillStyle = '#1a1414';
        ctx.fillRect(fx, fy, fw, fh);
      }
      if (pct <= 0) return;
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.roundRect(fx, fy, fw * pct, fh, Math.min(3, fh / 2));
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect(fx + 1, fy + 1, Math.max(0, fw * pct - 2), fh * 0.3);
    }

    // --- HP BAR JUICE: delayed ghost chunk, shake + white flash, heart pop, floating -N, heal flash, low-HP pulse ---
    // Diffs hero.hp once per HUD frame, so every damage/heal source is covered without touching damage code.
    const HP_GHOST_HOLD = 0.35, HP_SHAKE_S = 0.25, HP_FLASH_S = 0.14, HP_POP_S = 0.32, HP_HEAL_S = 0.45, HP_NUM_S = 0.85;
    const HP_HEART = { cx: 87, cy: 64, r: 30, src: 900 }; // gem in hp-frame.png (900x132 source px)
    const HPFX = { last: -1, ghost: 1, hold: 0, shake: 0, flash: 0, pop: 0, popHeal: false, heal: 0, ni: 0,
      nums: [{ t: 0, txt: '', x: 0 }, { t: 0, txt: '', x: 0 }, { t: 0, txt: '', x: 0 }, { t: 0, txt: '', x: 0 }] };

    function updateHpFx(dt, pct, cutX) {
      const hp = hero.hp;
      if (HPFX.last < 0) { HPFX.last = hp; HPFX.ghost = pct; }
      const d = hp - HPFX.last;
      HPFX.last = hp;
      if (d < -0.01) { // damage (regen only ever adds)
        HPFX.hold = HP_GHOST_HOLD; HPFX.shake = HP_SHAKE_S; HPFX.flash = HP_FLASH_S;
        HPFX.pop = HP_POP_S; HPFX.popHeal = false; HPFX.heal = 0;
        const n = HPFX.nums[HPFX.ni = (HPFX.ni + 1) % HPFX.nums.length];
        n.t = HP_NUM_S; n.txt = '-' + Math.max(1, Math.round(-d)); n.x = cutX;
      } else if (d >= 2) { // potion / siphon / max-HP heal; passive regen is ~0.9 HP/s and never reaches this
        HPFX.heal = HP_HEAL_S; HPFX.pop = HP_POP_S; HPFX.popHeal = true;
      }
      if (HPFX.ghost < pct) HPFX.ghost = pct;
      else if (HPFX.hold > 0) HPFX.hold -= dt;
      else HPFX.ghost = Math.max(pct, HPFX.ghost - (0.12 + (HPFX.ghost - pct) * 4) * dt);
      HPFX.shake = Math.max(0, HPFX.shake - dt);
      HPFX.flash = Math.max(0, HPFX.flash - dt);
      HPFX.pop = Math.max(0, HPFX.pop - dt);
      HPFX.heal = Math.max(0, HPFX.heal - dt);
      for (let i = 0; i < HPFX.nums.length; i++) if (HPFX.nums[i].t > 0) HPFX.nums[i].t -= dt;
    }

    function drawHpBar(dt, x, y, w, h, pct) {
      const ch = HUD_HP_CHANNEL;
      const fx = x + w * ch.x0, fy = y + h * ch.y0, fw = w * (ch.x1 - ch.x0), fh = h * (ch.y1 - ch.y0);
      updateHpFx(dt, pct, fx + fw * pct);
      const low = pct > 0 && pct < 0.3;
      const beat = low ? Math.max(0, 1 - heartbeatTimer / 0.35) : 0; // heartbeatTimer resets on each Sound.heartbeat()
      const shk = HPFX.shake > 0 ? (HPFX.shake / HP_SHAKE_S) * 4 : 0;
      ctx.save();
      if (shk) ctx.translate((Math.random() - 0.5) * 2 * shk, (Math.random() - 0.5) * 2 * shk);
      drawFramedBar('ui-hp-frame', ch, x, y, w, h, pct, low ? '#ff3b3b' : '#c92a2a');
      if (HPFX.ghost > pct + 0.001) { // the lost chunk, pale while it hangs, then drains
        ctx.globalAlpha = HPFX.hold > 0 ? 1 : 0.8;
        ctx.fillStyle = HPFX.hold > 0 ? '#fff4f0' : '#ff9d9d';
        ctx.fillRect(fx + fw * pct, fy, fw * (HPFX.ghost - pct), fh);
      }
      if (pct > 0 && (HPFX.heal > 0 || beat > 0)) { // heal = green wash, low HP = red throb on the beat
        ctx.globalAlpha = HPFX.heal > 0 ? (HPFX.heal / HP_HEAL_S) * 0.75 : beat * 0.55;
        ctx.fillStyle = HPFX.heal > 0 ? '#5ef08a' : '#ffb0a8';
        ctx.fillRect(fx, fy, fw * pct, fh);
      }
      const img = SPRITES['ui-hp-frame'];
      if (HPFX.flash > 0 && img) { // whole frame flashes white
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (HPFX.flash / HP_FLASH_S) * 0.7;
        ctx.drawImage(img, x, y, w, h);
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = 1;
      if (img && (HPFX.pop > 0 || beat > 0 || HPFX.heal > 0)) drawHeartPop(img, x, y, w, beat);
      hudText(`${Math.round(hero.hp)}/${hero.maxHp}`, x + w * 0.54, y + h * 0.5, 11);
      ctx.restore();
      for (let i = 0; i < HPFX.nums.length; i++) { // floating -N from the cut point
        const n = HPFX.nums[i];
        if (n.t <= 0) continue;
        const p = 1 - n.t / HP_NUM_S;
        ctx.globalAlpha = 1 - p * p;
        hudText(n.txt, n.x, y + h * 0.5 - 6 - p * 26, Math.round(15 * (1 + 0.45 * Math.max(0, 1 - p * 6))), '#ff4a4a');
      }
      ctx.globalAlpha = 1;
    }

    function drawHeartPop(img, x, y, w, beat) {
      const k = w / HP_HEART.src;
      let s = 1 + 0.12 * beat;
      if (HPFX.pop > 0) { const p = 1 - HPFX.pop / HP_POP_S; s = 1 + 0.25 * Math.cos(p * Math.PI * 1.5) * (1 - p); } // 1.25 -> undershoot -> 1
      ctx.save();
      ctx.translate(x + HP_HEART.cx * k, y + HP_HEART.cy * k);
      ctx.scale(s, 1 + (s - 1) * 0.55); // squash: wider than tall on the pop
      ctx.beginPath();
      ctx.arc(0, 0, HP_HEART.r * k, 0, Math.PI * 2);
      ctx.clip();
      const r = HP_HEART.r;
      ctx.drawImage(img, HP_HEART.cx - r, HP_HEART.cy - r, r * 2, r * 2, -r * k, -r * k, r * 2 * k, r * 2 * k);
      const tint = HPFX.pop > 0 ? HPFX.pop / HP_POP_S : (HPFX.heal > 0 ? HPFX.heal / HP_HEAL_S : beat);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = tint * 0.6;
      ctx.fillStyle = HPFX.popHeal && (HPFX.pop > 0 || HPFX.heal > 0) ? '#3ddc6e' : (HPFX.pop > 0 ? '#ffffff' : '#ff3030');
      ctx.fillRect(-r * k, -r * k, r * 2 * k, r * 2 * k);
      ctx.restore();
    }

    // --- ABILITY INVENTORY (bottom-left): weapons row(s) at the bottom, passives above; clock-wipe cooldowns ---
    const INV_DASH_CLEAR = 122;   // px kept free on the right for the dash button
    const INV_POP_S = 0.28;
    const INV_DARK = 'rgba(8, 6, 14, 0.68)';
    const invIcons = {};          // registry id -> Image | canvas (tinted once) | null while loading
    const invPassiveSeen = {};    // passive id -> last drawn level (level-up pop)
    const invPassivePop = {};

    function invIcon(id, reg) {
      if (id in invIcons) return invIcons[id];
      invIcons[id] = null;
      const img = new Image();
      img.onload = () => {
        if (!reg.iconFilter) { invIcons[id] = img; return; }
        const c = document.createElement('canvas'); // ponytail: tint baked once; ctx.filter unsupported -> untinted icon
        c.width = c.height = 64;
        const cx = c.getContext('2d');
        cx.filter = reg.iconFilter;
        cx.drawImage(img, 0, 0, 64, 64);
        invIcons[id] = c;
      };
      img.onerror = () => { invIcons[id] = false; };
      img.src = reg.iconSrc || `sprites/icons/${id}.png`;
      return null;
    }

    // frac: 0 = ready (bright), 1 = just fired (fully dark); dark part shrinks clockwise from 12 o'clock
    function drawInvSlot(x, y, s, id, reg, label, evo, frac, pop) {
      const k = pop > 0 ? pop / INV_POP_S : 0;
      ctx.save();
      ctx.translate(x + s / 2, y + s / 2);
      if (k > 0) ctx.scale(1 + 0.22 * k, 1 + 0.22 * k);
      const h = s / 2;
      ctx.beginPath();
      ctx.roundRect(-h, -h, s, s, 5);
      ctx.fillStyle = '#1e192c';
      ctx.fill();
      ctx.save();
      ctx.clip();
      const icon = invIcon(id, reg);
      if (icon) ctx.drawImage(icon, -h + 1, -h + 1, s - 2, s - 2);
      else { ctx.font = `${Math.round(s * 0.6)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(reg.icon, 0, 1); }
      if (frac > 0) {
        const top = -Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, s, top + (1 - frac) * Math.PI * 2, top + Math.PI * 2);
        ctx.closePath();
        ctx.fillStyle = INV_DARK;
        ctx.fill();
      }
      if (k > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${0.55 * k})`; ctx.fillRect(-h, -h, s, s); }
      ctx.restore();
      ctx.beginPath();
      ctx.roundRect(-h, -h, s, s, 5);
      ctx.lineWidth = evo ? 2.5 : 1.5;
      ctx.strokeStyle = evo ? '#ffd23f' : '#8a6d3b';
      ctx.stroke();
      ctx.restore();
      hudText(label, x + s - (evo ? 9 : 4), y + s - 4, evo ? 8 : 10, evo ? '#ffd23f' : HUD_TEXT);
    }

    function drawInventory(dt) {
      const s = screenW < 500 ? 26 : 34, gap = 4, step = s + gap;
      const cols = Math.max(4, Math.floor((screenW - 8 - INV_DASH_CLEAR) / step));
      const passives = Object.keys(PASSIVE_REGISTRY).filter(id => hero.passives[id] > 0);
      const wRows = Math.ceil(hero.weapons.length / cols);
      const baseY = screenH - 10 - s;
      hero.weapons.forEach((w, i) => {
        const reg = WEAPON_REGISTRY[w.id];
        const hasCd = reg.levels[0].cd !== undefined && !(w.id === 'beam' && activeBeam);
        const frac = hasCd && w.cdMax > 0 ? Math.max(0, Math.min(1, w.timer / w.cdMax)) : 0;
        const lvlKey = w.level * 10 + (w.evo ? 1 : 0);
        if (w.hudLvl !== undefined && w.hudLvl !== lvlKey) w.hudPop = INV_POP_S;
        if (w.hudFrac > 0 && frac === 0) w.hudPop = INV_POP_S; // ready again
        w.hudLvl = lvlKey; w.hudFrac = frac;
        if (w.hudPop > 0) w.hudPop -= dt;
        const row = Math.floor(i / cols), col = i % cols;
        drawInvSlot(8 + col * step, baseY - row * step, s, w.id, reg, w.evo ? 'EVO' : String(w.level), !!w.evo, frac, w.hudPop || 0);
      });
      passives.forEach((id, i) => {
        const lvl = hero.passives[id];
        if (invPassiveSeen[id] !== undefined && invPassiveSeen[id] !== lvl) invPassivePop[id] = INV_POP_S;
        invPassiveSeen[id] = lvl;
        if (invPassivePop[id] > 0) invPassivePop[id] -= dt;
        const row = wRows + Math.floor(i / cols), col = i % cols;
        drawInvSlot(8 + col * step, baseY - row * step - 4, s, id, PASSIVE_REGISTRY[id], String(lvl), false, 0, invPassivePop[id] || 0);
      });
    }

    let invLastT = 0;
    function drawHUD() {
      const nowT = performance.now() / 1000;
      const hudDt = isPausedByUser || isPausedForModal ? 0 : Math.min(0.05, nowT - invLastT); // real time: pops play out even when ?speed=N
      drawInventory(hudDt);
      invLastT = nowT;
      // 1. Top-left: level badge, HP bar, XP bar
      const badge = 54;
      const bx = 8, by = 8;
      const hpW = Math.max(180, Math.min(320, screenW * 0.52));
      const hpH = hpW * 132 / 900;
      const hpX = bx + badge - 8, hpY = by + 6;
      const hpPct = Math.max(0, Math.min(1, hero.hp / hero.maxHp));
      drawHpBar(hudDt, hpX, hpY, hpW, hpH, hpPct);

      const xpW = hpW * 0.9, xpH = xpW * 80 / 900;
      const xpX = hpX + 4, xpY = hpY + hpH - 2;
      drawFramedBar('ui-xp-frame', HUD_XP_CHANNEL, xpX, xpY, xpW, xpH, Math.min(1, hero.xp / hero.xpNeeded), '#38bdf8');

      const badgeH = badge * 582 / 606;
      if (!hudImage('ui-level-badge', bx, by, badge, badgeH)) {
        ctx.fillStyle = '#2a2420';
        ctx.beginPath();
        ctx.arc(bx + badge / 2, by + badgeH / 2, badge / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
      }
      hudText(String(hero.level), bx + badge / 2, by + badgeH * 0.53, 18);

      let leftBottom = Math.max(by + badgeH, xpY + xpH);
      let rowX = xpX + 4;
      const rowY = leftBottom + 3;

      // Relic icons under the XP bar
      if (hero.relics.size > 0) {
        hero.relics.forEach(relicId => {
          ctx.save();
          ctx.translate(rowX, rowY);
          ctx.fillStyle = '#1e192c';
          ctx.strokeStyle = '#c9a24a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(0, 0, 18, 18, 4);
          ctx.fill();
          ctx.stroke();

          const rImg = SPRITES[relicId];
          if (rImg && rImg.complete && rImg.naturalWidth > 0) {
            ctx.drawImage(rImg, 2, 2, 14, 14);
          } else {
            ctx.font = '10px sans-serif';
            ctx.fillText('⭐', 3, 13);
          }
          ctx.restore();
          rowX += 22;
        });
        leftBottom = rowY + 18;
      }

      // Boots timer icon, same row as the relics
      if (hero.speedBuffTimer > 0) {
        ctx.save();
        ctx.translate(rowX + 2, rowY - 2);
        const bImg = SPRITES['boots'];
        if (bImg && bImg.complete && bImg.naturalWidth > 0) {
          ctx.drawImage(bImg, 0, 0, 22, 22);
        } else {
          ctx.font = '16px sans-serif';
          ctx.fillText('👢', 0, 17);
        }
        ctx.restore();
        hudText(`${hero.speedBuffTimer.toFixed(1)}s`, rowX + 44, rowY + 9, 12, '#38bdf8');
        leftBottom = rowY + 20;
      }

      // 2. Timer plate (top-centre; right column on narrow screens) and kill plate (top-right)
      const mins = Math.floor(gameTime / 60);
      const secs = Math.floor(gameTime % 60);
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const kW = 100, kH = kW * 190 / 439;
      const tW = 96, tH = tW * 209 / 761;
      const narrow = (screenW - tW) / 2 < hpX + hpW + 8; // centred timer would hit the HP bar
      const kX = screenW - 8 - kW - (narrow ? 0 : PAUSE_BTN_SIZE + 6); // wide: pause button sits right of the kill plate
      const tX = narrow ? kX + (kW - tW) / 2 : (screenW - tW) / 2;
      const tY = 8;
      const kY = narrow ? tY + tH + 2 : 8;
      hudImage('ui-timer-plate', tX, tY, tW, tH);
      hudText(timeStr, tX + tW / 2, tY + tH * 0.54, 16);
      hudImage('ui-kill-plate', kX, kY, kW, kH);
      hudText(String(killCount), kX + kW * 0.6, kY + kH * 0.5, 16, '#ffd23f');

      // Pause button (DOM): top-right on wide screens, under the right column on narrow ones
      const pX = screenW - 8 - PAUSE_BTN_SIZE;
      const pY = narrow ? kY + kH + 4 : 10;
      placePauseButton(pX, pY);

      const hudBottom = Math.max(leftBottom, kY + kH, tY + tH, pY + PAUSE_BTN_SIZE);

      // 5. Boss Bar
      const activeBoss = enemies.find(e => e.isBoss && e.hp > 0);
      if (activeBoss) {
        ctx.save();
        const barW = Math.min(screenW - 48, 380);
        const barX = (screenW - barW) / 2;
        const barY = Math.round(hudBottom + 8);

        ctx.fillStyle = '#14111e';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, 22, 6);
        ctx.fill();
        ctx.stroke();

        const bossPct = Math.max(0, activeBoss.hp / activeBoss.maxHp);
        ctx.fillStyle = activeBoss.isFinalBoss ? '#ff3366' : '#eab308';
        ctx.beginPath();
        ctx.roundRect(barX + 2, barY + 2, Math.max(0, (barW - 4) * bossPct), 18, 4);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 11px Trebuchet MS';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2.5;
        ctx.strokeText(activeBoss.bossName, screenW / 2, barY + 15);
        ctx.fillText(activeBoss.bossName, screenW / 2, barY + 15);
        ctx.restore();
      }

      // 6. Virtual Joystick (ONLY drawn while touch or pointer is actually held down)
      if (joystick.active) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(joystick.startX, joystick.startY, joystick.maxRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(joystick.startX + joystick.dx * joystick.maxRadius, joystick.startY + joystick.dy * joystick.maxRadius, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- LOW HEALTH VIGNETTE & HEARTBEAT ---
    function drawLowHealthVignette() {
      ctx.save();
      const pulse = 0.5 + Math.sin(gameTime * 7) * 0.35;
      const grad = ctx.createRadialGradient(screenW / 2, screenH / 2, screenW * 0.25, screenW / 2, screenH / 2, screenW * 0.65);
      grad.addColorStop(0, 'rgba(239, 68, 68, 0)');
      grad.addColorStop(1, `rgba(239, 68, 68, ${0.45 * pulse})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, screenW, screenH);
      ctx.restore();
    }

    // --- MAIN MENU, PAUSE & SOUND TOGGLE ---
    // Test URLs (?god / ?speed) and restarts (?nomenu=1) skip the menu so automated runs start at once.
    const isTestMode = urlParams.has('god') || urlParams.has('speed');
    let runStarted = isTestMode || urlParams.get('nomenu') === '1';
    let isPausedByUser = false;
    const PAUSE_BTN_SIZE = 40;
    const MENU_FADE_MS = 450;
    const MUTE_KEY = 'svti-muted';
    let isMuted = false;
    try { isMuted = localStorage.getItem(MUTE_KEY) === '1'; } catch (err) { /* storage blocked: sound stays on */ }

    // Mute = suspend the shared AudioContext (music + sfx both route through it).
    function applyMute() {
      document.querySelectorAll('.sound-toggle').forEach(b => {
        b.classList.toggle('muted', isMuted);
        b.setAttribute('aria-label', isMuted ? 'Sound off' : 'Sound on');
      });
      if (!audioCtx) return;
      if (isMuted) audioCtx.suspend();
      else if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function toggleMute() {
      isMuted = !isMuted;
      try { localStorage.setItem(MUTE_KEY, isMuted ? '1' : '0'); } catch (err) { /* choice not persisted */ }
      applyMute();
    }
    // The audio block resumes the context on every gesture; re-suspend right after it while muted.
    ['pointerdown', 'click', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, () => {
      if (isMuted && audioCtx && audioCtx.state !== 'suspended') audioCtx.suspend();
    }));
    document.querySelectorAll('[data-sound-toggle]').forEach(b => b.addEventListener('click', toggleMute));
    applyMute();

    const mainMenu = document.getElementById('main-menu');
    if (runStarted) {
      mainMenu.style.display = 'none';
      const ls = document.getElementById('loading-screen');
      if (ls) ls.style.display = 'none';
    } else {
      // The PLAY click bubbles to window, so it is also the audio-unlock gesture for initAudio.
      document.getElementById('menu-play').addEventListener('click', () => {
        mainMenu.classList.add('hidden');
        setTimeout(() => {
          mainMenu.style.display = 'none';
          runStarted = true; // gameTime never ticked on the menu: the run starts at 0:00
        }, MENU_FADE_MS);
      }, { once: true });
    }

    const pauseModal = document.getElementById('pause-modal');
    const pauseBtn = document.getElementById('pause-btn');
    function setPaused(on) {
      if (on && (!runStarted || isGameOver || isPausedForModal)) return;
      isPausedByUser = on;
      pauseModal.style.display = on ? 'flex' : 'none';
    }
    pauseBtn.addEventListener('click', () => setPaused(true));
    document.getElementById('pause-resume').addEventListener('click', () => setPaused(false));
    window.addEventListener('keydown', e => {
      if (e.code === 'Escape' || e.code === 'KeyP') setPaused(!isPausedByUser);
    });
    if (!isTestMode) {
      window.addEventListener('blur', () => setPaused(true));
      document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
    }

    function reloadTo(menu) {
      const u = new URL(window.location.href);
      if (menu) u.searchParams.delete('nomenu');
      else u.searchParams.set('nomenu', '1');
      window.location.href = u.toString();
    }
    document.getElementById('pause-restart').addEventListener('click', () => reloadTo(false));
    document.getElementById('pause-home').addEventListener('click', () => reloadTo(true));

    // Called by drawHUD every frame; touches the DOM only when the slot or visibility changes.
    let pauseBtnKey = '';
    function placePauseButton(x, y) {
      const visible = runStarted && !isGameOver && !isPausedForModal && !isPausedByUser;
      const key = visible ? `${Math.round(x)},${Math.round(y)}` : 'hidden';
      if (key === pauseBtnKey) return;
      pauseBtnKey = key;
      pauseBtn.style.display = visible ? 'block' : 'none';
      pauseBtn.style.left = `${Math.round(x)}px`;
      pauseBtn.style.top = `${Math.round(y)}px`;
    }

    // --- MAIN GAME LOOP ---
    let lastTimestamp = performance.now();

    function loop(currentTimestamp) {
      requestAnimationFrame(loop);

      const rawDt = Math.min((currentTimestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = currentTimestamp;

      if (hitStopFrames > 0) {
        hitStopFrames--;
        draw();
        return;
      }

      if (isPausedForModal || isGameOver || isPausedByUser || !runStarted) {
        draw();
        return;
      }

      // Slow motion: time runs at 25% and eases back to normal over the last 40% of the window
      let slowScale = 1;
      if (slowMoT > 0) {
        slowMoT = Math.max(0, slowMoT - rawDt);
        const k = slowMoT / slowMoDur;
        slowScale = k > 0.4 ? 0.25 : 0.25 + 0.75 * (1 - k / 0.4);
      }
      const dt = rawDt * speedMult * slowScale;
      gameTime += dt;
      if (hero.hp > 0 && hero.hp < hero.maxHp) hero.hp = Math.min(hero.maxHp, hero.hp + 0.9 * dt);

      if (gameTime >= 600 && !isGameOver) {
        triggerGameOver(true);
        return;
      }

      if (hero.hp / hero.maxHp < 0.3) {
        heartbeatTimer += dt;
        if (heartbeatTimer >= 0.85) {
          heartbeatTimer = 0;
          Sound.heartbeat();
        }
      }

      const intensity = Math.min(1, gameTime / 540);
      const hasBoss = enemies.some(e => e.isBoss && e.hp > 0);
      updateBGM(dt, intensity, hasBoss);

      updateSpawnDirector(dt);
      updateHero(dt);
      updateEnemies(dt);
      updateProjectilesAndEffects(dt);

      draw();
    }

    requestAnimationFrame(loop);

    // --- GLOBAL TEST HOOKS ---
    window.__state = () => ({
      time: gameTime,
      level: hero.level,
      enemies: enemies.length,
      hp: hero.hp,
      weapons: hero.weapons.map(w => ({ id: w.id, lvl: w.level, evo: w.evo || null })),
      threat: enemies.reduce((a, e) => { const dx = e.x - hero.x, dy = e.y - hero.y, d2 = dx * dx + dy * dy + 1; return [a[0] + dx / d2, a[1] + dy / d2]; }, [0, 0])
    });
    // ?god=1 only: staff-tip / cast-gesture probe for visual QA
    if (isGod) window.__cast = {
      tip: () => ({ ...staffTip() }),
      pose: () => ({ ...heroPose, anim: hero.anim, animT: hero.animT, facing: hero.facing, x: hero.x, y: hero.y, beam: !!activeBeam }),
      face: f => { hero.facing = f; },
      end: v => triggerGameOver(!!v), // leaderboard test: end the run
      spawn: (type, dx = 200, dy = 0, elite = false) => spawnEnemy(type, hero.x + dx, hero.y + dy, elite), // e.g. 'mootaur'
      passive: id => { if (PASSIVE_REGISTRY[id] && hero.passives[id] < MAX_LEVEL) PASSIVE_REGISTRY[id].apply(); return hero.passives[id]; },
      hurt: n => { hero.hp = Math.max(1, hero.hp - n); return hero.hp; }, // HUD juice QA: god mode skips hitHero
      heal: n => { hero.hp = Math.min(hero.maxHp, hero.hp + n); return hero.hp; },
      levelUp: () => openLevelUpModal(false), // opens the real level-up modal (pick with .upgrade-card clicks)
      chest: (allRelics) => { if (allRelics) Object.keys(RELIC_REGISTRY).forEach(id => hero.relics.add(id)); openRelicModal(); },
      // god-mode test hook: an unowned registry weapon is granted first; optional level / evo ('A'|'B')
      fire: (id, level, evo) => {
        let w = hero.weapons.find(x => x.id === id);
        if (!w && WEAPON_REGISTRY[id]) { w = { id, level: 1, timer: 0.1 }; hero.weapons.push(w); }
        if (!w) return false;
        if (level) w.level = Math.max(1, Math.min(MAX_LEVEL, level));
        if (evo === 'A' || evo === 'B') { w.level = MAX_LEVEL; w.evo = evo; }
        fireWeapon(w);
        return true;
      }
    };

  })();
  </script>
</body>
</html>
